<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائلي | Together</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script><style>.wrap{max-width:900px;margin:24px auto;padding:0 14px}.msg{background:#fff;border:1px solid #dbe1e9;border-radius:14px;padding:16px;margin:12px 0}.msg.unread{border-right:5px solid #e53945}.muted{color:#6b7280;font-size:13px}.msg strong,.msg .body{color:#111!important}.body{white-space:pre-wrap;line-height:1.8;color:#111!important}.msg{color:#111}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}</style></head><body><main class="shell wrap"><header class="top"><div class="logo"><div class="mark">T</div><div>رسائلي وإشعاراتي</div></div><a class="btn" href="/marketer/dashboard/">العودة للوحة المسوق</a></header><section class="card"><div class="bar"><div><h2>صندوق الرسائل</h2><p class="muted">الرسائل المرسلة من إدارة Together.</p></div><button id="readAll" class="btn" type="button">تحديد الكل كمقروء</button></div><div id="messages">جارٍ تحميل الرسائل…</div></section></main><script>
const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const r=await fetch("/api/marketer/messages",{credentials:"include"});if(!r.ok){if(r.status===401||r.status===403){location.href="/login?next=/marketer/messages/";return}throw Error("تعذر تحميل الرسائل")}const d=await r.json();const list=d.messages||[];$("#messages").innerHTML=list.length?list.map(m=>'<article class="msg '+(!m.read_at?'unread':'')+'"><strong>'+esc(m.subject||"رسالة من الإدارة")+'</strong><div class="muted">'+new Date(m.created_at).toLocaleString("ar-EG")+' · '+(m.read_at?'مقروءة':'جديدة')+'</div><p class="body">'+esc(m.message)+'</p>'+(!m.read_at?'<button class="btn mark" data-id="'+esc(m.id)+'">تحديد كمقروء</button>':'')+'</article>').join(""):'<p class="muted">لا توجد رسائل حتى الآن.</p>';document.querySelectorAll(".mark").forEach(b=>b.onclick=async()=>{await fetch("/api/marketer/messages",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.id})});load()})}
$("#readAll").onclick=async()=>{await fetch("/api/marketer/messages",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:"all"})});load()};load().catch(e=>$("#messages").textContent=e.message);
</script><script src="/hide-hatchable.js"></script></body></html>
