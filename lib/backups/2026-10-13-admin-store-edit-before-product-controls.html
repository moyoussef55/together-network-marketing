<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتج — Together</title><link rel="stylesheet" href="/theme.css"><style>.form{display:grid;gap:14px;max-width:820px;margin:auto}.field{display:grid;gap:7px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#0b1728;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}.switch{display:flex;align-items:center;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.image-card{position:relative;background:#ffffff08;border:1px solid #ffffff15;border-radius:12px;padding:8px}.image-card img{width:100%;height:140px;object-fit:cover;border-radius:8px}.image-card button{margin-top:7px;width:100%}.upload{border:1px dashed #ffffff30;padding:14px;border-radius:12px}.muted{line-height:1.6}</style></head><body><main class="shell"><section class="card" style="max-width:960px;margin:30px auto"><header style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="muted">متجر Together</div><h1 id="title">إضافة منتج</h1><p class="muted">يمكنك إضافة صورة واحدة أو عدة صور للمنتج. الصور تظهر للمسوقين داخل المتجر.</p></div><a class="btn" href="/admin/store/">رجوع للمتجر</a></header><form id="form" class="form"><div class="field"><label>اسم المنتج</label><input id="name" required></div><div class="field"><label>الوصف</label><textarea id="description" rows="5"></textarea></div><div class="row"><div class="field"><label>الثمن بالجنيه</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>المخزون</label><input id="stock" type="number" min="0" step="1" required></div></div><div class="row"><div class="field"><label>BV</label><input id="bv" type="number" min="0" step="1" value="1000" required><small class="muted">الافتراضي 1000 BV.</small></div><div class="field"><label>القسم</label><select id="category_id"><option value="">بدون قسم</option></select></div></div><label class="switch"><input id="active" type="checkbox" checked> إظهار المنتج في متجر المسوقين</label><div id="imageSection" class="field" hidden><label>صور المنتج</label><div class="upload"><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><small class="muted">يمكن اختيار عدة صور دفعة واحدة، الحد الأقصى 8MB للصورة.</small></div><div id="gallery" class="images"></div><div id="uploadMsg" class="muted"></div></div><div class="actions"><button class="btn primary" id="save">إضافة المنتج</button><a class="btn" href="/admin/store/">إلغاء</a></div><div id="msg" class="muted"></div></form></section></main><script>
const $=s=>document.querySelector(s);const id=new URLSearchParams(location.search).get('id');let product=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(body){const r=await fetch('/api/admin/store',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تنفيذ العملية');return d;}
async function load(){const r=await fetch('/api/admin/store');if(r.status===401||r.status===403){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);return}const d=await r.json();$('#category_id').innerHTML='<option value="">بدون قسم</option>'+d.categories.filter(c=>c.active).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');if(id){product=d.products.find(x=>x.id===id);if(!product){$('#msg').textContent='المنتج غير موجود.';return}$('#title').textContent='تعديل المنتج';$('#save').textContent='حفظ التعديلات';$('#name').value=product.name||'';$('#description').value=product.description||'';$('#price').value=product.price||0;$('#stock').value=product.stock||0;$('#bv').value=product.bv??1000;$('#category_id').value=product.category_id||'';$('#active').checked=!!product.active;$('#imageSection').hidden=false;renderImages(product.images||[]);}}
function renderImages(images){$('#gallery').innerHTML=images.length?images.map(x=>'<div class="image-card"><img src="'+esc(x.url)+'" alt=""><button type="button" class="btn" onclick="deleteImage(\''+x.id+'\')">حذف الصورة</button></div>').join(''):'<div class="muted">لا توجد صور مضافة بعد.</div>';}
$('#form').onsubmit=async e=>{e.preventDefault();$('#msg').textContent='جاري الحفظ…';try{const body={action:id?'update_product':'product',name:$('#name').value,description:$('#description').value,price:Number($('#price').value),stock:Number($('#stock').value),bv:Number($('#bv').value),category_id:$('#category_id').value||null,active:$('#active').checked};if(id)body.product_id=id;const d=await api(body);if(!id){product=d.product;$('#imageSection').hidden=false;$('#title').textContent='تعديل المنتج';$('#save').textContent='حفظ التعديلات';history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(product.id));}$('#msg').textContent='تم حفظ بيانات المنتج.';if(!id)$('#msg').textContent+=' يمكنك الآن إضافة الصور.';}catch(e){$('#msg').textContent=e.message;}};
$('#images').onchange=async()=>{if(!product)return;const files=[...$('#images').files];if(!files.length)return;$('#uploadMsg').textContent='جاري رفع الصور…';try{for(const file of files){const fd=new FormData();fd.append('action','upload_image');fd.append('product_id',product.id);fd.append('file',file);const r=await fetch('/api/admin/store',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'فشل رفع صورة');product.images=[...(product.images||[]),d.image];renderImages(product.images);}$('#uploadMsg').textContent='تم رفع الصور بنجاح.';$('#images').value='';}catch(e){$('#uploadMsg').textContent=e.message;}};
async function deleteImage(imageId){if(!confirm('حذف هذه الصورة؟'))return;try{await api({action:'delete_image',image_id:imageId});product.images=(product.images||[]).filter(x=>x.id!==imageId);renderImages(product.images);}catch(e){alert(e.message)}}
load();
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script></body></html>
