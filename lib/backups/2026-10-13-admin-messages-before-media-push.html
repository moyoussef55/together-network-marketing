<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائل الأعضاء | Together</title><link rel="stylesheet" href="/theme.css"><style>.wrap{max-width:1100px;margin:24px auto;padding:0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:10px;font:inherit;box-sizing:border-box}.wide{grid-column:1/-1}.rows{display:grid;gap:10px;margin-top:16px}.item{padding:14px;border:1px solid #dbe1e9;border-radius:12px;background:#fff}.muted{color:#687385;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:#087d43}.error{color:#bd2434}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="shell wrap"><header class="top"><div class="logo"><div class="mark">T</div><div>رسائل الأعضاء</div></div><a class="btn" href="/admin/">لوحة الإدارة</a></header><section class="card"><h2>إرسال رسالة</h2><p class="muted">أرسل رسالة لكل المسوقين أو لمسوق محدد. الرسائل تُحفظ في صندوق رسائل المسوق.</p><form id="sendForm" class="form-grid"><select class="field" id="mode"><option value="all">إرسال جماعي لكل المسوقين</option><option value="private">رسالة خاصة لمسوق</option></select><input class="field" id="search" placeholder="ابحث بالـ ID أو الاسم" autocomplete="off"><select class="field wide" id="recipient" hidden><option value="">اختر المسوق من نتائج البحث</option></select><input class="field wide" id="subject" placeholder="عنوان الرسالة (اختياري)" maxlength="180"><textarea class="field wide" id="message" rows="5" placeholder="اكتب نص الرسالة هنا..." required></textarea><div class="actions wide"><button class="btn primary" type="submit">إرسال الرسالة</button><span id="result" class="muted" aria-live="polite"></span></div></form></section><section class="card" style="margin-top:18px"><h2>آخر الرسائل المرسلة</h2><div class="actions"><input class="field" id="historySearch" placeholder="بحث في الرسائل الأخيرة بالاسم أو ID" style="max-width:420px"><button class="btn" id="refresh" type="button">تحديث</button></div><div id="history" class="rows">جارٍ التحميل…</div></section></main><script>
const $=s=>document.querySelector(s);let marketers=[],recent=[];
async function load(q=""){const r=await fetch("/api/admin/messages"+(q?"?q="+encodeURIComponent(q):""));const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل البيانات");marketers=d.marketers||[];recent=d.recent||[];renderRecipients();renderHistory()}
function renderRecipients(){const s=$("#recipient"),q=$("#search").value.trim().toLocaleLowerCase("ar");const found=marketers.filter(m=>[m.id,m.referral_code,m.display_name,m.email].some(v=>String(v||"").toLocaleLowerCase("ar").includes(q))).slice(0,100);s.innerHTML='<option value="">اختر المسوق من نتائج البحث</option>'+found.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.display_name||m.referral_code||m.id)+' — '+esc(m.referral_code||m.id)+'</option>').join("")}
function renderHistory(){const q=$("#historySearch").value.trim().toLocaleLowerCase("ar");const list=recent.filter(m=>[m.display_name,m.referral_code,m.recipient_id,m.subject,m.message].some(v=>String(v||"").toLocaleLowerCase("ar").includes(q)));$("#history").innerHTML=list.length?list.map(m=>'<article class="item"><strong>'+esc(m.subject||"رسالة من الإدارة")+'</strong><div class="muted">إلى: '+esc(m.display_name||m.recipient_id)+' · '+esc(m.referral_code||"")+' · '+new Date(m.created_at).toLocaleString("ar-EG")+'</div><p style="white-space:pre-wrap">'+esc(m.message)+'</p></article>').join(""):'<p class="muted">لا توجد رسائل مطابقة.</p>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#mode").onchange=()=>{const priv=$("#mode").value==="private";$("#recipient").hidden=!priv;$("#search").placeholder=priv?"ابحث بالـ ID أو الاسم لاختيار المستلم":"بحث اختياري بالـ ID أو الاسم لمراجعة المسوقين";if(priv&&!marketers.length)load().catch(e=>$("#result").textContent=e.message)};
let searchTimer;$("#search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>load($("#search").value.trim()).catch(e=>$("#result").textContent=e.message),200)};
$("#historySearch").oninput=renderHistory;$("#refresh").onclick=()=>load($("#search").value.trim()).catch(e=>$("#history").textContent=e.message);
$("#sendForm").onsubmit=async e=>{e.preventDefault();const mode=$("#mode").value,recipient_id=$("#recipient").value,message=$("#message").value.trim();if(mode==="private"&&!recipient_id){$("#result").textContent="اختر مسوقًا من نتائج البحث أولًا.";return}if(!message)return;const btn=e.submitter;btn.disabled=true;$("#result").textContent="جارٍ الإرسال…";try{const r=await fetch("/api/admin/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,recipient_id,subject:$("#subject").value.trim(),message})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر الإرسال");$("#result").className="ok";$("#result").textContent="تم إرسال الرسالة بنجاح إلى "+d.sent+" مسوق.";$("#message").value="";await load($("#search").value.trim())}catch(err){$("#result").className="error";$("#result").textContent=err.message}finally{btn.disabled=false}};
load().catch(e=>$("#history").textContent=e.message);
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script></body></html>
