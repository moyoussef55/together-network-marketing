<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | Together</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script></head><body class="app-shell"><main class="main-content" style="max-width:900px;margin:auto;padding:24px"><a href="/store/">← العودة للمتجر</a><div id="app" class="card" style="margin-top:18px;padding:20px">جاري تحميل المنتج…</div></main><script>const el=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let product;let shipping={country:'',governorate:'',address:'',phone:''};async function init(){const id=new URLSearchParams(location.search).get('id');if(!id){el.textContent='لم يتم تحديد المنتج';return}const r=await fetch('/api/store/catalog');if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){el.textContent='تعذر تحميل المنتج';return}const d=await r.json();product=(d.products||[]).find(p=>p.id===id);if(!product){el.textContent='المنتج غير موجود أو غير متاح';return}render()}function render(){el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;align-items:start"><div>'+((product.images||[]).map(i=>'<img src="'+esc(i.url)+'" alt="'+esc(product.name)+'" style="width:100%;max-height:360px;object-fit:contain;border-radius:16px;margin-bottom:8px">').join('')||'<div style="height:240px;display:grid;place-items:center;background:#152b4a;border-radius:16px;font-size:56px">T</div>')+'</div><section><p class="eyebrow">'+esc(product.category_name||'منتج')+'</p><h1>'+esc(product.name)+'</h1><p>'+esc(product.description||'')+'</p><h2>'+Number(product.price).toFixed(2)+' ج.م</h2><p>قيمة التفعيل: <b>'+Number(product.bv||0)+' BV</b></p><p>المخزون: '+Number(product.stock||0)+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="addCart()" '+(product.stock<1?'disabled':'')+'>إضافة للسلة</button><button class="btn primary" onclick="showShipping()" '+(product.stock<1?'disabled':'')+'>شراء الآن</button></div><div id="checkout" style="margin-top:18px"></div><div id="msg" role="status" style="margin-top:12px"></div></section></div>'}function addCart(){let cart={};try{cart=JSON.parse(localStorage.getItem('tn_store_cart')||'{}')}catch{}cart[product.id]=Math.min(Number(product.stock),Number(cart[product.id]||0)+1);localStorage.setItem('tn_store_cart',JSON.stringify(cart));document.querySelector('#msg').textContent='تمت إضافة المنتج إلى السلة.'}function showShipping(){document.querySelector('#checkout').innerHTML='<h3>بيانات الشحن</h3><form id="shipping" style="display:grid;gap:10px"><label>الدولة<input name="country" required maxlength="120" autocomplete="country-name"></label><label>المحافظة<input name="governorate" required maxlength="120"></label><label>العنوان<input name="address" required maxlength="500" autocomplete="street-address"></label><label>رقم الهاتف<input name="phone" required maxlength="40" inputmode="tel" autocomplete="tel"></label><button class="btn primary" type="submit">شراء الآن</button></form>';document.querySelector('#shipping').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);shipping=Object.fromEntries(['country','governorate','address','phone'].map(k=>[k,String(f.get(k)||'').trim()]));confirmPurchase()})}function confirmPurchase(){document.querySelector('#checkout').innerHTML='<div class="card" style="padding:16px;border:1px solid #ffffff33"><p>بمجرد قيامك بعملية الشراء يتم خصم قيمة المنتج ولا يحق لك استرداد المبلغ ويصبح لك منتج عند الشركة هنقوم بالتواصل معك لاستلامه</p><button class="btn primary" id="confirm">تأكيد</button> <button class="btn" onclick="showShipping()">رجوع</button></div>';document.querySelector('#confirm').onclick=buy}async function buy(){const btn=document.querySelector('#confirm');btn.disabled=true;btn.textContent='جارٍ تأكيد الشراء…';const r=await fetch('/api/store/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product_id:product.id,quantity:1,...shipping})});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){btn.disabled=false;btn.textContent='تأكيد';const messages={insufficient_balance:'رصيدك غير كافٍ لشراء هذا المنتج.',out_of_stock:'المنتج غير متوفر بالكمية المطلوبة.',product_not_found:'المنتج غير موجود.',shipping_details_required:'أكمل بيانات الشحن.'};document.querySelector('#msg').textContent=messages[d.error]||'تعذر إتمام الشراء. لم يتم تأكيد الطلب.';return}document.querySelector('#checkout').innerHTML='<div class="card" style="padding:16px"><h3>تم تأكيد الشراء</h3><p>تم خصم '+Number(d.amount).toFixed(2)+' ج.م من رصيدك.</p><p>الرصيد المتبقي: '+Number(d.balance_after).toFixed(2)+' ج.م</p><p>BV لهذا الطلب: '+Number(d.total_bv)+' BV</p><p>المستوى لهذا الطلب: '+(Number(d.purchase_tier)>=3?'ذهبي':Number(d.purchase_tier)>=2?'سيلفر':Number(d.purchase_tier)>=1?'برونزي':'غير مفعل')+'</p><a class="btn primary" href="/store/">العودة للمتجر</a></div>'}init();</script><script src="/hide-hatchable.js"></script></body></html>
