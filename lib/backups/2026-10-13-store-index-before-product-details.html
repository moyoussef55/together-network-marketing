<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر Together</title><link rel="stylesheet" href="/theme.css"><style>
.store-wrap{max-width:1180px;margin:auto}.store-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cats{display:flex;gap:8px;overflow:auto;padding:10px 0 14px}.cat{border:1px solid #ffffff20;background:#ffffff08;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}.cat.active{background:#ffffff18;border-color:#ffffff45}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.product-card{display:flex;flex-direction:column;gap:10px}.product-art{height:145px;border-radius:16px;background:linear-gradient(135deg,#152b4a,#0b1628);display:grid;place-items:center;font-size:48px;font-weight:900;overflow:hidden}.product-art img{width:100%;height:100%;object-fit:cover}.price{font-size:21px}.meta{display:flex;justify-content:space-between;gap:8px}.stock{font-size:12px}.cart{position:fixed;inset:0 0 0 auto;width:min(430px,92vw);background:#07111f;border-left:1px solid #ffffff20;z-index:20;box-shadow:-20px 0 60px #0008;transform:translateX(110%);transition:.2s;padding:18px;overflow:auto}.cart.open{transform:translateX(0)}.backdrop{position:fixed;inset:0;background:#0008;z-index:19;display:none}.backdrop.open{display:block}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #ffffff12}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px}.cart-total{font-size:22px;font-weight:900;margin:18px 0}.orders{margin-top:28px}.order{padding:12px 0;border-bottom:1px solid #ffffff12}.badge2{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;font-size:12px}.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.product-actions .btn{min-width:0;padding:10px 8px}.sales-page-tools{margin-top:8px}.sales-page-tools .btn{width:100%;border:1px solid #60a5fa55;background:#152b4a}.sales-link-box{margin-top:8px}.sales-link-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.sales-link-row input{min-width:0;width:100%;box-sizing:border-box;background:#0c1a2b;color:#dce6f3;border:1px solid #33465e;border-radius:8px;padding:9px;font-size:12px;direction:ltr}.sales-link-row .btn{padding:8px 10px}.sales-link-help{display:block;margin-top:5px;font-size:11px;color:#9fb0c7;line-height:1.6}.checkout-form{display:grid;gap:13px;margin-top:12px}.checkout-form label{display:grid;gap:6px;font-size:13px;color:#dce6f3;font-weight:700}.checkout-form input{width:100%;box-sizing:border-box;border:1px solid #33465e;background:#0c1a2b;color:#fff;border-radius:10px;padding:12px;font:inherit;outline:none}.checkout-form input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f633}.consent-box{display:flex;align-items:flex-start;gap:10px;margin:14px 0;padding:12px;border:1px solid #33465e;border-radius:12px;background:#0c1a2b;line-height:1.7;font-size:13px}.consent-box input{width:18px;height:18px;flex:0 0 18px;margin-top:3px;accent-color:#22c55e}.consent-box:has(input:checked){border-color:#22c55e;background:#103024}.checkout-note{padding:12px;border-radius:10px;background:#ffffff08;line-height:1.8;font-size:13px}.checkout-buttons{display:grid;gap:8px}.checkout-buttons .btn:disabled{opacity:.45;cursor:not-allowed}
</style><script src="/network-session.js"></script></head><body class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">T</div><div><strong>Together</strong><span>Network Marketing</span></div></div><nav class="side-nav"><a href="/marketer/dashboard/">لوحة التحكم</a><a href="/marketer/my-network/">شبكتي</a><a class="active" href="/store/">المتجر</a><a href="/marketer/products/">منتجاتي</a></nav></aside><main class="main-content store-wrap"><header class="store-head"><div><p class="eyebrow">متجر Together</p><h1>منتجاتك في مكان واحد</h1><p class="muted">اضغط على أي منتج لعرض تفاصيله أو شرائه مباشرة.</p></div><button class="btn primary" onclick="openCart()">🛒 السلة <span id="cartCount">0</span></button></header><div id="cats" class="cats"></div><section id="products" class="product-grid"></section><section class="orders card"><h2>طلباتي</h2><div id="orders">جاري التحميل…</div></section></main>
<div id="backdrop" class="backdrop" onclick="closeCart()"></div><aside id="cart" class="cart"><div style="display:flex;justify-content:space-between;align-items:center"><h2>سلة الشراء</h2><button class="btn" onclick="closeCart()">إغلاق</button></div><div id="cartItems"></div><div id="cartTotal" class="cart-total">الإجمالي: 0.00 ج.م</div><button class="btn primary" style="width:100%" onclick="checkout()">إتمام الشراء</button><p class="muted" style="font-size:12px;margin-top:10px">سيتم تسجيل الشراء كمبيعة مؤهلة، ثم يُحدَّث الـBV والعمولة في دورة التحديث الأسبوعية.</p></aside>
<script>
const $=s=>document.querySelector(s);let data={categories:[],products:[]},selectedCat="",salesOwnerId="",cart=JSON.parse(localStorage.getItem("tn_store_cart")||"{}");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){const r=await fetch("/api/store/catalog");if(r.status===401){location.href="/login?next=/store/";return}if(!r.ok){$("#products").innerHTML='<div class="card">تعذر تحميل المتجر.</div>';return}data=await r.json();const me=await fetch("/api/network/me",{cache:"no-store"});if(me.status===401){location.href="/login?next="+encodeURIComponent("/store/");return}if(me.ok){const md=await me.json();salesOwnerId=String(md.marketer?.id||"")}renderCats();renderProducts();renderCart();loadOrders();}
function renderCats(){$("#cats").innerHTML='<button class="cat '+(!selectedCat?"active":"")+'" onclick="filterCat(\'\')">كل المنتجات</button>'+data.categories.map(c=>'<button class="cat '+(selectedCat===c.id?"active":"")+'" onclick="filterCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join("");}
function filterCat(id){selectedCat=id;renderCats();renderProducts();}
function renderProducts(){const list=data.products.filter(p=>!selectedCat||p.category_id===selectedCat);$("#products").innerHTML=list.map(p=>'<article class="product-card card"><a href="/store/product/?id='+encodeURIComponent(p.id)+'" class="product-art" style="display:block">'+(p.images&&p.images.length?'<img src="'+esc(p.images[0].url)+'" alt="'+esc(p.name)+'">':'T')+'</a><div class="badge2">'+esc(p.category_name||"منتج")+'</div><h2><a style="color:inherit;text-decoration:none" href="/store/product/?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a></h2><p class="muted">'+esc(p.description||"")+'</p><div class="meta"><strong class="price">'+Number(p.price).toFixed(2)+' ج.م</strong><span class="stock">'+(p.stock>0?"متوفر: "+p.stock:"غير متوفر")+'</span></div><div class="meta"><span class="muted">BV: '+p.bv+'</span></div><div class="product-actions"><button class="btn" '+(p.stock>0?"":"disabled")+' onclick="addToCart(\''+p.id+'\')">أضف للسلة</button><button class="btn primary" '+(p.stock>0?"":"disabled")+' onclick="buyNow(\''+p.id+'\')">شراء الآن</button></div><div class="sales-page-tools"><button class="btn" type="button" onclick="createSalesPage(\''+p.id+'\')">إنشاء صفحة بيع</button></div><div id="sales-link-'+esc(p.id)+'" class="sales-link-box"></div></article>').join("")||'<div class="card">لا توجد منتجات في هذا القسم.</div>';}
function createSalesPage(id){if(!salesOwnerId){alert("تعذر تحديد حساب المسوق الحالي. أعد تحميل الصفحة.");return}const link=location.origin+"/store/product/?id="+encodeURIComponent(id)+"&sales_owner="+encodeURIComponent(salesOwnerId);const box=document.getElementById("sales-link-"+id);if(!box)return;box.innerHTML='<div class="sales-link-row"><input id="sales-url-'+esc(id)+'" readonly value="'+esc(link)+'" aria-label="رابط صفحة البيع"><button class="btn primary" type="button" onclick="copySalesPageLink(\''+id+'\')">نسخ الرابط</button></div><small class="sales-link-help">هذا الرابط مخصص لفتح صفحة المنتج من خلال حساب المسوق الذي أنشأها.</small>';box.scrollIntoView({behavior:"smooth",block:"nearest"});}async function copySalesPageLink(id){const field=document.getElementById("sales-url-"+id);if(!field)return;try{await navigator.clipboard.writeText(field.value);alert("تم نسخ رابط صفحة البيع. يمكنك إرساله الآن.")}catch(e){field.focus();field.select();const ok=document.execCommand("copy");alert(ok?"تم نسخ رابط صفحة البيع. يمكنك إرساله الآن.":"حدد الرابط وانسخه يدويًا.")}}function save(){localStorage.setItem("tn_store_cart",JSON.stringify(cart));renderCart();}
function addToCart(id){const p=data.products.find(x=>x.id===id);if(!p||p.stock<1)return;cart[id]=Math.min(p.stock,Number(cart[id]||0)+1);save();window.scrollTo({top:0,behavior:"smooth"});openCart();}function buyNow(id){location.href="/store/product/?id="+encodeURIComponent(id);}
function changeQty(id,delta){const p=data.products.find(x=>x.id===id);if(!p)return;const n=Math.max(0,Math.min(p.stock,Number(cart[id]||0)+delta));if(n)cart[id]=n;else delete cart[id];save();}
function renderCart(){const ids=Object.keys(cart),rows=ids.map(id=>{const p=data.products.find(x=>x.id===id);if(!p){delete cart[id];return ""}const q=Math.min(p.stock,Number(cart[id]||0));if(!q){delete cart[id];return ""}cart[id]=q;return '<div class="cart-row"><div><strong>'+esc(p.name)+'</strong><div class="muted">'+Number(p.price).toFixed(2)+' ج.م • '+p.bv+' BV</div></div><div class="qty"><button class="btn" onclick="changeQty(\''+id+'\',-1)">−</button><span>'+q+'</span><button class="btn" onclick="changeQty(\''+id+'\',1)">+</button></div></div>';}).join("");$("#cartItems").innerHTML=rows||'<p class="muted">السلة فارغة.</p>';const total=ids.reduce((s,id)=>{const p=data.products.find(x=>x.id===id);return s+(p?Number(p.price)*Number(cart[id]||0):0)},0);$("#cartTotal").textContent="الإجمالي: "+total.toFixed(2)+" ج.م";$("#cartCount").textContent=ids.reduce((s,id)=>s+Number(cart[id]||0),0);localStorage.setItem("tn_store_cart",JSON.stringify(cart));}
function openCart(){$("#cart").classList.add("open");$("#backdrop").classList.add("open");}
function closeCart(){$("#cart").classList.remove("open");$("#backdrop").classList.remove("open");}
let checkoutShipping={};function checkout(){const items=Object.entries(cart).map(([product_id,quantity])=>({product_id,quantity}));if(!items.length){alert("السلة فارغة");return}$("#cartItems").innerHTML='<h3>بيانات الشحن</h3><form id="cartShipping" class="checkout-form"><label>الدولة<input name="country" required maxlength="120" autocomplete="country-name"></label><label>المحافظة<input name="governorate" required maxlength="120"></label><label>العنوان<input name="address" required maxlength="500" autocomplete="street-address"></label><label>رقم الهاتف<input name="phone" required maxlength="40" inputmode="tel" autocomplete="tel"></label><button class="btn primary" type="submit">متابعة الشراء</button></form>';$("#cartShipping").onsubmit=e=>{e.preventDefault();checkoutShipping=Object.fromEntries(["country","governorate","address","phone"].map(k=>[k,String(new FormData(e.currentTarget).get(k)||"").trim()]));$("#cartItems").innerHTML='<div class="checkout-note">بمجرد قيامك بعملية الشراء يتم خصم قيمة المنتج ولا يحق لك استرداد المبلغ ويصبح لك منتج عند الشركة هنقوم بالتواصل معك لاستلامه</div><label class="consent-box"><input id="cartPurchaseConsent" type="checkbox"><span>أوافق على الشروط الموضحة وأؤكد رغبتي في الشراء.</span></label><div class="checkout-buttons"><button id="cartConfirmPurchase" class="btn primary" disabled onclick="submitCartPurchase()">تأكيد الشراء</button><button class="btn" onclick="checkout()">رجوع لتعديل البيانات</button></div>';const consent=$("#cartPurchaseConsent"),confirm=$("#cartConfirmPurchase");consent.addEventListener("change",()=>{confirm.disabled=!consent.checked;});};}async function submitCartPurchase(){const items=Object.entries(cart).map(([product_id,quantity])=>({product_id,quantity}));const r=await fetch("/api/store/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...checkoutShipping,items})});const d=await r.json();if(r.status===401){location.href="/login?next=/store/";return}if(!r.ok){alert(d.error==="insufficient_balance"?"رصيدك غير كافٍ لإتمام الشراء.":d.error==="out_of_stock"?"بعض المنتجات لم تعد متوفرة.":"تعذر إتمام الشراء: "+(d.error||"خطأ غير معروف"));await load();return}cart={};save();closeCart();alert("تم الشراء وخصم "+Number(d.amount).toFixed(2)+" ج.م. الرصيد المتبقي "+Number(d.balance_after).toFixed(2)+" ج.م.");await load();}
async function loadOrders(){const r=await fetch("/api/store/order");if(!r.ok)return;const d=await r.json();$("#orders").innerHTML=(d.orders||[]).map(o=>'<div class="order"><strong>طلب #'+String(o.id).slice(0,8)+'</strong> • '+Number(o.total).toFixed(2)+' ج.م <span class="badge2">'+esc(o.status)+'</span><div class="muted">'+new Date(o.created_at).toLocaleString("ar-EG")+' • '+(o.items||[]).map(i=>esc(i.name)+" × "+i.quantity).join("، ")+'</div></div>').join("")||'<span class="muted">لا توجد طلبات بعد.</span>';}
load();
</script><script src="/hide-hatchable.js"></script></body></html>
