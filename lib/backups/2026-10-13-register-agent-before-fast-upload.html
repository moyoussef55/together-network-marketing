<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل وكيل جديد</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script></head><body class="app-shell"><main class="main-content"><div class="card"><p class="eyebrow">Together Network</p><h1>تسجيل وكيل جديد</h1><p class="muted">أكمل البيانات ثم انتقل إلى صفحة تأكيد الـ IBN.</p><form id="f"><div class="form-grid">
<label>الاسم الأول<input name="first_name" required></label><label>الاسم الثاني<input name="second_name" required></label><label>الاسم الثالث<input name="third_name"></label><label>الاسم الرابع<input name="fourth_name"></label>
<label>الرقم القومي<input name="national_id" required></label><label>صورة البطاقة - الوجه الأمامي<input type="file" id="idFront" accept="image/jpeg,image/png,image/webp" required></label><label>صورة البطاقة - الوجه الخلفي<input type="file" id="idBack" accept="image/jpeg,image/png,image/webp" required></label><label>صورة العقد الورقي<input type="file" id="paperContract" accept="image/jpeg,image/png,image/webp" required></label><label>صورة الإقرار<input type="file" id="declarationImage" accept="image/jpeg,image/png,image/webp" required></label><label>رقم الهاتف<input name="phone" required></label><label>البريد الإلكتروني<input type="email" name="email" required></label>
<label>الدولة<select name="country" id="country" required></select></label><label>المحافظة<select name="state" id="state"><option value="">اختر الدولة أولًا</option></select></label><label>المدينة<input name="city"></label>
<label>اسم الوريث<input name="heir_name"></label><label>ID الإحالة التلقائي<input name="referral_id" id="referral_id" readonly placeholder="سيتم وضع ID للمسجل تحته تلقائيًا"></label><label>إضافة ID إحالة اختياري<input name="referral_override" id="referral_override" placeholder="اتركه فارغًا لاستخدام الإحالة التلقائية"></label><label>اسم أم الوريث<input name="heir_mother_name"></label>
<label>كلمة السر<div class="password-field"><input type="password" name="password" required><button type="button" class="password-toggle" aria-label="إظهار كلمة السر" aria-pressed="false">إظهار</button></div></label><label>تأكيد كلمة السر<div class="password-field"><input type="password" name="password_confirm" required><button type="button" class="password-toggle" aria-label="إظهار تأكيد كلمة السر" aria-pressed="false">إظهار</button></div></label><label>كلمة سر المحفظة<div class="password-field"><input type="password" name="wallet_password" required><button type="button" class="password-toggle" aria-label="إظهار كلمة سر المحفظة" aria-pressed="false">إظهار</button></div></label><label>تأكيد كلمة سر المحفظة<div class="password-field"><input type="password" name="wallet_password_confirm" required><button type="button" class="password-toggle" aria-label="إظهار تأكيد كلمة سر المحفظة" aria-pressed="false">إظهار</button></div></label>
<label>التوكيل<select name="account_position"><option value="2">التوكيل الثاني</option><option value="3">التوكيل الثالث</option></select></label><label>المربع<select name="slot_no"><option value="1">المربع الأول</option><option value="2">المربع الثاني</option></select></label>
</div><section class="voice-box"><h2>التسجيل الصوتي</h2><p class="muted">اضغط بدء التسجيل، سجّل صوتك، ثم اضغط إيقاف التسجيل واستمع إليه قبل إنشاء الحساب.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" id="recordVoice">🎙️ بدء التسجيل الصوتي</button><button type="button" class="btn" id="stopVoice" disabled>إيقاف التسجيل</button></div><p id="voiceStatus" class="muted">لم يتم تسجيل الصوت بعد</p><audio id="voicePreview" controls hidden style="width:100%;margin-top:10px"></audio></section><label style="display:flex;gap:8px;align-items:center;margin:18px 0"><input type="checkbox" name="terms_accepted" value="1" id="terms"><span>أوافق على كل الشروط والأحكام</span></label><button class="btn" id="go" disabled>إنشاء الحساب</button><div id="msg" class="muted"></div></form></div></main>
<style>html,body{min-height:100%;overflow:auto}.main-content{width:100%;max-width:900px;margin:0 auto;padding:32px 24px;box-sizing:border-box}.card{width:100%;box-sizing:border-box}.form-grid{display:flex;flex-direction:column;gap:18px}.form-grid label{display:flex;flex-direction:column;gap:9px;font-weight:800;color:#fff;font-size:16px;line-height:1.5}.form-grid input,.form-grid select{width:100%;box-sizing:border-box;min-height:52px;padding:13px 15px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;font:inherit;font-weight:500;outline:none;transition:.2s}.form-grid input::placeholder{color:#64748b;opacity:1}.password-field{display:flex;gap:8px;align-items:stretch}.form-grid .password-field input{flex:1;min-width:0}.password-toggle{flex:0 0 88px;border:1px solid #60a5fa;border-radius:12px;background:#102b49;color:#fff;font:700 14px inherit;cursor:pointer;padding:0 12px}.password-toggle:hover{background:#17416b}.password-toggle:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}.form-grid input:focus,.form-grid select:focus{border-color:#1683ff;box-shadow:0 0 0 3px #1683ff22}.voice-box{margin-top:22px;padding:18px;border:1px solid #ffffff20;border-radius:14px;background:#0d1725}.voice-box h2{margin-top:0}.voice-box button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:760px){.main-content{min-width:0;padding:24px 16px}}</style>
<script>
const q=new URLSearchParams(location.search);const adminMode=q.get('admin')==='1';const ownerId=q.get('owner_id')||'';document.querySelector('[name=account_position]').value=q.get('position')||'2';document.querySelector('[name=slot_no]').value=q.get('slot')||'1';const f=document.getElementById('f'),terms=document.getElementById('terms'),go=document.getElementById('go'),country=document.getElementById('country'),state=document.getElementById('state'),referralId=document.getElementById('referral_id'),referralOverride=document.getElementById('referral_override');
if(ownerId){referralId.value=ownerId}else{fetch('/api/network/register-agent').then(r=>r.json()).then(d=>{referralId.value=(d.referral&&d.referral.referral_code)||((d.referral&&d.referral.id)||'')}).catch(()=>{})}
referralOverride.oninput=()=>{if(referralOverride.value.trim()){referralId.value=referralOverride.value.trim()}else{fetch(adminMode&&ownerId?'/api/admin/marketers?id='+encodeURIComponent(ownerId):'/api/network/register-agent').then(r=>r.json()).then(d=>{referralId.value=adminMode?(d.profile?.referral_code||ownerId):((d.referral&&d.referral.referral_code)||((d.referral&&d.referral.id)||''))}).catch(()=>{})}};
terms.onchange=()=>go.disabled=!terms.checked;
document.querySelectorAll('.password-toggle').forEach(button=>button.addEventListener('click',()=>{const input=button.parentElement.querySelector('input');const reveal=input.type==='password';input.type=reveal?'text':'password';button.textContent=reveal?'إخفاء':'إظهار';button.setAttribute('aria-pressed',String(reveal));button.setAttribute('aria-label',(reveal?'إخفاء ':'إظهار ')+(input.labels?.[0]?.textContent||'كلمة السر'));}));
const countryList=['أفغانستان','ألبانيا','الجزائر','أندورا','أنغولا','الأرجنتين','أرمينيا','أستراليا','النمسا','أذربيجان','البحرين','بنغلاديش','بيلاروسيا','بلجيكا','بوليفيا','البوسنة والهرسك','البرازيل','بلغاريا','الكاميرون','كندا','تشيلي','الصين','كولومبيا','كرواتيا','قبرص','التشيك','الدنمارك','جيبوتي','الإكوادور','مصر','إستونيا','إثيوبيا','فنلندا','فرنسا','جورجيا','ألمانيا','غانا','اليونان','غينيا','المجر','آيسلندا','الهند','إندونيسيا','إيران','العراق','أيرلندا','إيطاليا','اليابان','الأردن','كازاخستان','كينيا','الكويت','لبنان','ليبيا','ليتوانيا','لوكسمبورغ','ماليزيا','مالطا','المكسيك','المغرب','هولندا','نيوزيلندا','نيجيريا','النرويج','عُمان','باكستان','فلسطين','بنما','بيرو','الفلبين','بولندا','البرتغال','قطر','رومانيا','روسيا','السعودية','السنغال','صربيا','سنغافورة','سلوفاكيا','سلوفينيا','الصومال','جنوب أفريقيا','كوريا الجنوبية','إسبانيا','السودان','السويد','سويسرا','سوريا','تايوان','تنزانيا','تايلاند','تونس','تركيا','أوكرانيا','الإمارات العربية المتحدة','المملكة المتحدة','الولايات المتحدة','أوروغواي','أوزبكستان','فنزويلا','فيتنام','اليمن','زامبيا','زيمبابوي'];
country.innerHTML='<option value="">اختر الدولة</option>'+countryList.sort((a,b)=>a.localeCompare(b,'ar')).map(c=>'<option value="'+c+'">'+c+'</option>').join('');
const egyptStates=['القاهرة','الجيزة','الإسكندرية','الدقهلية','البحر الأحمر','البحيرة','الفيوم','الغربية','الإسماعيلية','المنوفية','المنيا','القليوبية','الوادي الجديد','السويس','أسوان','أسيوط','بني سويف','بورسعيد','دمياط','الشرقية','جنوب سيناء','كفر الشيخ','مطروح','الأقصر','قنا','شمال سيناء','سوهاج'];
country.onchange=()=>{if(country.value==='مصر'){state.innerHTML='<option value="">اختر المحافظة</option>'+egyptStates.map(x=>'<option value="'+x+'">'+x+'</option>').join('')}else{state.innerHTML='<option value="">المحافظة / الولاية</option>'}};
let voiceBlob=null,recorder=null,voiceStream=null,voiceChunks=[];const recordBtn=document.getElementById('recordVoice'),stopBtn=document.getElementById('stopVoice'),voiceStatus=document.getElementById('voiceStatus'),voicePreview=document.getElementById('voicePreview');recordBtn.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('المتصفح لا يدعم التسجيل الصوتي');voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));recorder=mime?new MediaRecorder(voiceStream,{mimeType:mime}):new MediaRecorder(voiceStream);recorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};recorder.onstop=()=>{voiceBlob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'});voicePreview.src=URL.createObjectURL(voiceBlob);voicePreview.hidden=false;voiceStatus.textContent='تم التسجيل؛ استمع إليه قبل الإرسال';voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;recordBtn.disabled=false;stopBtn.disabled=true};recorder.start();recordBtn.disabled=true;stopBtn.disabled=false;voiceStatus.textContent='جارٍ التسجيل...'}catch(err){voiceStatus.textContent=err.message||'تعذر تشغيل الميكروفون';voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null}};stopBtn.onclick=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop()};async function uploadMedia(kind,file,name){const fd=new FormData();fd.append('kind',kind);fd.append('file',file,name);const r=await fetch(adminMode?'/api/admin/registration-media':'/api/network/registration-media',{method:'POST',body:fd,credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذر رفع الملف');return d.storage_key}
f.onsubmit=async e=>{e.preventDefault();go.disabled=true;document.getElementById('msg').textContent='جارٍ رفع الملفات...';try{const x=Object.fromEntries(new FormData(f));const front=document.getElementById('idFront').files[0],back=document.getElementById('idBack').files[0],contract=document.getElementById('paperContract').files[0],declaration=document.getElementById('declarationImage').files[0];if(!front||!back||!contract||!declaration||!voiceBlob){go.disabled=!terms.checked;throw Error('ارفع وجهي البطاقة وصورة العقد وصورة الإقرار وسجّل الصوت قبل المتابعة')}const k1=await uploadMedia('national_id_front',front,front.name);const k2=await uploadMedia('national_id_back',back,back.name);const k3=await uploadMedia('voice_recording',voiceBlob,'voice.webm');const k4=await uploadMedia('paper_contract',contract,contract.name);const k5=await uploadMedia('declaration_image',declaration,declaration.name);x.national_id_front_key=k1;x.national_id_back_key=k2;x.voice_recording_key=k3;x.paper_contract_key=k4;x.declaration_image_key=k5;x.terms_accepted=terms.checked;if(ownerId)x.owner_id=ownerId;if(adminMode)x.owner_id=ownerId;const endpoint=adminMode?'/api/admin/register-agent':'/api/network/register-agent';const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});const d=await r.json();if(d.ok)location.href='/marketer/agent-confirm/?id='+encodeURIComponent(d.application_id)+(adminMode?'&admin=1':'');else throw Error(d.error==='slot_taken'?'هذا المربع مستخدم بالفعل':d.error==='registration_media_required'?'ارفع صورتي البطاقة وسجّل الصوت أولًا':d.error||'تعذر إنشاء الطلب')}catch(err){document.getElementById('msg').textContent=err.message||'تعذر إنشاء الطلب';go.disabled=!terms.checked}};
</script><script src="/hide-hatchable.js"></script><!-- dashboard return button styles removed --><!-- dashboard return button removed --><style>.tn-nav-toggle{position:fixed;top:16px;right:16px;z-index:12002;width:66px;height:66px;border:1px solid #ffffff55;border-radius:18px;background:#000;color:#fff;font-size:34px;font-weight:900;box-shadow:0 8px 24px #0008;cursor:pointer}.tn-nav-shade{position:fixed;inset:0;background:#000a;z-index:12000;display:none}.tn-nav-shade.open{display:block}.tn-nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(310px,86vw);padding:78px 18px 24px;background:#101a28;border-left:1px solid #ffffff22;z-index:12001;transform:translateX(105%);transition:transform .22s ease;overflow:auto;box-shadow:-12px 0 36px #0007}.tn-nav-drawer.open{transform:translateX(0)}.tn-nav-drawer a{display:block;padding:13px 14px;margin:5px 0;border-radius:11px;color:#fff;text-decoration:none;font:700 16px Arial,sans-serif}.tn-nav-drawer a:hover,.tn-nav-drawer a:focus{background:#1683ff2b;outline:none}.tn-nav-drawer .tn-nav-home{background:#1683ff}</style><button type="button" class="tn-nav-toggle" id="tnNavToggle" aria-label="فتح القائمة الجانبية" aria-expanded="false">☰</button><div class="tn-nav-shade" id="tnNavShade"></div><nav class="tn-nav-drawer" id="tnNavDrawer" aria-label="القائمة الجانبية للمسوق"><a class="tn-nav-home" href="/marketer/dashboard/">لوحة التحكم</a><a href="/marketer/my-network/">شبكتي</a><a href="/store/">المتجر</a><a href="/marketer/agent/">إضافة وكيل</a><a href="/marketer/profile/">البروفايل</a><a href="/marketer/wallet/">المحفظة</a><a href="/marketer/withdraw/">طلب السحب</a><a href="/marketer/reports/">التقارير</a>

<a href="/marketer/team-checks/">شيكات فريقك</a></nav><script>(()=>{const b=document.getElementById("tnNavToggle"),s=document.getElementById("tnNavShade"),d=document.getElementById("tnNavDrawer");if(!b||!s||!d)return;function close(){s.classList.remove("open");d.classList.remove("open");b.setAttribute("aria-expanded","false")}b.addEventListener("click",()=>{const open=!d.classList.contains("open");d.classList.toggle("open",open);s.classList.toggle("open",open);b.setAttribute("aria-expanded",String(open))});s.addEventListener("click",close);document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});d.querySelectorAll("a").forEach(a=>a.addEventListener("click",close))})();</script></body></html>
