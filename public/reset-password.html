<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>تعيين كلمة سر جديدة — Together Network</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.shell{width:min(460px,100%)}.card{padding:28px;border-radius:24px}.brand{text-align:center;font-size:23px;font-weight:900;margin-bottom:22px}.card h1,.muted{text-align:center}.muted{line-height:1.8}.card label{display:block;margin:18px 0 8px;font-weight:800}.card input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #d5dbe4;background:#fff;color:#111827;font-size:16px}.card .btn{width:100%;margin-top:18px}.msg{text-align:center;min-height:24px;margin-top:14px}.err{color:#dc2626}.lang{display:block;margin:16px auto 0}</style></head><body><main class="shell"><section class="card"><div class="brand">Together Network</div><h1 id="title">تعيين كلمة سر جديدة</h1><p class="muted" id="sub">اختر كلمة سر جديدة لا تقل عن 8 أحرف.</p><form id="form"><label id="p1label" for="p1">كلمة السر الجديدة</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><label id="p2label" for="p2">تأكيد كلمة السر</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required><button id="submit" class="btn primary" type="submit">حفظ كلمة السر</button></form><div id="msg" class="msg muted" role="status" aria-live="polite"></div><p class="muted"><a href="/login.html">العودة لتسجيل الدخول</a></p><button class="lang" id="lang" type="button">English</button></section></main><script>
const $=id=>document.getElementById(id);let lang="ar";const token=new URLSearchParams(location.search).get("token")||"";function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("title").textContent=lang==="ar"?"تعيين كلمة سر جديدة":"Set a new password";$("sub").textContent=lang==="ar"?"اختر كلمة سر جديدة لا تقل عن 8 أحرف.":"Choose a new password with at least 8 characters.";$("p1label").textContent=lang==="ar"?"كلمة السر الجديدة":"New password";$("p2label").textContent=lang==="ar"?"تأكيد كلمة السر":"Confirm password";$("submit").textContent=lang==="ar"?"حفظ كلمة السر":"Save password";$("lang").textContent=lang==="ar"?"English":"العربية";}function say(t,err=false){$("msg").textContent=t;$("msg").className="msg "+(err?"err":"muted");}if(!token){say(lang==="ar"?"رابط إعادة التعيين غير صالح أو غير مكتمل.":"The reset link is missing or invalid.",true);$("submit").disabled=true;}$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render()};$("form").onsubmit=async e=>{e.preventDefault();const a=$("p1").value,b=$("p2").value;if(a.length<8){say(lang==="ar"?"كلمة السر يجب ألا تقل عن 8 أحرف.":"Password must be at least 8 characters.",true);return}if(a!==b){say(lang==="ar"?"كلمتا السر غير متطابقتين.":"Passwords do not match.",true);return}const button=$("submit");button.disabled=true;say(lang==="ar"?"جارٍ حفظ كلمة السر...":"Saving your password…");try{const r=await fetch("/api/marketer-password-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset",token,password:a})});const d=await r.json().catch(()=>({}));if(!r.ok){const m=d.error==="invalid_or_expired_token"?(lang==="ar"?"انتهت صلاحية الرابط أو تم استخدامه. اطلب رابطًا جديدًا.":"This link has expired or was already used. Request a new one."):lang==="ar"?"تعذر تغيير كلمة السر. حاول مجددًا.":"Could not reset your password. Please try again.";throw new Error(m)}say(lang==="ar"?"تم تغيير كلمة السر بنجاح. يمكنك الآن تسجيل الدخول.":"Password reset successfully. You can now sign in.");$("form").classList.add("hidden");setTimeout(()=>location.replace("/login.html"),1400)}catch(err){say(err.message,true)}finally{button.disabled=false;}};render();
</script><script src="/hide-hatchable.js"></script></body></html>
