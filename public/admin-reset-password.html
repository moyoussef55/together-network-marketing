<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>إعادة تعيين كلمة مرور الإدارة | Together Network</title><link rel="stylesheet" href="/theme.css?v=620"><style>body{min-height:100vh;display:grid;place-items:center;background:#07111f;color:#edf4ff;font-family:system-ui;padding:18px}.panel{width:min(92vw,440px);box-sizing:border-box;background:#101d2e;border:1px solid #26384f;border-radius:22px;padding:28px;box-shadow:0 24px 70px #0006}h1{margin-top:0}.hint{color:#9fb0c6;line-height:1.8}.field{display:block;margin:16px 0 6px}.field input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #33465f;background:#07111f;color:white}.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;cursor:pointer}.msg{min-height:28px;margin-top:12px;color:#ffb7b7}</style></head><body><main class="panel"><h1>تعيين كلمة مرور جديدة</h1><p class="hint">اختر كلمة مرور جديدة لا تقل عن 12 حرفًا.</p><form id="form"><label class="field">كلمة المرور الجديدة<input id="password" type="password" autocomplete="new-password" minlength="12" required></label><label class="field">تأكيد كلمة المرور<input id="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button class="btn primary" id="submit" type="submit">حفظ كلمة المرور</button></form><p class="msg" id="msg" role="status" aria-live="polite"></p><p><a href="/admin/login.html">العودة لتسجيل الدخول</a></p></main><script>
const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get("token")||"";if(!token){$("msg").textContent="رابط إعادة التعيين غير صالح أو غير مكتمل.";$("submit").disabled=true}
$("form").addEventListener("submit",async e=>{e.preventDefault();const password=$("password").value;if(password.length<12){$("msg").textContent="كلمة المرور يجب ألا تقل عن 12 حرفًا.";return}if(password!==$("confirm").value){$("msg").textContent="كلمتا المرور غير متطابقتين.";return}const button=$("submit");button.disabled=true;$("msg").style.color="#9fb0c6";$("msg").textContent="جارٍ حفظ كلمة المرور…";try{const r=await fetch("/api/admin/password-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset",token,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error==="invalid_or_expired_token"?"انتهت صلاحية الرابط أو تم استخدامه. اطلب رابطًا جديدًا.":d.error==="password_too_short"?"كلمة المرور يجب ألا تقل عن 12 حرفًا.":"تعذر تغيير كلمة المرور. حاول مرة أخرى.");$("form").hidden=true;$("msg").textContent="تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.";$("msg").style.color="#86efac";history.replaceState(null,"",location.pathname)}catch(err){$("msg").style.color="#ffb7b7";$("msg").textContent=err.message}finally{button.disabled=false}});
</script><script src="/hide-hatchable.js"></script><script src="/theme-toggle.js?v=620"></script></body></html>
