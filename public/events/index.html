<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أحداث ومؤتمرات Together</title><link rel="stylesheet" href="/theme.css"><style>
body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 16px;border-radius:10px;border:1px solid #64748b;cursor:pointer;font:inherit}.tabs button.active{background:#123c67;color:#fff}.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.event{border:1px solid #ffffff25;border-radius:16px;overflow:hidden;background:#101722;color:#f8fafc}.event img,.event video{display:block;width:100%;max-height:360px;object-fit:contain;background:#05080d}.body{padding:16px}.desc{white-space:pre-wrap;line-height:1.8}.muted{color:#94a3b8}.date{color:#fbbf24;margin:8px 0}.empty{padding:28px;text-align:center}.hidden{display:none!important}
</style></head><body><main class="wrap"><header class="head"><div><p class="muted">TOGETHER NETWORK MARKETING</p><h1>الأحداث والمؤتمرات</h1><p class="muted">تابع فعاليات الشركة وأحداثها القادمة والسابقة.</p></div><a class="btn" href="/">الصفحة الرئيسية</a></header><nav class="tabs"><button class="active" data-kind="upcoming">الأحداث القادمة</button><button data-kind="past">الأحداث السابقة</button></nav><div id="status" class="muted">جارٍ تحميل الأحداث…</div><section id="events" class="events"></section></main>
<script>
const $=s=>document.querySelector(s);let events=[],kind="upcoming";function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const list=events.filter(e=>e.event_type===kind);$("#status").textContent=list.length?"":(kind==="past"?"لا توجد أحداث سابقة متاحة للعرض.":"لا توجد أحداث قادمة متاحة للعرض.");$("#events").innerHTML=list.map(e=>{const media=(e.media_items||[{media_url:e.media_url,media_type:e.media_type}]).map(m=>String(m.media_type||"").startsWith("video/")?'<video controls playsinline preload="metadata" src="'+esc(m.media_url)+'"></video>':'<img loading="lazy" src="'+esc(m.media_url)+'" alt="صورة الحدث">').join("");return '<article class="event">'+media+'<div class="body"><h2>'+esc(e.title||"حدث Together")+'</h2>'+(kind==="upcoming"&&e.event_date?'<div class="date">موعد الحدث: '+esc(new Date(e.event_date).toLocaleString("ar-EG"))+'</div>':'')+'<div class="desc">'+esc(e.description)+'</div></div></article>'}).join("")}
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));render()});
fetch("/api/events-public",{cache:"no-store"}).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.error||"تعذر تحميل الأحداث");events=d.events||[];render()})).catch(()=>$("#status").textContent="تعذر تحميل الأحداث حاليًا. حاول مرة أخرى لاحقًا.");
</script><script src="/hide-hatchable.js"></script></body></html>
