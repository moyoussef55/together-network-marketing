<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة | Together Network</title><link rel="stylesheet" href="/theme.css?v=620"><style>
body{min-height:100vh;display:grid;place-items:center;background:#07111f;color:#edf4ff;font-family:system-ui}.panel{width:min(92vw,440px);box-sizing:border-box;background:#101d2e;border:1px solid #26384f;border-radius:22px;padding:28px;box-shadow:0 24px 70px #0006}h1{margin-top:0}.hint{color:#9fb0c6;line-height:1.8}.field{display:block;margin:16px 0 6px}.field input{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #33465f;background:#07111f;color:white}.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;cursor:pointer}.msg{min-height:28px;margin-top:12px;color:#ffb7b7}.hidden{display:none!important}
</style></head><body><main class="panel"><h1 id="heading">دخول لوحة الإدارة</h1><p class="hint" id="hint">أدخل بريد المدير وكلمة المرور للمتابعة.</p><form id="form"><label class="field">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><button class="btn primary" id="submit" type="submit">تسجيل الدخول</button></form><button type="button" id="forgotToggle" class="btn hidden" style="background:transparent;color:#b9d7ff;text-decoration:underline;margin-top:4px">نسيت كلمة المرور؟</button><form id="forgotForm" class="hidden"><label class="field">البريد الإلكتروني المسجّل<input id="forgotEmail" type="email" autocomplete="email" required></label><button class="btn primary" id="forgotSubmit" type="submit">إرسال رابط إعادة التعيين</button><button type="button" id="backToLogin" class="btn" style="background:#26384f;color:white">العودة لتسجيل الدخول</button></form><p class="msg" id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id);let mode="login";const setupKey=new URLSearchParams(location.search).get("setup")||"";if(setupKey){history.replaceState(null,"",location.pathname);}
const errors={missing_credentials:"أدخل البريد الإلكتروني وكلمة المرور.",invalid_credentials:"بيانات الدخول غير صحيحة.",admin_login_required:"سجّل الدخول أولًا.",admin_status_failed:"تعذر التحقق من حالة النظام.",admin_login_failed:"تعذر تسجيل الدخول. حاول مرة أخرى.",admin_setup_failed:"تعذر إنشاء حساب المدير.",invalid_setup_key:"رابط الإعداد غير صالح أو انتهت صلاحيته.",invalid_email:"أدخل بريدًا إلكترونيًا صحيحًا.",password_too_short:"كلمة المرور يجب ألا تقل عن 12 حرفًا.",admin_already_configured:"تم إعداد حساب المدير مسبقًا. استخدم تسجيل الدخول."};
async function init(){try{const r=await fetch("/api/admin/login-status",{cache:"no-store",credentials:"same-origin"});const d=await r.json();if(d.authenticated){location.replace("/admin/");return}if(d.configured){$("forgotToggle").classList.remove("hidden");}if(!d.configured){mode="setup";$("heading").textContent="إعداد المدير لأول مرة";$("hint").textContent="لأمان الحساب، يجب فتح هذه الخطوة أثناء تسجيل الدخول إلى حساب مالك المشروع في Hatchable. اختر بريدك وكلمة مرور قوية من 12 حرفًا على الأقل.";$("submit").textContent="إنشاء حساب المدير";$("password").autocomplete="new-password";$("password").minLength=12;}}catch(e){$("msg").textContent="تعذر الاتصال بالخادم."}}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("msg").textContent="جارٍ التحقق…";try{const path=mode==="setup"?"/api/admin/initial-setup":"/api/admin/login";const r=await fetch(path,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value,setupKey})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(errors[d.error]||"تعذر إكمال العملية.");location.replace("/admin/");}catch(err){$("msg").textContent=err.message||"حدث خطأ غير متوقع."}finally{$("submit").disabled=false}});
$("forgotToggle").addEventListener("click",()=>{$("form").classList.add("hidden");$("forgotForm").classList.remove("hidden");$("forgotToggle").classList.add("hidden");$("forgotEmail").value=$("email").value.trim();$("msg").textContent="أدخل البريد الإلكتروني المسجّل لحساب المدير.";$("forgotEmail").focus()});
$("backToLogin").addEventListener("click",()=>{$("forgotForm").classList.add("hidden");$("form").classList.remove("hidden");$("forgotToggle").classList.remove("hidden");$("msg").textContent=""});
$("forgotForm").addEventListener("submit",async e=>{e.preventDefault();const button=$("forgotSubmit");button.disabled=true;$("msg").textContent="جارٍ إرسال رابط إعادة التعيين…";try{const r=await fetch("/api/admin/password-reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"request",email:$("forgotEmail").value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error==="email_delivery_unavailable"?"تعذر إرسال البريد. حاول لاحقًا أو تواصل مع الدعم.":d.error==="reset_rate_limited"?"تم تجاوز عدد المحاولات. حاول بعد ساعة.":"تعذر طلب إعادة التعيين. تحقق من البريد وحاول مجددًا.");$("msg").textContent=d.message||"إذا كان البريد يطابق حساب المدير، فسيتم إرسال رابط إعادة التعيين.";$("msg").style.color="#9fb0c6";}catch(err){$("msg").textContent=err.message||"تعذر إكمال العملية.";$("msg").style.color="#ffb7b7"}finally{button.disabled=false}});
init();
</script><script src="/theme-toggle.js?v=620"></script></body></html>
