<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التارجت | Together Network</title><link rel="stylesheet" href="/theme.css"><style>.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:8px;margin:14px 0}.field input,.field textarea{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:12px;width:100%;box-sizing:border-box}.field textarea{min-height:120px;resize:vertical}.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}.target{background:#101a28;color:#f5f7fb;border:1px solid #ffffff22;border-radius:15px;padding:16px}.desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.reward{color:#24c777;font-size:20px;font-weight:900}.muted{color:#8b9bb0}.danger{background:#a91f2c;color:#fff}.status{margin-inline-start:10px;font-weight:700}</style></head><body><main class="shell wrap"><header class="top"><div><p class="muted">إدارة Together Network</p><h1>🎯 إدارة التارجت</h1><p class="muted">اكتب عنوان التارجت ووصفه وقيمة المكافأة، ثم انشره ليظهر أعلى لوحة التحكم لدى جميع المسوقين.</p></div><a class="btn" href="/admin/">لوحة الإدارة</a></header><section class="card" style="margin-top:18px"><h2>نشر تارجت جديد</h2><form id="form"><label class="field">عنوان التارجت<input id="title" maxlength="180" required placeholder="مثال: تارجت مبيعات الأسبوع"></label><label class="field">وصف التارجت<textarea id="description" maxlength="5000" required placeholder="اكتب تفاصيل التارجت وشروط تحقيقه…"></textarea></label><label class="field">قيمة المكافأة بالجنيه المصري<input id="reward" type="number" min="0" max="100000000" step="0.01" required placeholder="مثال: 1500"></label><button class="btn primary" id="publish" type="submit">نشر التارجت</button><span class="status" id="status" role="status"></span></form></section><section class="card" style="margin-top:18px"><div class="top"><h2>التارجت المنشورة</h2><button class="btn" id="refresh" type="button">تحديث القائمة</button></div><div id="targets" class="targets"><p class="muted">جارٍ تحميل التارجت…</p></div></section></main><script>const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function load(){const r=await fetch("/api/admin/targets?fresh="+Date.now(),{cache:"no-store",credentials:"include"});if(r.status===401||r.status===403){location.href="/login?next=/admin/targets/";return}const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل التارجت");const xs=d.targets||[];$("#targets").innerHTML=xs.length?xs.map(t=>'<article class="target"><h3>'+esc(t.title)+'</h3><div class="desc">'+esc(t.description)+'</div><p class="reward">المكافأة: '+Number(t.reward_amount||0).toLocaleString("ar-EG",{maximumFractionDigits:2})+' ج.م</p><p class="muted">'+esc(new Date(t.created_at).toLocaleString("ar-EG"))+'</p><button class="btn danger" data-delete="'+Number(t.id)+'">حذف التارجت</button></article>').join(""):'<p class="muted">لا توجد تارجت منشورة حتى الآن.</p>';document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeTarget(Number(b.dataset.delete)))}async function removeTarget(id){if(!confirm("هل تريد حذف هذا التارجت من لوحات المسوقين؟"))return;try{const r=await fetch("/api/admin/targets",{method:"DELETE",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر الحذف");$("#status").textContent="تم حذف التارجت.";await load()}catch(e){$("#status").textContent=e.message}}$("#form").onsubmit=async e=>{e.preventDefault();$("#publish").disabled=true;$("#status").textContent="جارٍ النشر…";try{const body={title:$("#title").value.trim(),description:$("#description").value.trim(),reward_amount:$("#reward").value};const r=await fetch("/api/admin/targets",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error==="title_required_or_too_long"?"اكتب عنوانًا صحيحًا للتارجت":d.error==="description_required_or_too_long"?"اكتب وصفًا صحيحًا للتارجت":d.error==="invalid_reward_amount"?"قيمة المكافأة غير صحيحة":d.error||"تعذر نشر التارجت");$("#form").reset();$("#status").textContent="تم نشر التارجت لجميع المسوقين.";await load()}catch(err){$("#status").textContent=err.message}finally{$("#publish").disabled=false}};$("#refresh").onclick=()=>load().catch(e=>$("#status").textContent=e.message);load().catch(e=>$("#status").textContent=e.message)</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script><script src="/theme-toggle.js?v=452"></script></body></html>
