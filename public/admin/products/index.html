<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات المنتجات — الإدارة</title><link rel="stylesheet" href="/theme.css">
<style>
.wrap{max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{padding:11px 9px;border-bottom:1px solid #ffffff18;text-align:right;vertical-align:middle}.muted2{color:#a9b6c9;font-size:13px}.status-select{min-width:170px;max-width:210px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#ffffff13;font-size:12px}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.invoice{background:#fff;color:#172033;border-radius:14px;padding:24px;width:min(780px,100%);max-height:92vh;overflow:auto}.invoice h2,.invoice h3{color:#172033}.invoice .inv-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #172033;padding-bottom:14px}.invoice .inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.invoice .inv-meta div{background:#f3f6fa;padding:12px;border-radius:8px}.invoice table{width:100%;border-collapse:collapse}.invoice th,.invoice td{padding:9px;border-bottom:1px solid #dce2eb;text-align:right}.invoice .total{text-align:left;font-size:22px;font-weight:800;margin-top:18px}.company-stamp{display:grid;gap:3px;justify-items:center;width:300px;max-width:100%;box-sizing:border-box;margin:18px auto 8px;padding:10px 18px;border:5px solid #062b70;border-radius:1px;background:#fff;color:#062b70;text-align:center;font-weight:950;line-height:1.8;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}.company-stamp strong,.company-stamp span{font-family:Arial,Tahoma,sans-serif;font-size:16px;font-weight:950;letter-spacing:.2px}.company-stamp span{direction:rtl}.invoice .company-footer{text-align:center;color:#062b70;font-size:12px;font-weight:900;margin-top:12px}.invoice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.invoice .close{float:left}.empty{padding:20px;text-align:center;color:#a9b6c9}.success{color:#4be0a5}.err{color:#ff9b9b}@media(max-width:600px){.invoice{padding:14px}.invoice .inv-meta{grid-template-columns:1fr}.tbl{font-size:13px}}@media print{body *{visibility:hidden!important}.modal.open,.modal.open *{visibility:visible!important}.modal.open{display:block!important;position:absolute;inset:0;background:#fff;padding:0}.invoice{width:100%;max-height:none;overflow:visible;border-radius:0;box-shadow:none;padding:0}.invoice-actions,.close{display:none!important}.invoice .inv-meta div{background:#fff;border:1px solid #ddd}.invoice .company-stamp{color:#062b70!important;border:4px solid #062b70!important;background:#fff!important;font-weight:950!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.invoice .company-stamp strong,.invoice .company-stamp span{color:#062b70!important;font-weight:950!important}.invoice .company-footer{color:#062b70!important}}
</style></head><body><main class="shell wrap"><header class="head"><div><p class="muted">إدارة Together</p><h1>طلبات المنتجات</h1><p class="muted">طلبات المسوقين وحالات التنفيذ والفواتير.</p></div><div class="actions"><a class="btn" href="/admin/">لوحة الإدارة</a><a class="btn" href="/admin/store/">إدارة المتجر</a><button class="btn primary" onclick="loadOrders()">تحديث القائمة</button></div></header>
<section class="card" style="margin-top:18px"><div class="head"><h2>كل الطلبات</h2><span id="summary" class="muted">جاري التحميل…</span></div><div style="margin:14px 0"><input id="orderSearch" type="search" placeholder="ابحث برقم الطلب أو اسم المسوق…" aria-label="البحث برقم الطلب أو اسم المسوق" style="width:100%;max-width:520px;padding:12px 14px;border:1px solid #ffffff30;border-radius:10px;background:#0b1728;color:inherit" oninput="render()"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>رقم الطلب</th><th>المسوق</th><th>المنتجات</th><th>الإجمالي</th><th>التاريخ</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="rows"><tr><td colspan="7">جاري تحميل الطلبات…</td></tr></tbody></table></div></section></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeInvoice()"><section class="invoice"><div class="invoice-actions"><button class="btn close" onclick="closeInvoice()">إغلاق</button><button class="btn primary" onclick="window.print()">طباعة / تنزيل PDF</button><button class="btn" id="sendInvoice">إرسال الفاتورة للعميل عبر واتساب</button></div><div id="invoiceBody"></div></section></div>
<script>
const $=s=>document.querySelector(s);let orders=[],current=null;const statuses=["جارى معالجة الطلب","تم استلام الطلب","تم الشحن","جارى التواصل","تم التسليم"];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function statusText(s){return statuses.includes(s)?s:(s==="pending"||!s?"جارى معالجة الطلب":s)}
function dateText(s){return s?new Date(s).toLocaleString("ar-EG"):"—"}
async function loadOrders(){const r=await fetch("/api/admin/store?view=orders");if(r.status===401||r.status===403){location.href="/login?next=/admin/products/";return}const d=await r.json();if(!r.ok){$("#rows").innerHTML='<tr><td colspan="7">تعذر تحميل الطلبات.</td></tr>';return}orders=d.orders||[];$("#summary").textContent="عدد الطلبات: "+orders.length;render();}
function render(){const q=String($("#orderSearch")?.value||"").trim().toLocaleLowerCase("ar");const filtered=orders.filter(o=>[o.id,String(o.id||"").slice(0,8),o.marketer_name,o.referral_code].some(v=>String(v||"").toLocaleLowerCase("ar").includes(q)));$("#summary").textContent="النتائج: "+filtered.length+" من "+orders.length;$("#rows").innerHTML=filtered.map(o=>'<tr><td><strong>#'+esc(String(o.id).slice(0,8))+'</strong><div class="muted2">'+esc(o.referral_code||"")+'</div></td><td>'+esc(o.marketer_name||"—")+'<div class="muted2">'+esc(o.marketer_phone||"")+'</div></td><td>'+((o.items||[]).map(i=>esc(i.name)+" × "+Number(i.quantity||0)).join("، ")||"—")+'</td><td>'+Number(o.total||0).toFixed(2)+' ج.م</td><td>'+esc(dateText(o.created_at))+'</td><td><select class="status-select" onchange="updateStatus(\''+o.id+'\',this.value)">'+statuses.map(s=>'<option value="'+s+'" '+(statusText(o.status)===s?"selected":"")+'>'+s+'</option>').join("")+'</select></td><td><div class="actions"><button class="btn primary" onclick="showInvoice(\''+o.id+'\')">تفاصيل الطلب / الفاتورة</button></div></td></tr>').join("")||'<tr><td colspan="7" class="empty">لا توجد طلبات منتجات حتى الآن.</td></tr>'}
async function updateStatus(id,status){const r=await fetch("/api/admin/store",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"update_order_status",order_id:id,status})});const d=await r.json();if(!r.ok){alert("تعذر تحديث الحالة: "+(d.error||"خطأ"));loadOrders();return}const o=orders.find(x=>x.id===id);if(o)o.status=d.order.status;if(current&&current.id===id)showInvoice(id);$("#summary").textContent="تم تحديث حالة الطلب #"+String(id).slice(0,8);}
function showInvoice(id){current=orders.find(o=>o.id===id);if(!current)return;const o=current;const items=o.items||[];const phoneRaw=String(o.shipping_phone||o.marketer_phone||"").replace(/\D/g,"");const phone=phoneRaw.startsWith("0")?"20"+phoneRaw.slice(1):phoneRaw;const msg=["فاتورة طلب Together","#"+o.id,"التاريخ: "+dateText(o.created_at),"العميل/المسوق: "+(o.marketer_name||""),"الهاتف: "+(o.shipping_phone||o.marketer_phone||"—"),"العنوان: "+[o.shipping_country,o.shipping_governorate,o.shipping_address].filter(Boolean).join(" - "),"المنتجات:",...items.map(i=>i.name+" × "+i.quantity+" = "+(Number(i.unit_price)*Number(i.quantity)).toFixed(2)+" ج.م"),"الإجمالي: "+Number(o.total||0).toFixed(2)+" ج.م","الحالة: "+statusText(o.status),"ختم الشركة:","┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓","┃ شركـــــة توجيــــذر                  ┃","┃ للتســـــويــق الالكتـــرونـى           ┃","┃ س/ت 250156                            ┃","┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛","تقرير مستخرج من لوحة إدارة شركة توجيذر للتسويق الإلكتروني"].join("\n");
$("#invoiceBody").innerHTML='<div class="inv-head"><div><h2 style="margin:0">Together Network</h2><p>فاتورة طلب منتجات</p></div><div><strong>رقم الطلب</strong><div>#'+esc(o.id)+'</div><div>'+esc(dateText(o.created_at))+'</div><div class="pill">'+esc(statusText(o.status))+'</div></div></div><div class="inv-meta"><div><strong>بيانات المسوق / العميل</strong><p>'+esc(o.marketer_name||"—")+'</p><p>كود المسوق: '+esc(o.referral_code||"—")+'</p><p>الهاتف: '+esc(o.shipping_phone||o.marketer_phone||"—")+'</p><p>البريد: '+esc(o.marketer_email||"—")+'</p></div><div><strong>عنوان الاستلام</strong><p>'+esc(o.shipping_country||"—")+'، '+esc(o.shipping_governorate||"—")+'</p><p>'+esc(o.shipping_address||"—")+'</p></div></div><table><thead><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+esc(i.name||"منتج")+'</td><td>'+Number(i.quantity||0)+'</td><td>'+Number(i.unit_price||0).toFixed(2)+' ج.م</td><td>'+(Number(i.unit_price||0)*Number(i.quantity||0)).toFixed(2)+' ج.م</td></tr>').join("")+'</tbody></table><div class="total">الإجمالي: '+Number(o.total||0).toFixed(2)+' ج.م</div><p>حالة الطلب: <strong>'+esc(statusText(o.status))+'</strong></p><div class="company-stamp" aria-label="ختم شركة توجيذر للتسويق الإلكتروني"><strong>شـركة توجيـذر</strong><span>للتسـويق الالكتـرونى</span><span>س/ت 250156 استثمار القاهره</span></div><p class="company-footer">تقرير مستخرج من لوحة إدارة شركة توجيذر للتسويق الإلكتروني</p>';
$("#sendInvoice").onclick=()=>{if(!phone){alert("لا يوجد رقم هاتف للعميل في بيانات الطلب.");return}window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank","noopener")};$("#modal").classList.add("open")}
function closeInvoice(){$("#modal").classList.remove("open")}
loadOrders();
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script><script src="/theme-toggle.js?v=452"></script></body></html>
