<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات السحب | لوحة الإدارة</title><link rel="stylesheet" href="/theme.css">
<style>
.wrap{max-width:1450px;margin:auto}.head,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar{justify-content:flex-start;margin:16px 0}.toolbar input,.toolbar select,.reason-input{padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;min-height:44px;box-sizing:border-box}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:170px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat,.request{background:#fff!important;color:#17202a!important;border:1px solid #d1d5db;border-radius:16px;padding:16px}.stat span{display:block;color:#475569!important;font-size:13px}.stat b{display:block;color:#17202a!important;font-size:25px;margin-top:5px}.request .muted,.request-head .muted{color:#475569!important}.request .detail{background:#f1f5f9!important;color:#17202a!important}.request .detail small{display:block;color:#475569!important;margin-bottom:5px}.request .detail b{color:#17202a!important}.head h1,.head .eyebrow,.head .muted{color:#17202a!important}.empty{color:#334155!important;background:#fff!important}.stats .stat:nth-child(1) b{color:#2563eb!important}.stats .stat:nth-child(2) b{color:#d97706!important}.stats .stat:nth-child(3) b{color:#16a34a!important}.stats .stat:nth-child(4) b{color:#dc2626!important}.request{margin:14px 0}.request-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid #e5e7eb;padding-bottom:12px}.amount{font-size:24px;font-weight:900;color:#17202a}.status{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px}.status.pending{background:#fff4cc;color:#946200}.status.completed{background:#e0f5e7;color:#167548}.status.cancelled{background:#fee5e5;color:#a61b1b}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.detail{background:#f7f9fc;border-radius:10px;padding:10px;overflow-wrap:anywhere}.detail small{display:block;color:#64748b;margin-bottom:5px}.detail b{font-weight:750;white-space:pre-wrap}.reason{background:#fff1f1;border-right:4px solid #c0392b;padding:11px;border-radius:8px;margin:10px 0;white-space:pre-wrap}button.btn.btn-accept{background:#16a34a!important;background-image:none!important;color:#fff!important;border:2px solid #15803d!important;font-weight:800!important;box-shadow:none!important}button.btn.btn-cancel{background:#dc2626!important;background-image:none!important;color:#fff!important;border:2px solid #b91c1c!important;font-weight:800!important;box-shadow:none!important}.cancel-box{display:none;margin-top:12px;padding:12px;background:#fff7f7;border:1px solid #fecaca;border-radius:12px}.cancel-box.open{display:block}.reason-input{width:100%;background:#fff;color:#111;margin-bottom:10px}.actions{justify-content:flex-start;margin-top:14px}.msg{margin:12px 0;font-weight:800}.empty{padding:28px;text-align:center;color:#64748b;background:var(--card,#fff);border-radius:14px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.details{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.details{grid-template-columns:1fr}.amount{font-size:21px}}
</style></head>
<body class="app-shell"><main class="main-content wrap"><header class="head"><div><p class="eyebrow">الإدارة المالية</p><h1>طلبات السحب</h1><p class="muted">عرض بيانات الطلب بالكامل وإدارة القبول والإلغاء مع تسجيل سبب الإلغاء.</p></div><a class="btn" href="/admin/">العودة للوحة الإدارة</a></header>
<section class="stats"><div class="stat"><span>إجمالي الطلبات</span><b id="statTotal">—</b></div><div class="stat pending"><span>قيد الانتظار</span><b id="statPending">—</b></div><div class="stat completed"><span>مكتملة</span><b id="statCompleted">—</b></div><div class="stat cancelled"><span>ملغاة / مرفوضة</span><b id="statCancelled">—</b></div></section>
<div class="toolbar"><input id="q" placeholder="بحث بالاسم أو البريد أو رقم الهاتف أو ID الطلب"><select id="filter"><option value="all">كل الطلبات</option><option value="pending">قيد الانتظار</option><option value="completed">مكتملة</option><option value="cancelled">ملغاة / مرفوضة</option></select><button class="btn primary" id="searchBtn">بحث</button><button class="btn" id="refreshBtn">تحديث</button></div><div id="message" class="msg" role="status"></div><section id="requests"></section></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const date=s=>{if(!s)return "—";const d=new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})};
const money=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})+" جنيه";
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{throw Error("استجابة غير صحيحة من الخادم")}if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}
function statusInfo(s){s=String(s||"pending").toLowerCase();if(["completed","complete","paid","approved","done"].includes(s))return ["completed","مكتمل"];if(["cancelled","canceled","rejected","declined","مرفوض","ملغى","ملغي"].includes(s))return ["cancelled",s==="rejected"||s==="declined"||s==="مرفوض"?"مرفوض":"ملغى"];return ["pending","قيد الانتظار"]}
function field(label,value){return "<div class='detail'><small>"+label+"</small><b>"+esc(value||"—")+"</b></div>"}
function render(d){const st=d.stats||{};$("statTotal").textContent=st.total??0;$("statPending").textContent=st.pending??0;$("statCompleted").textContent=st.completed??0;$("statCancelled").textContent=st.cancelled??0;const rows=d.requests||[];if(!rows.length){$("requests").innerHTML="<div class='empty'>لا توجد طلبات سحب مطابقة للبحث.</div>";return}
$("requests").innerHTML=rows.map(x=>{const [cls,label]=statusInfo(x.status);const reason=x.note?("<div class='reason'><b>"+(cls==="cancelled"?"سبب الإلغاء / الرفض:":"ملاحظات:")+"</b><br>"+esc(x.note)+"</div>"):"";const actions=cls==="pending"?"<div class='actions'><button class='btn btn-accept' style='background:#16a34a!important;background-color:#16a34a!important;background-image:none!important;color:#fff!important;border:2px solid #15803d!important;opacity:1!important' data-accept='"+esc(x.id)+"' data-user='"+esc(x.user_id)+"'>قبول الطلب</button><button class='btn btn-cancel' style='background:#dc2626!important;background-color:#dc2626!important;background-image:none!important;color:#fff!important;border:2px solid #b91c1c!important;opacity:1!important' data-show-cancel='"+esc(x.id)+"'>إلغاء الطلب</button></div><div class='cancel-box' id='cancelbox_"+esc(x.id)+"'><label for='reason_"+esc(x.id)+"'><b>سبب الإلغاء (سيظهر للمسوق)</b></label><textarea class='reason-input' id='reason_"+esc(x.id)+"' rows='3' maxlength='1000' placeholder='اكتب سبب الإلغاء بوضوح'></textarea><button class='btn btn-cancel' style='background:#dc2626!important;background-color:#dc2626!important;background-image:none!important;color:#fff!important;border:2px solid #b91c1c!important;opacity:1!important' data-cancel='"+esc(x.id)+"' data-user='"+esc(x.user_id)+"'>تأكيد إلغاء الطلب</button></div>":"";
return "<article class='request'><div class='request-head'><div><div class='amount'>"+money(x.amount)+"</div><div class='muted'>رقم الطلب: "+esc(x.id)+"</div><div class='muted'>تاريخ الطلب: "+esc(date(x.created_at))+"</div></div><span class='status "+cls+"'>"+label+"</span></div><div class='details'>"+field("اسم صاحب الطلب",x.full_name||x.display_name)+field("كود المسوق",x.referral_code)+field("معرّف المسوق",x.user_id)+field("البريد الإلكتروني",x.email)+field("هاتف المسوق المسجل",x.marketer_phone)+field("رقم التحويل المطلوب",x.transfer_phone)+field("حالة حساب المسوق",x.marketer_status)+field("حالة الطلب",label)+"</div>"+reason+actions+"</article>"}).join("");
document.querySelectorAll("[data-show-cancel]").forEach(b=>b.onclick=()=>{const box=$("cancelbox_"+b.dataset.showCancel);box.classList.add("open");$("reason_"+b.dataset.showCancel).focus()});
document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=async()=>{if(!confirm("هل تريد قبول الطلب؟ سيتم اعتماد السحب وخصم المبلغ من محفظة المسوق."))return;await change(b.dataset.accept,b.dataset.user,"completed","")});
document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{const reason=$("reason_"+b.dataset.cancel).value.trim();if(!reason){alert("اكتب سبب الإلغاء أولًا.");$("reason_"+b.dataset.cancel).focus();return}if(!confirm("تأكيد إلغاء طلب السحب مع حفظ سبب الإلغاء؟"))return;await change(b.dataset.cancel,b.dataset.user,"cancelled",reason)});
}
async function load(){ $("message").textContent="جاري تحميل الطلبات…";try{const params=new URLSearchParams({q:$("q").value.trim(),status:$("filter").value});const d=await api("/api/admin/withdrawals?"+params.toString());render(d);$("message").textContent="تم تحميل الطلبات."}catch(e){$("message").textContent="تعذر تحميل الطلبات: "+e.message;$("requests").innerHTML="<div class='empty'>تعذر تحميل بيانات طلبات السحب.</div>"}}
async function change(wid,user,status,reason){$("message").textContent="جاري حفظ التغيير…";try{await api("/api/admin/marketers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"withdrawal_status",marketer_id:user,withdrawal_id:wid,status,reason})});$("message").textContent=status==="completed"?"تم قبول الطلب واعتماد السحب بنجاح.":"تم إلغاء الطلب وحفظ السبب وسيظهر للمسوق في الطلبات الملغاة.";await load()}catch(e){$("message").textContent="تعذر تحديث الطلب: "+e.message}}
$("searchBtn").onclick=load;$("refreshBtn").onclick=load;$("filter").onchange=load;$("q").addEventListener("keydown",e=>{if(e.key==="Enter")load()});load();
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script><script src="/theme-toggle.js?v=452"></script></body></html>
