<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأحداث والمؤتمرات | Together Network</title><link rel="stylesheet" href="/theme.css"><style>
.wrap{max-width:1100px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field textarea{min-height:120px;resize:vertical}.field textarea,.field input{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:12px;width:100%;box-sizing:border-box}.preview{max-width:100%;max-height:280px;border-radius:12px;display:none;margin-top:10px}.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px}.event{border:1px solid #ffffff20;border-radius:16px;overflow:hidden;background:#101722}.event img,.event video{width:100%;height:210px;object-fit:cover;background:#080d14;display:block}.event-body{padding:14px}.desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.muted{color:#64748b}.msg{margin-top:12px;font-weight:700}.btn-danger{background:#a91f2c;color:#fff}.event .actions{margin-top:12px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
</style></head><body><main class="shell wrap"><header class="topbar"><div><p class="muted">إدارة Together Network</p><h1>الأحداث والمؤتمرات</h1><p class="muted">أضف وصف الحدث وصورته أو الفيديو الخاص به ليظهر لجميع المسوقين.</p></div><a class="btn" href="/admin/">لوحة الإدارة</a></header>
<section class="card" style="margin-top:18px"><h2>إضافة حدث أو مؤتمر</h2><form id="form"><div class="formgrid"><label class="field">وصف الحدث<textarea id="description" maxlength="5000" required placeholder="اكتب تفاصيل الحدث أو المؤتمر وموعده ومكانه…"></textarea><span class="muted">الحد الأقصى 5000 حرف.</span></label><label class="field">عنوان الحدث<input id="title" maxlength="180" required placeholder="عنوان الحدث أو المؤتمر"></label><label class="field">نوع الحدث<select id="eventType"><option value="past">الأحداث السابقة</option><option value="upcoming">الأحداث القادمة</option></select></label><label class="field">موعد الحدث القادم<input id="eventDate" type="datetime-local"></label><label class="field">اسم القسم<input id="sectionTitle" maxlength="180" placeholder="مثال: مؤتمرات الشركة"></label><label class="field">إتاحة العرض<select id="audience"><option value="members">للمسوقين فقط</option><option value="public">للمسوقين والزوار عبر الرابط</option></select></label><label class="field">رفع صورة أو فيديو<input id="media" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required><span class="muted">صور JPG/PNG/WEBP/GIF أو فيديو MP4/WEBM/MOV. لا يوجد حد لحجم الملف من واجهة الموقع؛ قد تظل هناك حدود تقنية لدى خدمة الاستضافة.</span><img id="imagePreview" class="preview" alt="معاينة الصورة"><video id="videoPreview" class="preview" controls></video></label></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="save" type="submit">نشر الحدث</button><span id="status" class="muted"></span></div></form></section>
<section class="card" style="margin-top:18px"><div class="topbar"><h2>الأحداث المنشورة</h2><button class="btn" id="refresh" type="button">تحديث القائمة</button></div><div id="events" class="events"><p class="muted">جارٍ تحميل الأحداث…</p></div></section></main>
<script>
const $=s=>document.querySelector(s);let events=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mediaMarkup(e){return (e.media_items||[{media_url:e.media_url,media_type:e.media_type}]).map(m=>{const url=esc(m.media_url||"");return String(m.media_type||"").startsWith("video/")?'<video controls preload="metadata" src="'+url+'"></video>':'<img loading="lazy" src="'+url+'" alt="صورة الحدث">'}).join("")}
async function load(){const r=await fetch("/api/admin/events?fresh="+Date.now(),{cache:"no-store"});if(r.status===401||r.status===403){location.href="/login?next=/admin/events/";return}const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل الأحداث");events=d.events||[];$("#events").innerHTML=events.length?events.map(e=>'<article class="event">'+mediaMarkup(e)+'<div class="event-body"><h3>'+esc(e.title||"حدث")+(e.event_type==="upcoming"?" — قادم":" — سابق")+'</h3><div class="desc">'+esc(e.description)+'</div><p class="muted">العرض: '+(e.is_visible?"ظاهر":"مخفي")+' | '+(e.audience==="public"?"المسوقون والزوار":"المسوقون فقط")+'</p><p class="muted">'+esc(new Date(e.created_at).toLocaleString("ar-EG"))+'</p><div class="actions"><button class="btn" data-edit="'+Number(e.id)+'">تعديل</button><button class="btn" data-toggle="'+Number(e.id)+'">'+(e.is_visible?"إخفاء":"إظهار") +'</button><button class="btn" data-audience="'+Number(e.id)+'">'+(e.audience==="public"?"قصره على المسوقين":"إتاحته للزوار") +'</button><button class="btn btn-danger" data-delete="'+Number(e.id)+'">حذف الحدث</button></div></div></article>').join(""):'<p class="muted">لا توجد أحداث منشورة حتى الآن.</p>';document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeEvent(Number(b.dataset.delete)));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>changeEvent(Number(b.dataset.toggle),{is_visible:!events.find(e=>Number(e.id)===Number(b.dataset.toggle)).is_visible}));document.querySelectorAll("[data-audience]").forEach(b=>b.onclick=()=>changeEvent(Number(b.dataset.audience),{audience:events.find(e=>Number(e.id)===Number(b.dataset.audience)).audience==="public"?"members":"public"}));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editEvent(Number(b.dataset.edit)))}
async function changeEvent(id,patch){const e=events.find(x=>Number(x.id)===id);if(!e)return;try{const r=await fetch("/api/admin/events",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,title:e.title||e.description.slice(0,120),description:e.description,event_type:e.event_type,event_date:e.event_date||"",section_title:e.section_title||"",audience:e.audience||"members",is_visible:e.is_visible!==false,...patch})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر حفظ التعديل");await load()}catch(err){$("#status").textContent=err.message}}async function editEvent(id){const e=events.find(x=>Number(x.id)===id);if(!e)return;const title=prompt("عنوان الحدث",e.title||"");if(title===null)return;const description=prompt("وصف الحدث",e.description||"");if(description===null)return;const eventType=prompt("اكتب past للأحداث السابقة أو upcoming للأحداث القادمة",e.event_type||"past");if(eventType===null)return;const sectionTitle=prompt("اسم القسم (اختياري)",e.section_title||"");if(sectionTitle===null)return;await changeEvent(id,{title,description,event_type:eventType==="upcoming"?"upcoming":"past",section_title:sectionTitle})}async function removeEvent(id){if(!confirm("هل تريد حذف هذا الحدث وملف الوسائط المرتبط به؟"))return;try{const r=await fetch("/api/admin/events",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر الحذف");$("#status").textContent="تم حذف الحدث.";await load()}catch(e){$("#status").textContent=e.message}}
$("#media").onchange=()=>{const f=$("#media").files[0],im=$("#imagePreview"),vid=$("#videoPreview");im.style.display="none";vid.style.display="none";if(!f)return;const u=URL.createObjectURL(f);if(f.type.startsWith("video/")){vid.src=u;vid.style.display="block"}else if(f.type.startsWith("image/")){im.src=u;im.style.display="block"}};
$("#form").onsubmit=async e=>{e.preventDefault();const files=Array.from($("#media").files);if(!files.length)return;if(false){$("#status").textContent="";return}$("#save").disabled=true;$("#status").textContent="جارٍ رفع الوسائط ونشر الحدث…";try{const fd=new FormData();fd.append("title",$("#title").value.trim());fd.append("description",$("#description").value.trim());fd.append("event_type",$("#eventType").value);fd.append("event_date",$("#eventDate").value);fd.append("section_title",$("#sectionTitle").value.trim());fd.append("audience",$("#audience").value);files.forEach(file=>fd.append("media",file,file.name));const r=await fetch("/api/admin/events",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw Error(d.error==="unsupported_media_type"?"نوع الملف غير مدعوم":d.error==="media_too_large"?"تعذر رفع الملف بسبب حدود خدمة الاستضافة أو حجم الطلب":d.error||"تعذر نشر الحدث");$("#title").value="";$("#description").value="";$("#eventDate").value="";$("#sectionTitle").value="";$("#eventType").value="past";$("#audience").value="members";$("#media").value="";$("#imagePreview").style.display="none";$("#videoPreview").style.display="none";$("#status").textContent="تم نشر الحدث بنجاح.";await load()}catch(err){$("#status").textContent=err.message}finally{$("#save").disabled=false}};
$("#refresh").onclick=()=>load().catch(e=>$("#status").textContent=e.message);load().catch(e=>$("#status").textContent=e.message);
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script><script src="/theme-toggle.js?v=452"></script></body></html>
