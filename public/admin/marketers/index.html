<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المسوقون</title><link rel="stylesheet" href="/theme.css"><style>
.wrap{max-width:1500px;margin:auto}#rows button[data-send-app-id]{font-size:12px;line-height:1.2;padding:8px 10px;border-radius:10px;white-space:nowrap;vertical-align:middle}.toolbar,.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{min-width:280px}.search-box{position:relative;min-width:280px;flex:1}.search-box input{width:100%;box-sizing:border-box}.search-suggestions{position:absolute;top:calc(100% + 5px);right:0;left:0;z-index:1000;display:none;max-height:320px;overflow:auto;background:#101d2e;border:1px solid #334155;border-radius:12px;box-shadow:0 14px 35px #0008}.search-suggestions.open{display:block}.search-suggestions button{display:block;width:100%;text-align:right;background:transparent;border:0;border-bottom:1px solid #ffffff12;color:#e5edf8;padding:11px 13px;cursor:pointer}.search-suggestions button:hover,.search-suggestions button:focus{background:#1d4ed8}.search-suggestions small{display:block;color:#9fb0c6;margin-top:3px}.search-btn{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}.search-btn:hover{background:#1d4ed8!important}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:12px;border-bottom:1px solid #ffffff12;text-align:right;white-space:nowrap}.tbl th{color:#9fb0c6}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#182332}.wallet-balance{display:inline-block;min-width:76px;text-align:center;padding:7px 10px;border-radius:10px;background:#123b2d;color:#86efac;font-weight:800;border:1px solid #22c55e55}.ok{background:#123b2d}.bad{background:#4a2020}.status-cell{display:inline-block;min-width:78px;text-align:center;padding:6px 9px;border-radius:9px;font-weight:800;font-size:12px}.status-cell.good{background:#123b2d;color:#86efac}.status-cell.blocked{background:#4a2020;color:#fecaca}.status-cell.neutral{background:#3b3218;color:#fde68a}.tbl th,.tbl td{padding:10px 9px}.tbl td .btn{font-size:12px;padding:8px 9px}.termination-btn{background:#8f2525!important;color:#fff!important}.status-action{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.status-action .btn{white-space:nowrap}.pager{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}.page-numbers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.page-numbers button{min-width:38px;padding:8px 10px}.page-numbers button.active,.page-numbers button[aria-current="page"]{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important;box-shadow:0 0 0 2px #60a5fa55;font-weight:900;cursor:default}.page-numbers button:not(.active):hover{background:#1d4ed8!important;color:#fff!important;border-color:#3b82f6!important}.drawer{position:fixed;inset:0;background:#000b;z-index:5000;display:none;padding:16px}.drawer.open{display:block}.panel{max-width:1200px;height:calc(100vh - 32px);margin:auto;background:#0d1520;color:#fff;border-radius:24px;overflow:auto;padding:22px;box-sizing:border-box}.head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0d1520;padding-bottom:12px;z-index:2}.close{font-size:28px;border:0;background:#ffffff12;color:#fff;border-radius:50%;width:44px;height:44px}.box{background:#121e2d;border:1px solid #ffffff12;border-radius:18px;padding:16px;margin-top:16px}.box h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;color:#9fb0c6;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box}.btns{margin-top:12px}.danger{background:#8f2525!important}.warn{background:#6b5313!important}.success{background:#12613f!important}.msg{margin-top:12px;font-weight:700}.list{max-height:360px;overflow:auto}.row{padding:10px;border-bottom:1px solid #ffffff12}.muted2{color:#9fb0c6;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b1320;border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}@media(max-width:800px){.grid,.grid.three,.statgrid{grid-template-columns:1fr}.toolbar input{min-width:100%}}
body[data-theme="light"] .wallet-balance{background:#e0f2e7!important;color:#17613a!important;border:1px solid #86cba3!important;-webkit-text-fill-color:#17613a!important;box-shadow:none!important}body[data-theme="light"] .status-cell.good{background:#dff3e5!important;color:#17613a!important;border:1px solid #8ccda3!important;-webkit-text-fill-color:#17613a!important}body[data-theme="light"] .status-cell.blocked{background:#fde5e7!important;color:#9f2430!important;border:1px solid #e9a0a8!important;-webkit-text-fill-color:#9f2430!important}body[data-theme="light"] .status-cell.neutral{background:#fff0cf!important;color:#81550a!important;border:1px solid #e8c878!important;-webkit-text-fill-color:#81550a!important}body[data-theme="light"] #rows .status-action .btn.warn{background:#f5d58b!important;color:#573b06!important;-webkit-text-fill-color:#573b06!important;border:1px solid #d9ad4b!important}body[data-theme="light"] #rows .status-action .btn.success{background:#d9f0e1!important;color:#155d36!important;-webkit-text-fill-color:#155d36!important;border:1px solid #81c59a!important}body[data-theme="light"] #rows .status-action .btn.termination-btn{background:#b52d3a!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid #92202b!important}body[data-theme="light"] #rows .pill.ok{background:#dff3e5!important;color:#17613a!important;border:1px solid #8ccda3!important}body[data-theme="light"] #rows .pill.bad{background:#fde5e7!important;color:#9f2430!important;border:1px solid #e9a0a8!important}</style></head><body class="app-shell"><main class="main-content wrap"><header class="page-head"><div><p class="eyebrow">إدارة الشبكة</p><h1>المسوقون</h1><p class="muted">20 مسوقًا كحد أقصى في الصفحة.</p></div><a class="btn" href="/admin/">لوحة الإدارة</a></header><section class="card"><div class="toolbar"><div class="search-box"><input id="q" autocomplete="off" placeholder="بحث بالاسم أو ID أو الهاتف أو كود الإحالة"><div id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="خيارات المسوقين"></div></div><button class="btn search-btn" id="search">بحث</button><label><input id="deleted" type="checkbox"> عرض المحذوفين</label></div><div class="pager" style="margin:0 0 16px"><button class="btn" id="prevTop">السابق</button><div id="pageNumbersTop" class="page-numbers"></div><span id="pageTop"></span><button class="btn" id="nextTop">التالي</button></div><div class="table-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>كود المسوق</th><th>الحالة</th><th>الرصيد (جنيه)</th><th>تسجيل الدخول</th><th>حظر التفعيل</th><th>حظر كامل</th><th>بيانات التسجيل</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn" id="prev">السابق</button><div id="pageNumbers" class="page-numbers"></div><span id="page"></span><button class="btn" id="next">التالي</button></div></section></main>
<div class="drawer" id="drawer"><div class="panel"><div class="head"><div><p class="eyebrow">إدارة المسوق</p><h2 id="title">—</h2><div id="sub"></div></div><button class="close" id="close">×</button></div><div id="body"></div><div id="msg" class="msg"></div></div></div>
<script>
const $=id=>document.getElementById(id);const initialParams=new URLSearchParams(location.search);let pg=Math.max(1,Number(initialParams.get("page")||1)),current="",detail=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{throw Error("استجابة غير صحيحة من الخادم")}if(!r.ok)throw Error(d.message||(d.error==="insufficient_manual_bv"?"الـBV اليدوي المتاح للحذف في هذا الاتجاه أقل من القيمة المطلوبة ("+Number(d.available||0)+").":d.error)||("HTTP "+r.status));return d}
async function act(payload){const d=await api("/api/admin/marketers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,marketer_id:current})});$("msg").textContent="تم التنفيذ بنجاح";await openMarketer(current);await load(pg);return d}
function field(label,key,val,type="text"){return "<div class='field'><label>"+label+"</label><input id='f_"+key+"' type='"+type+"' value='"+esc(val||"")+"'></div>"}
function buttons(p){return "<div class='btns'>"+(p.deleted_at?"<button class='btn success' data-act='restore'>استرجاع المسوق</button>":"<button class='btn danger' data-act='delete'>حذف المسوق</button>")+" "+(p.status==="blocked"?"<button class='btn success' data-act='unblock'>فك الحظر</button>":"<button class='btn warn' data-act='block'>حظر المسوق</button>")+" "+(p.login_blocked?"<button class='btn success' data-act='login_unblock'>إلغاء حظر تسجيل الدخول</button>":"<button class='btn warn' data-act='login_block'>حظر تسجيل الدخول</button>")+" "+(p.activation_blocked?"<button class='btn success' data-act='activation_unblock'>إلغاء حظر التفعيل</button>":"<button class='btn warn' data-act='activation_block'>حظر التفعيل</button>")+"</div>"}
function list(title,arr,fmt){return "<div class='box'><div class='section-title'><h3>"+title+"</h3><span class='muted2'>"+arr.length+" سجل</span></div><div class='list'>"+(arr.length?arr.map(x=>"<div class='row'>"+fmt(x)+"</div>").join(""):"<div class='row muted2'>لا توجد بيانات</div>")+"</div></div>"}
function render(d){
 detail=d;const p=d.profile||{},a=d.application||{};$("sub").textContent=(p.referral_code||"")+" • "+(p.status||"");
 let h="";
 h+=buttons(p);
 h+="<div class='box'><div class='section-title'><h3>تعديل بيانات المسوق</h3><button class='btn primary' id='saveProfile'>حفظ البيانات</button></div><div class='grid'>"+
 field("الاسم الأول","first_name",p.first_name||a.first_name)+field("الاسم الثاني","second_name",p.second_name||a.second_name)+field("الاسم الثالث","third_name",p.third_name||a.third_name)+field("الاسم الرابع","fourth_name",p.fourth_name||a.fourth_name)+field("الرقم القومي","national_id",p.national_id||a.national_id)+field("الهاتف","phone",p.phone||a.phone)+field("البريد الإلكتروني","email",p.email||a.email,"email")+field("الدولة","country",p.country||a.country)+field("المحافظة","state",p.state||a.state)+field("المدينة","city",p.city||a.city)+field("اسم الوريث","heir_name",p.heir_name||a.heir_name)+field("اسم أم الوريث","heir_mother_name",p.heir_mother_name||a.heir_mother_name)+field("كود الإحالة","referral_code",p.referral_code)+field("Sponsor ID","sponsor_id",p.sponsor_id)+"</div></div>";
 h+="<div class='box'><h3>كلمات السر</h3><div class='grid'>"+field("كلمة سر الدخول","login_password","","password")+field("كلمة سر المحفظة","wallet_password","","password")+"</div><div class='btns'><button class='btn' id='setLogin'>تغيير كلمة سر الدخول</button><button class='btn' id='setWallet'>تغيير كلمة سر المحفظة</button></div></div>";
 h+="<div class='box'><h3>المحفظة والخزنة</h3><div class='statgrid'><div class='stat'>الرصيد<b>"+Number(d.wallet?.balance||0).toLocaleString("en-US")+" جنيه</b></div><div class='stat'>المبيعات<b>"+Number(p.qualified_sales||d.qualified_sales||0)+"</b></div><div class='stat'>الفريق<b>"+Number(p.team_count||d.placements?.length||0)+"</b></div><div class='stat'>المستوى<b>"+Number(p.admin_tier_override||0)+"</b></div></div><div class='grid' style='margin-top:12px'>"+field("مبلغ الرصيد","wallet_amount","","number")+"</div><div class='btns'><button class='btn success' id='addWallet'>إضافة الرصيد</button><button class='btn danger' id='removeWallet'>حذف الرصيد</button><button class='btn' id='showWallet'>فتح وعرض الخزنة</button></div><div id='walletList'></div></div>";
 h+="<div class='box'><h3>إدارة التفعيل</h3><p class='muted2'>اختيار المستوى يحدد التفعيل الإداري: أحادي، ثنائي، ثلاثي.</p><div class='btns'><button class='btn' data-level='1'>تفعيل أحادي</button><button class='btn' data-level='2'>تفعيل ثنائي</button><button class='btn' data-level='3'>تفعيل ثلاثي</button><button class='btn' data-level='0'>إلغاء التفعيل الإداري</button></div></div>";
 h+="<div class='box'><h3>إدارة BV الحقيقي</h3><p class='muted2'>الإضافة والخصم ينعكسان على إجمالي BV والـCarry وحسابات الـUplines في نفس اتجاه كل علاقة بالشبكة. الخصم متاح من الـBV اليدوي المضاف سابقًا فقط، لحماية BV المبيعات الأصلية.</p><div class='grid three'>"+field("قيمة BV","bv","1000","number")+"<div class='field'><label>الحساب</label><select id='f_position'><option value='1'>التوكيل 01</option><option value='2'>التوكيل 02</option><option value='3'>التوكيل 03</option></select></div><div class='field'><label>الاتجاه</label><select id='f_side'><option value='right'>يمين</option><option value='left'>شمال</option></select></div></div><div class='btns'><button class='btn success' id='bvDisplay'>إضافة BV كتفعيل فقط</button><button class='btn primary' id='bvReal'>إضافة BV حقيقي</button><button class='btn danger' id='bvDelete'>حذف BV حقيقي</button></div></div>";
 h+=list("الشيكات",d.checks||[],x=>"الأسبوع: "+esc(x.week_start)+" → "+esc(x.week_end)+" | يمين "+Number(x.right_bv||0)+" | شمال "+Number(x.left_bv||0)+" | المستحق "+Number(x.check_amount||0)+" جنيه");
 h+=list("العمولات",d.commissions||[],x=>"المبلغ: "+Number(x.amount||0)+" جنيه | المستوى: "+esc(x.level||"—")+" | الحالة: "+esc(x.status||"—")+" | "+esc(x.created_at||""));
 h+=list("طلبات السحب",d.withdrawals||[],x=>"المبلغ: "+Number(x.amount||0)+" جنيه | الحالة: "+esc(x.status||"—")+" | "+esc(x.note||"")+" | "+esc(x.created_at||""));
 h+=list("شبكة المسوق",d.placements||[],x=>"العضو: "+esc(x.display_name||x.member_id)+" | الحساب "+esc(x.account_position)+" | "+esc(x.side)+" | الأب: "+esc(x.parent_member_id||"—"));
 h+=list("حركات الخزنة",d.transactions||[],x=>esc(x.type)+" | "+Number(x.amount||0).toLocaleString("en-US")+" جنيه | "+esc(x.reference||"")+" | "+esc(x.created_at||""));
 $("body").innerHTML=h;
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act({action:b.dataset.act}));
 document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>act({action:"activate",level:Number(b.dataset.level)}));
 $("saveProfile").onclick=async()=>{const keys=["first_name","second_name","third_name","fourth_name","national_id","phone","email","country","state","city","heir_name","heir_mother_name","referral_code","sponsor_id"];const o={action:"edit"};keys.forEach(k=>o[k]=$("f_"+k).value);await act(o)};
 $("setLogin").onclick=()=>setPassword("login");$("setWallet").onclick=()=>setPassword("wallet");
 $("addWallet").onclick=()=>wallet("add");$("removeWallet").onclick=()=>wallet("remove");
 $("bvDisplay").onclick=()=>bv("display");$("bvReal").onclick=()=>bv("real");$("bvDelete").onclick=async()=>{const v=Number($("f_bv").value),position=Number($("f_position").value),side=$("f_side").value;if(!(v>0))return alert("اكتب قيمة BV صحيحة");if(!confirm("سيتم خصم "+v+" BV من "+(side==="right"?"اليمين":"الشمال")+" للتوكيل "+String(position).padStart(2,"0")+"، وخصم نفس القيمة من حسابات الـUplines المتأثرة. لا يمكن حذف BV أكبر من الإضافات اليدوية المتاحة. هل تريد المتابعة؟"))return;try{await act({action:"manual_bv_delete",bv:v,account_position:position,side})}catch(e){$("msg").textContent=e.message;alert(e.message)}};
 $("showWallet").onclick=()=>{$("walletList").innerHTML=list("تفاصيل الخزنة",d.transactions||[],x=>esc(x.type)+" | "+Number(x.amount||0)+" جنيه | "+esc(x.reference||"")+" | "+esc(x.created_at||""))};
}
async function setPassword(kind){const v=$("f_"+(kind==="wallet"?"wallet_password":"login_password")).value;if(!v)return alert("اكتب كلمة السر الجديدة");await act({action:"password",kind,password:v})}
async function wallet(mode){const v=Number($("f_wallet_amount").value);if(!(v>0))return alert("اكتب مبلغًا صحيحًا");await act({action:"wallet",mode,amount:v})}
async function bv(mode){const v=Number($("f_bv").value);const position=Number($("f_position").value);const side=$("f_side").value;if(!(v>0))return alert("اكتب قيمة BV صحيحة");if(mode==="real"&&!confirm("سيتم تسجيل BV حقيقي وقد يؤثر على الـ uplines. هل أنت متأكد؟"))return;await act({action:"manual_bv",mode,bv:v,account_position:position,side})}
async function openMarketer(id){current=id;$("msg").textContent="";try{const d=await api("/api/admin/marketer-detail?id="+encodeURIComponent(id));$("title").textContent=d.profile?.display_name||id;render(d);$("drawer").classList.add("open")}catch(e){alert(e.message)}}
function showResendConfirmation(applicationId,button){
 const overlay=document.createElement("div");
 overlay.style.cssText="position:fixed;inset:0;z-index:10000;background:#000b;display:grid;place-items:center;padding:18px";
 const panel=document.createElement("div");
 panel.style.cssText="width:min(100%,460px);box-sizing:border-box;background:#101d2e;color:#fff;border:1px solid #ffffff24;border-radius:18px;padding:24px;box-shadow:0 24px 70px #0008";
 panel.innerHTML="<h3 style='margin-top:0'>تم إرسال بيانات التسجيل سابقًا</h3><p style='line-height:1.8;color:#cbd5e1'>تم إرسال رسالة بيانات التسجيل لهذا المسوق من قبل. هل تريد إرسالها مرة أخرى؟</p><div style='display:flex;gap:10px;flex-wrap:wrap;margin-top:18px'><button type='button' id='confirmRegistrationResend' class='btn primary'>إرسال مرة أخرى</button><button type='button' id='cancelRegistrationResend' class='btn'>إلغاء</button></div>";
 overlay.appendChild(panel);document.body.appendChild(overlay);
 const close=()=>overlay.remove();
 panel.querySelector("#cancelRegistrationResend").onclick=close;
 overlay.addEventListener("click",e=>{if(e.target===overlay)close()});
 panel.querySelector("#confirmRegistrationResend").onclick=async()=>{
  const confirmButton=panel.querySelector("#confirmRegistrationResend");confirmButton.disabled=true;confirmButton.textContent="جارٍ الإرسال…";
  try{await submitRegistrationEmail(applicationId,true,button);close()}catch(e){alert(e.message||"تعذر إرسال بيانات التسجيل.");confirmButton.disabled=false;confirmButton.textContent="إرسال مرة أخرى"}
 };
}
async function submitRegistrationEmail(applicationId,forceResend,button){
 const response=await fetch("/api/admin/resend-agent-welcome",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({application_id:applicationId,...(forceResend?{force_resend:true}:{})})});
 const data=await response.json().catch(()=>({}));
 if(response.status===409&&data.already_sent){showResendConfirmation(applicationId,button);return}
 if(!response.ok||data.ok!==true||data.welcome_email_sent!==true)throw Error(data.error||data.message||"تعذر إرسال بيانات التسجيل. حاول مرة أخرى.");
 if(button)button.dataset.welcomeStatus="sent";
 alert(forceResend?"تم إرسال بيانات التسجيل مرة أخرى بنجاح.":"تم إرسال بيانات التسجيل بنجاح.");
}
function sendRegistrationData(applicationId,status,button){
 if(!applicationId)return alert("لا توجد بيانات تسجيل مؤكدة لهذا المسوق.");
 if(status==="sent"){showResendConfirmation(applicationId,button);return}
 submitRegistrationEmail(applicationId,false,button).catch(e=>{
  if(String(e.message||"").includes("تم إرسال بيانات التسجيل")||String(e.message||"").includes("سابقًا"))showResendConfirmation(applicationId,button);
  else alert(e.message||"تعذر إرسال بيانات التسجيل.");
 });
}

let suggestionTimer=null,suggestionRequest=0;function closeSuggestions(){$("searchSuggestions").classList.remove("open");$("searchSuggestions").innerHTML=""}async function showSuggestions(){const q=$("q").value.trim(),request=++suggestionRequest;if(!q){closeSuggestions();return}try{const d=await api("/api/admin/marketers?ui_version=303&fresh="+Date.now()+"&page=1&q="+encodeURIComponent(q)+($("deleted").checked?"&deleted=1":""));if(request!==suggestionRequest)return;const items=d.marketers||[];const panel=$("searchSuggestions");if(!items.length){panel.innerHTML="<div style='padding:12px;color:#9fb0c6'>لا توجد نتائج مطابقة</div>";panel.classList.add("open");return}panel.innerHTML=items.slice(0,10).map(x=>"<button type='button' role='option' data-suggest-id='"+esc(x.id)+"' data-suggest-name='"+esc(x.display_name||x.referral_code||x.id)+"'><b>"+esc(x.display_name||"بدون اسم")+"</b><small>"+esc(x.referral_code||x.id||"")+((x.phone)?" • "+esc(x.phone):"")+"</small></button>").join("");panel.classList.add("open");panel.querySelectorAll("[data-suggest-id]").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.suggestName;closeSuggestions();load(1)})}catch(e){if(request===suggestionRequest)closeSuggestions()}}$("q").addEventListener("input",()=>{clearTimeout(suggestionTimer);suggestionTimer=setTimeout(showSuggestions,120)});$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();closeSuggestions();load(1)}if(e.key==="Escape")closeSuggestions()});document.addEventListener("click",e=>{if(!e.target.closest(".search-box"))closeSuggestions()});$("deleted").addEventListener("change",()=>{if($("q").value.trim())showSuggestions()});$("close").onclick=()=>{$("drawer").classList.remove("open")};$("drawer").onclick=e=>{if(e.target.id==="drawer")$("drawer").classList.remove("open")};$("search").onclick=()=>{closeSuggestions();load(1)};$("prev").onclick=()=>pg>1&&load(pg-1);$("next").onclick=()=>load(pg+1);$("q").value=initialParams.get("q")||"";$("deleted").checked=init
