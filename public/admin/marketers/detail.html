<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المسوق</title><link rel="stylesheet" href="/theme.css"><style>
.wrap{max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.btns{display:flex;gap:8px;flex-wrap:wrap}.box{background:#121e2d;border:1px solid #ffffff12;border-radius:18px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:#9fb0c6;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box}.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#0b1320;border-radius:14px;padding:13px}.stat b{display:block;font-size:20px;margin-top:5px}.danger{background:#8f2525!important}.warn{background:#6b5313!important}.success{background:#12613f!important}.list{max-height:420px;overflow:auto}.row{padding:11px;border-bottom:1px solid #ffffff12}.muted2{color:#9fb0c6;font-size:12px}.msg{position:sticky;bottom:15px;background:#0d1520;border:1px solid #ffffff18;border-radius:12px;padding:10px;margin-top:16px;font-weight:700}@media(max-width:900px){.grid,.grid2,.statgrid{grid-template-columns:1fr}}
</style></head><body class="app-shell"><main class="main-content wrap"><div class="top"><div><p class="eyebrow">إدارة الشبكة / المسوقون</p><h1 id="title">جاري التحميل...</h1><p id="sub" class="muted"></p></div><div class="btns"><a class="btn primary" id="networkBtn" href="/admin/marketers/network.html">عرض شبكة المسوق</a><a class="btn" href="/admin/marketers/">العودة للمسوقين</a><a class="btn" href="/admin/">لوحة الإدارة</a></div></div><div id="content"></div><div id="msg" class="msg"></div></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mid=params.get("id"),returnTo=params.get("return_to");let detail=null;const safeReturn=returnTo&&returnTo.startsWith("/admin/marketers/")&&!returnTo.startsWith("//")?returnTo:"/admin/marketers/";const backLink=document.querySelector('a[href="/admin/marketers/"]');if(backLink)backLink.href=safeReturn;const nb=document.getElementById("networkBtn");if(nb&&mid)nb.href="/admin/marketers/network.html?id="+encodeURIComponent(mid)+"&return_to="+encodeURIComponent(safeReturn);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt}),t=await r.text();let d={};try{d=JSON.parse(t)}catch{throw Error("استجابة غير صحيحة من الخادم")}if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}
async function act(payload){try{await api("/api/admin/marketers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,marketer_id:mid})});$("msg").textContent="تم تنفيذ العملية بنجاح";await load()}catch(e){$("msg").textContent="فشلت العملية: "+e.message}}
function f(label,key,val,type="text"){return "<div class='field'><label>"+label+"</label><input id='f_"+key+"' type='"+type+"' value='"+esc(val)+"'></div>"}
function list(title,arr,fn){arr=arr||[];return "<div class='box'><div class='top'><h2>"+title+"</h2><span class='muted2'>"+arr.length+" سجل</span></div><div class='list'>"+(arr.length?arr.map(x=>"<div class='row'>"+fn(x)+"</div>").join(""):"<div class='row muted2'>لا توجد بيانات</div>")+"</div></div>"}
function render(d){detail=d;const p=d.profile||{},a=d.application||{};$("title").textContent=p.display_name||mid;$("sub").innerHTML="ID: "+esc(mid)+" | الحالة: "+esc(p.status||"—")+" | كود الإحالة: "+esc(p.referral_code||"—");
let h="<div class='btns'>"+(p.deleted_at?"<button class='btn success' data-act='restore'>استرجاع المسوق</button>":"<button class='btn danger' data-act='delete'>حذف المسوق</button>")+(p.status==="blocked"?"<button class='btn success' data-act='unblock'>فك حظر المسوق</button>":"<button class='btn warn' data-act='block'>حظر المسوق</button>")+(p.login_blocked?"<button class='btn success' data-act='login_unblock'>إلغاء حظر تسجيل الدخول</button>":"<button class='btn warn' data-act='login_block'>حظر تسجيل الدخول</button>")+(p.activation_blocked?"<button class='btn success' data-act='activation_unblock'>إلغاء حظر التفعيل</button>":"<button class='btn warn' data-act='activation_block'>حظر التفعيل</button>")+"</div>";
h+="<div class='box'><h2>ملخص الحساب</h2><div class='statgrid'><div class='stat'>الرصيد<b>"+Number(d.wallet?.balance||0).toLocaleString()+" جنيه</b></div><div class='stat'>المبيعات<b>"+Number(p.qualified_sales||0)+"</b></div><div class='stat'>الفريق<b>"+Number(p.team_count||d.placements?.length||0)+"</b></div><div class='stat'>التفعيل<b>"+Number(p.admin_tier_override||0)+"</b></div><div class='stat'>حظر التفعيل<b>"+(p.activation_blocked?"نعم":"لا")+"</b></div></div></div>";
h+="<div class='box'><h2>تعديل كل بيانات التسجيل</h2><div class='grid'>"+f("الاسم الظاهر","display_name",p.display_name||"")+f("الاسم الأول","first_name",p.first_name||a.first_name||"")+f("الاسم الثاني","second_name",p.second_name||a.second_name||"")+f("الاسم الثالث","third_name",p.third_name||a.third_name||"")+f("الاسم الرابع","fourth_name",p.fourth_name||a.fourth_name||"")+f("الرقم القومي","national_id",p.national_id||a.national_id||"")+f("الهاتف","phone",p.phone||a.phone||"")+f("البريد","email",p.email||a.email||"","email")+f("الدولة","country",p.country||a.country||"")+f("المحافظة","state",p.state||a.state||"")+f("المدينة","city",p.city||a.city||"")+f("اسم الوريث","heir_name",p.heir_name||a.heir_name||"")+f("اسم أم الوريث","heir_mother_name",p.heir_mother_name||a.heir_mother_name||"")+f("كود الإحالة","referral_code",p.referral_code||"")+f("Sponsor ID","sponsor_id",p.sponsor_id||a.owner_marketer_id||"")+f("Referral ID","referral_id",a.referral_id||"")+"</div><div class='btns'><button class='btn primary' id='save'>حفظ البيانات</button></div></div>";
h+="<div class='box'><h2>بيانات العضوية بالشبكة</h2><div class='grid'>"+f("Member ID","member_id",a.member_id||mid)+f("التوكيل","account_position",a.account_position||"")+f("رقم الخانة","slot_no",a.slot_no||"")+f("الحالة","app_status",a.status||"")+f("تاريخ الانضمام","joined_at",a.joined_at||"")+f("IBN","ibn",a.ibn||"")+f("IBN Code","ibn_code",a.ibn_code||"")+f("Owner Marketer ID","owner_marketer_id",a.owner_marketer_id||"")+f("تاريخ الإنشاء","created_at",a.created_at||"")+"</div></div>";
h+="<div class='box'><h2>مستندات التسجيل والتسجيل الصوتي</h2><div class='grid2'>"+(a.national_id_front_url?"<div class='field'><label>صورة البطاقة - الوجه الأمامي</label><a href='"+esc(a.national_id_front_url)+"' target='_blank' rel='noopener'><img src='"+esc(a.national_id_front_url)+"' alt='الوجه الأمامي للبطاقة' style='width:100%;max-width:420px;max-height:320px;object-fit:contain;background:#fff;border-radius:10px'></a></div>":"<div class='field'><label>صورة البطاقة - الوجه الأمامي</label><p class='muted2'>لم يتم رفع الصورة</p></div>")+(a.national_id_back_url?"<div class='field'><label>صورة البطاقة - الوجه الخلفي</label><a href='"+esc(a.national_id_back_url)+"' target='_blank' rel='noopener'><img src='"+esc(a.national_id_back_url)+"' alt='الوجه الخلفي للبطاقة' style='width:100%;max-width:420px;max-height:320px;object-fit:contain;background:#fff;border-radius:10px'></a></div>":"<div class='field'><label>صورة البطاقة - الوجه الخلفي</label><p class='muted2'>لم يتم رفع الصورة</p></div>")+"</div><div style='margin-top:16px'><label>التسجيل الصوتي</label>"+(a.voice_recording_url?"<audio controls preload='none' style='width:100%;margin-top:8px' src='"+esc(a.voice_recording_url)+"'></audio>":"<p class='muted2'>لم يتم رفع التسجيل الصوتي</p>")+"</div></div>";
h+="<div class='box'><h2>كلمات السر</h2><div class='grid2'>"+f("كلمة سر الدخول الجديدة","login_password","","password")+f("كلمة سر المحفظة الجديدة","wallet_password","","password")+"</div><div class='btns'><button class='btn' id='loginPw'>تغيير كلمة سر الدخول</button><button class='btn' id='walletPw'>تغيير كلمة سر المحفظة</button></div></div>";
h+="<div class='box'><h2>المحفظة والخزنة</h2>"+f("المبلغ","wallet_amount","","number")+"<div class='btns'><button class='btn success' id='add'>إضافة رصيد</button><button class='btn danger' id='remove'>خصم رصيد</button><button class='btn' id='show'>عرض الخزنة</button></div><div id='wallet'></div></div>";
h+="<div class='box'><h2>التفعيل</h2><div class='btns'><button class='btn' data-level='1'>تفعيل أحادي</button><button class='btn' data-level='2'>تفعيل ثنائي</button><button class='btn' data-level='3'>تفعيل ثلاثي</button><button class='btn warn' data-level='0'>إلغاء التفعيل</button></div></div>";
h+="<div class='box'><h2>إضافة BV</h2><div class='grid'>"+f("قيمة BV","bv","1000","number")+"<div class='field'><label>التوكيل</label><select id='position'><option value='1'>01</option><option value='2'>02</option><option value='3'>03</option></select></div><div class='field'><label>الاتجاه</label><select id='side'><option value='right'>يمين</option><option value='left'>شمال</option></select></div></div><div class='btns'><button class='btn success' id='displayBv'>إضافة كتفعيل فقط وتغيير الشكل</button><button class='btn primary' id='realBv'>إضافة BV حقيقي</button><button class='btn danger' id='deleteBv'>حذف BV حقيقي</button></div></div>";
h+=list("أرصدة BV",d.bv,x=>"التوكيل "+esc(x.account_position)+" | يمين "+Number(x.right_bv||0)+" | شمال "+Number(x.left_bv||0)+" | الإجمالي "+Number(x.total_bv||0));
h+=list("الشيكات",d.checks,x=>"بداية الأسبوع "+esc(x.week_start)+" | التحديث الفعلي "+esc(x.settled_at||"—")+" | يمين "+Number(x.right_bv||0)+" | شمال "+Number(x.left_bv||0)+" | المستحق "+Number(x.check_amount||0)+" جنيه | "+esc(x.status||""));
h+=list("العمولات",d.commissions,x=>"المبلغ "+Number(x.amount||0)+" جنيه | المستوى "+esc(x.level||"—")+" | الحالة "+esc(x.status||"—")+" | "+esc(x.created_at||""));
h+="<div class='box'><div class='top'><h2>طلبات السحب وإدارتها</h2><span class='muted2'>"+(d.withdrawals||[]).length+" طلب</span></div><div class='list'>"+((d.withdrawals||[]).length?(d.withdrawals||[]).map(x=>"<div class='row'><b>"+Number(x.amount||0).toLocaleString()+" جنيه</b><p>الاسم: "+esc(x.full_name||"—")+" | رقم التحويل: "+esc(x.transfer_phone||"—")+"</p><p>الحالة الحالية: "+esc(x.status||"قيد الانتظار")+" | تاريخ الطلب: "+esc(x.created_at||"")+"</p>"+(x.note?"<p>ملاحظات / سبب الرفض: "+esc(x.note)+"</p>":"")+"<div class='grid2'><div class='field'><label>سبب الرفض (يظهر للمسوق)</label><input id='withdraw_reason_"+esc(x.id)+"' value='"+esc(x.note||"")+"' placeholder='اكتب سبب الرفض عند الرفض'></div><div class='field'><label>تحديث الحالة</label><select id='withdraw_status_"+esc(x.id)+"'><option value='pending' "+(String(x.status||"").toLowerCase()==="pending"?"selected":"")+">قيد الانتظار</option><option value='completed' "+(["completed","paid","approved","done"].includes(String(x.status||"").toLowerCase())?"selected":"")+">مكتمل (خصم المبلغ من المحفظة)</option><option value='rejected' "+(["rejected","declined"].includes(String(x.status||"").toLowerCase())?"selected":"")+">رفض الطلب</option><option value='cancelled' "+(["cancelled","canceled"].includes(String(x.status||"").toLowerCase())?"selected":"")+">إلغاء الطلب</option></select></div></div><button class='btn primary' style='margin-top:10px' data-withdrawal-save='"+esc(x.id)+"'>حفظ حالة طلب السحب</button></div>").join(""):"<div class='row muted2'>لا توجد طلبات سحب</div>")+"</div></div>";
h+=list("شبكة المسوق",d.placements,x=>"العضو "+esc(x.display_name||x.member_id)+" | التوكيل "+esc(x.account_position)+" | الاتجاه "+esc(x.side)+" | الأب "+esc(x.parent_member_id||"—"));
h+=list("حركات الخزنة",d.transactions,x=>esc(x.type)+" | "+Number(x.amount||0).toLocaleString()+" جنيه | "+esc(x.reference||"")+" | "+esc(x.created_at||""));
$("content").innerHTML=h;document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act({action:b.dataset.act}));document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>act({action:"activate",level:Number(b.dataset.level)}));document.querySelectorAll("[data-withdrawal-save]").forEach(b=>b.onclick=async()=>{const wid=b.dataset.withdrawalSave,status=$("withdraw_status_"+wid).value,reason=$("withdraw_reason_"+wid).value;if(status==="rejected"&&!reason.trim())return alert("اكتب سبب الرفض ليظهر للمسوق");if(status==="completed"&&!confirm("سيتم اعتماد السحب وخصم المبلغ من محفظة المسوق. هل تريد المتابعة؟"))return;try{await api("/api/admin/marketers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"withdrawal_status",marketer_id:mid,withdrawal_id:wid,status,reason})});$("msg").textContent="تم تحديث حالة طلب السحب بنجاح";await load()}catch(e){$("msg").textContent="تعذر تحديث طلب السحب: "+e.message}});
$("save").onclick=async()=>{const keys=["display_name","first_name","second_name","third_name","fourth_name","national_id","phone","email","country","state","city","heir_name","heir_mother_name","referral_code","sponsor_id"];const o={action:"edit"};keys.forEach(k=>o[k]=$("f_"+k).value);await act(o)};
$("loginPw").onclick=()=>pw("login");$("walletPw").onclick=()=>pw("wallet");$("add").onclick=()=>wallet("add");$("remove").onclick=()=>wallet("remove");$("show").onclick=()=>{$("wallet").innerHTML=list("تفاصيل الخزنة",detail.transactions,x=>esc(x.type)+" | "+Number(x.amount||0)+" جنيه | "+esc(x.reference||"")+" | "+esc(x.created_at||""))};$("displayBv").onclick=()=>bv("display");$("realBv").onclick=()=>bv("real");$("deleteBv").onclick=async()=>{const v=Number($("f_bv").value),position=Number($("position").value),side=$("side").value;if(!(v>0)||!Number.isSafeInteger(v))return alert("اكتب قيمة BV صحيحة كعدد صحيح");if(!confirm("سيتم خصم "+v+" BV من "+(side==="right"?"اليمين":"الشمال")+" للتوكيل "+String(position).padStart(2,"0")+" وخصم نفس القيمة من حسابات الـUplines المتأثرة. هل تريد المتابعة؟"))return;await act({action:"manual_bv_delete",bv:v,account_position:position,side})}}
async function pw(kind){const v=$("f_"+(kind==="wallet"?"wallet_password":"login_password")).value;if(!v)return alert("اكتب كلمة السر الجديدة");await act({action:"password",kind,password:v})}
async function wallet(mode){const v=Number($("f_wallet_amount").value);if(!(v>0))return alert("اكتب مبلغًا صحيحًا");if(mode==="remove"&&!confirm("هل تريد خصم هذا المبلغ من المحفظة؟"))return;await act({action:"wallet",mode,amount:v})}
async function bv(mode){const v=Number($("f_bv").value),position=Number($("position").value),side=$("side").value;if(!(v>0))return alert("اكتب قيمة BV صحيحة");if(mode==="real"&&!confirm("سيتم تسجيل BV حقيقي وقد يؤثر على الـ uplines. هل أنت متأكد؟"))return;await act({action:"manual_bv",mode,bv:v,account_position:position,side})}
async function load(){if(!mid){$("content").innerHTML="<div class='box'>المسوق غير محدد.</div>";return}try{render(await api("/api/admin/marketer-detail?id="+encodeURIComponent(mid)))}catch(e){$("content").innerHTML="<div class='box'>تعذر تحميل البيانات: "+esc(e.message)+"</div>"}}
load();
</script><script src="/hide-hatchable.js"></script><script src="/admin/guard.js"></script><script src="/theme-toggle.js?v=452"></script></body></html>
