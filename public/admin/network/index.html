:#e0d2c2!important}body[data-theme="light"] .pagination .page-info{color:#5b4635!important}body[data-theme="light"] .pagination button{background:#eadbc9!important;color:#432c1c!important;border-color:#b99a7c!important}body[data-theme="light"] .pagination button.active,body[data-theme="light"] .pagination button[aria-current="page"]{background:#6f452b!important;color:#fff!important;border-color:#56351f!important}body[data-theme="light"] .line{border-color:#8a6b4f!important}body[data-theme="light"] .muted{color:#5b4635!important}</style></head><body class="app-shell"><main class="main-content wrap"><header class="top"><div><p class="eyebrow">إدارة الشبكة</p><h1>شبكة الموقع</h1><p class="muted" id="summary">جاري تحميل الشبكة بالكامل...</p></div><div><a class="btn" href="/admin/marketers/">المسوقون</a> <a class="btn" href="/admin/">لوحة الإدارة</a></div></header><div class="site-search"><input id="networkSearch" type="search" autocomplete="off" placeholder="ابحث بالاسم أو رقم الهاتف أو كود المسوق..." aria-label="البحث في كل شبكات الموقع بالاسم أو الهاتف أو كود المسوق"><button id="networkSearchButton" type="button">بحث</button></div><div class="search-count" id="searchCount" aria-live="polite"></div><section class="card network"><div class="site-root"><div class="circle">T</div><b>Together Network — الشبكة الموحدة</b></div><div class="line"></div><div class="marketer-grid" id="grid"></div><nav class="pagination" id="pagination" aria-label="صفحات شبكة الموقع"></nav></section></main><script>
const networkSearch=document.querySelector('#networkSearch'),networkSearchButton=document.querySelector('#networkSearchButton');
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function avatar(x){return x.avatar_url?'<img src="'+esc(x.avatar_url)+'">':esc((x.display_name||x.referral_code||'?').slice(0,1))}
function authCard(x,tier,n){const level=Number(tier||0);const color=n<=level?(level===1?'bronze':level===2?'silver':'gold'):'inactive';if(!x)return '<div class="slot empty '+color+'">'+String(n).padStart(2,'0')+'</div>';return '<div class="slot filled '+color+'" onclick="event.stopPropagation();openNet(\''+encodeURIComponent(x.member_id)+'\')"><div><b>'+esc(x.account_position+' — '+(x.side==='left'?'شمال':'يمين'))+'</b><span>'+esc(x.member_name||x.member_id)+'</span></div></div>'}
function openNet(id){location.href='/admin/marketers/network.html?id='+id}
let allMarketers=[],currentPage=1;const PAGE_SIZE=20;function baseId(code){return String(code||"").replace(/(?:01|02|03)$/,"")}
function agencyId(base,pos){return base+String(pos).padStart(2,"0")}
function nodeTier(pos,tier){return pos<=tier?(tier===1?"bronze":tier===2?"silver":"gold"):"inactive"}
function miniNode(m,pos,base,tier){const level=nodeTier(pos,tier),label=pos===1?(m.display_name||m.referral_code||"مسوق"):"التوكيل "+String(pos).padStart(2,"0");return '<div class="mini-node n'+pos+' '+level+'"><div class="mini-avatar">'+avatar(m)+'</div><div class="mini-pos">'+String(pos).padStart(2,"0")+'</div><div class="mini-id">'+esc(agencyId(base,pos))+'</div><div class="mini-name">'+esc(label)+'</div></div>'}
function miniSlot(m,pos,side,slotClass){const x=(m.authorizations||[]).find(a=>Number(a.account_position)===pos&&a.side===side);const place=String(pos).padStart(2,"0")+' — '+(side==="left"?"شمال":"يمين");if(!x)return '<div class="mini-slot '+slotClass+' empty" onclick="event.stopPropagation()" aria-label="'+esc(place+' فارغ')+'"><div class="mini-slot-avatar">+</div><div class="mini-slot-id">'+esc(place)+'</div><div class="mini-slot-name">خانة فارغة</div></div>';const childName=x.member_name||x.referral_code||x.member_id||"مسوق";const childCode=agencyId(baseId(x.referral_code||x.member_id),1);const face=x.avatar_url?'<img src="'+esc(x.avatar_url)+'" alt="">':esc(String(childName).trim().slice(0,1)||"?");return '<div class="mini-slot '+slotClass+' filled" onclick="event.stopPropagation();openNet(\''+encodeURIComponent(x.member_id)+'\')" title="'+esc(childName)+' — '+esc(childCode)+'"><div class="mini-slot-avatar">'+face+'</div><div class="mini-slot-id">'+esc(childCode)+'</div><div class="mini-slot-name">'+esc(childName)+'</div></div>'}
function renderMarketers(q=''){const term=String(q||'').trim().toLocaleLowerCase();const filtered=allMarketers.filter(m=>!term||[m.display_name,m.referral_code,m.phone,m.id].some(v=>String(v||'').toLocaleLowerCase().includes(term)));const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));currentPage=Math.min(Math.max(1,currentPage),totalPages);const start=(currentPage-1)*PAGE_SIZE;document.querySelector('#searchCount').textContent=(term?'نتائج البحث: ':'إجمالي المسوقين: ')+filtered.length+' — عرض '+(filtered.length?start+1:0)+'–'+Math.min(start+PAGE_SIZE,filtered.length);grid.innerHTML=filtered.slice(start,start+PAGE_SIZE).map(m=>{const base=baseId(m.referral_code||m.id);const tier=Math.max(0,Math.min(3,Number(m.admin_tier_override||0)));return '<article class="marketer" onclick="openNet(\''+encodeURIComponent(m.id)+'\')"><div class="mini-card-heading"><div><div class="name">'+esc(m.display_name||m.referral_code||"مسوق")+'</div><div class="code">'+esc(m.referral_code||m.id)+'</div></div><span class="mini-open">عرض الشبكة</span></div><div class="mini-map" aria-label="شبكة '+esc(m.display_name||m.referral_code||"مسوق")+'"><svg class="mini-lines" viewBox="0 0 600 430" preserveAspectRatio="none" aria-hidden="true"><path d="M300 83 V122 H165 V136"/><path d="M300 122 H435 V136"/><path d="M165 222 V254 H72 V285"/><path d="M165 254 H210 V285"/><path d="M435 222 V254 H390 V285"/><path d="M435 254 H528 V285"/></svg>'+miniNode(m,1,base,tier)+miniNode(m,2,base,tier)+miniNode(m,3,base,tier)+miniSlot(m,2,"left","s21")+miniSlot(m,2,"right","s22")+miniSlot(m,3,"left","s31")+miniSlot(m,3,"right","s32")+'</div><div class="count">اضغط على أي عقدة من الفريق لفتح شبكته. جميع المسوقين متاحون عبر البحث والصفحات.</div></article>'}).join('');const nav=document.querySelector('#pagination');let buttons='<button type="button" '+(currentPage===1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">السابق</button>';for(let i=1;i<=totalPages;i++){if(totalPages<=9||i===1||i===totalPages||Math.abs(i-currentPage)<=2){buttons+='<button type="button" class="'+(i===currentPage?'active':'')+'" aria-current="'+(i===currentPage?'page':'false')+'" onclick="goPage('+i+')">'+i+'</button>'}else if(Math.abs(i-currentPage)===3){buttons+='<span style="color:#9fb0c6;padding:0 2px">…</span>'}}buttons+='<button type="button" '+(currentPage===totalPages?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">التالي</button><div class="page-info">صفحة '+currentPage+' من '+totalPages+' — بحد أقصى 20 شبكة في الصفحة</div>';nav.innerHTML=buttons;nav.style.display=filtered.length?'flex':'none'}function goPage(page){currentPage=page;renderMarketers(networkSearch.value);document.querySelector('.network').scrollIntoView({behavior:'smooth',block:'start'})}
async function load(){try{const r=await fetch('/api/admin/network',{cache:'no-store'});const d=await r.json();if(!r.ok){summary.textContent=d.error||'تعذر تحميل الشبكة';return}allMarketers=d.marketers||[];summary.textContent='عدد المسوقين في النظام: '+d.site.marketer_count+' — الشبكة واحدة ومتاحة للإدارة بالكامل';renderMarketers(networkSearch.value)}catch(e){summary.textContent='تعذر تحميل الشبكة: '+e.message}}
networkSearchButton.addEventListener('click',()=>renderMarketers(networkSearch.value));networkSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();renderMarketers(networkSearch.value)}});networkSearch.addEventListener('input',()=>renderMarketers(networkSearch.value));
load();
