<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائل المسوقين | Together Network</title><link rel="stylesheet" href="/theme.css"><style>
.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px}.panel{background:#fff;border:1px solid #dfe5ed;border-radius:16px;padding:14px;min-width:0}.search{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:12px}.threads{display:flex;flex-direction:column;gap:7px;max-height:65vh;overflow:auto}.thread{width:100%;text-align:right;border:1px solid #e2e8f0;border-radius:11px;padding:11px;background:#fff;cursor:pointer;color:#111}.thread.active{border-color:#1675d1;background:#eff7ff}.unread{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:99px;background:#dc2626;color:#fff;font-weight:900;padding:0 6px}.preview{display:block;color:#64748b;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat{height:52vh;min-height:280px;overflow:auto;background:#f4f6fa;border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:84%;padding:11px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #dbe2eb;align-self:flex-start;color:#17202b}.bubble.admin{align-self:flex-end;background:#dceeff;border-color:#a9d5ff}.bubble time{display:block;font-size:11px;color:#667085;margin-top:6px}.compose{display:flex;gap:8px;margin-top:10px;align-items:stretch}.compose textarea{flex:1;min-width:0;border:1px solid #ccd5e0;border-radius:10px;padding:11px;font:inherit}.compose button,.attachBtn{border:0;border-radius:10px;background:#1268d3;color:#fff;font-weight:800;padding:10px 15px;cursor:pointer}.attachBtn{background:#475569;white-space:nowrap}.muted{color:#64748b;font-size:13px}.pending{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pending span{background:#eef2f7;padding:7px 10px;border-radius:9px;font-size:12px}.media{display:block;max-width:min(100%,360px);max-height:300px;border-radius:10px;margin-top:8px}.filelink{display:inline-block;margin-top:8px;color:#075db3;text-decoration:underline;font-weight:700}.attachment{display:block;margin-top:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.threads{max-height:240px}.compose{flex-wrap:wrap}.compose textarea{flex-basis:100%}.compose button,.attachBtn{flex:1}.chat{height:42vh}}
</style></head><body><main class="shell"><header class="top"><div class="logo"><div class="mark">T</div><div>رسائل المسوقين</div></div><a class="btn" href="/admin/">لوحة الإدارة</a></header><p class="muted">محادثات مباشرة بين الإدارة والمسوقين، مع إرسال الصور والفيديوهات وملفات PDF.</p><div id="status" class="muted">جارٍ التحميل…</div><div class="layout"><section class="panel"><input id="search" class="search" placeholder="بحث بالاسم أو كود المسوق"><div id="threads" class="threads"></div></section><section class="panel"><h2 id="title">اختر محادثة</h2><div id="chat" class="chat"><p class="muted">اختر اسم مسوق لعرض الرسائل والرد عليه.</p></div><div id="pending" class="pending"></div><form id="form" class="compose"><textarea id="message" rows="2" maxlength="4000" placeholder="اكتب رد الإدارة…" disabled></textarea><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf" multiple hidden><button class="attachBtn" id="pick" type="button" disabled>📎 إضافة مرفقات</button><button id="send" type="submit" disabled>إرسال الرد</button></form></section></div></main><script src="/admin/guard.js"></script><script>
const $=s=>document.querySelector(s);let conversations=[],selected="",messages=[],pending=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function attachmentHtml(a){const url=esc(a.url||"#"),name=esc(a.name||"مرفق"),type=String(a.type||"");if(type.startsWith("image/"))return '<a class="attachment" href="'+url+'" target="_blank" rel="noopener"><img class="media" src="'+url+'" alt="'+name+'"></a>';if(type.startsWith("video/"))return '<video class="media" controls preload="metadata" src="'+url+'"></video>';return '<a class="filelink" href="'+url+'" target="_blank" rel="noopener">📄 '+name+' — فتح / تحميل PDF</a>'}
async function load(){const q=$("#search").value.trim();const u="/api/admin/support-chat"+(q?"?q="+encodeURIComponent(q)+"&":"?")+"fresh="+Date.now();const r=await fetch(u,{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل رسائل المسوقين");conversations=d.conversations||[];$("#status").innerHTML='رسائل غير مقروءة: <span class="unread">'+Number(d.total_unread||0)+'</span>';renderThreads();if(selected&&conversations.some(x=>x.marketer_id===selected))await openThread(selected,false)}
function renderThreads(){const q=$("#search").value.trim().toLocaleLowerCase("ar");const list=conversations.filter(c=>[c.name,c.referral_code,c.marketer_id].some(x=>String(x||"").toLocaleLowerCase("ar").includes(q)));$("#threads").innerHTML=list.length?list.map(c=>'<button class="thread '+(selected===c.marketer_id?"active":"")+'" data-id="'+esc(c.marketer_id)+'"><strong><span>'+esc(c.name||c.referral_code||c.marketer_id)+'</span>'+(Number(c.unread)>0?'<span class="unread">'+Number(c.unread)+'</span>':'')+'</strong><span class="preview">'+esc(c.last_message||"لا توجد رسائل")+' · '+esc(c.referral_code||"")+'</span></button>').join(""):'<p class="muted">لا توجد محادثات.</p>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openThread(b.dataset.id,true))}
async function openThread(id,refreshList=true){selected=id;const c=conversations.find(x=>x.marketer_id===id);$("#title").textContent=(c?.name||"محادثة المسوق")+" — "+(c?.referral_code||id);$("#message").disabled=false;$("#send").disabled=false;$("#pick").disabled=false;const r=await fetch("/api/admin/support-chat?marketer_id="+encodeURIComponent(id)+"&fresh="+Date.now(),{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر فتح المحادثة");messages=d.messages||[];renderChat();if(refreshList)await load()}
function renderChat(){$("#chat").innerHTML=messages.length?messages.map(m=>'<div class="bubble '+(m.sender_role==="admin"?"admin":"")+'">'+(m.message?esc(m.message):"")+(Array.isArray(m.attachments)?m.attachments.map(attachmentHtml).join(""):"")+'<time>'+esc(new Date(m.created_at).toLocaleString("ar-EG"))+(m.sender_role==="admin"?" · الإدارة":" · المسوق")+'</time></div>').join(""):'<p class="muted">لا توجد رسائل في هذه المحادثة حتى الآن.</p>';$("#chat").scrollTop=$("#chat").scrollHeight}
function renderPending(){$("#pending").innerHTML=pending.map((a,i)=>'<span>'+esc(a.name)+' <button type="button" data-remove="'+i+'">×</button></span>').join("");document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{pending.splice(Number(b.dataset.remove),1);renderPending()})}
function toBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]||"");r.onerror=reject;r.readAsDataURL(file)})}
async function upload(file){if(file.size>15*1024*1024)throw Error("حجم الملف أكبر من 15 ميجابايت: "+file.name);const data_base64=await toBase64(file);const r=await fetch("/api/admin/support-media",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content_type:file.type,name:file.name,data_base64})});const d=await r.json();if(!r.ok)throw Error(d.error==="unsupported_media_type"?"نوع الملف غير مدعوم":d.error==="file_too_large"?"حجم الملف أكبر من المسموح":d.error||"تعذر رفع المرفق");return d.attachment}
$("#pick").onclick=()=>$("#files").click();
$("#files").onchange=async()=>{const files=Array.from($("#files").files||[]);$("#files").value="";if(pending.length+files.length>5){$("#status").textContent="يمكن إضافة 5 مرفقات كحد أقصى للرسالة الواحدة.";return}$("#pick").disabled=true;try{for(const f of files){if(!["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm","video/quicktime","application/pdf"].includes(f.type))throw Error("نوع الملف غير مدعوم: "+f.name);$("#status").textContent="جارٍ رفع "+f.name+"…";pending.push(await upload(f));renderPending()}$("#status").textContent="المرفقات جاهزة للإرسال."}catch(e){$("#status").textContent=e.message}finally{$("#pick").disabled=false}};
$("#form").onsubmit=async e=>{e.preventDefault();const message=$("#message").value.trim();if(!selected||(!message&&!pending.length))return;$("#send").disabled=true;$("#pick").disabled=true;try{const r=await fetch("/api/admin/support-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({marketer_id:selected,message,attachments:pending})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر إرسال الرد");messages.push(d.message);$("#message").value="";pending=[];renderPending();renderChat();await load()}catch(err){$("#status").textContent=err.message}finally{$("#send").disabled=false;$("#pick").disabled=false}};
let debounce;$("#search").oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>load().catch(e=>$("#status").textContent=e.message),250)};
load().catch(e=>$("#status").textContent=e.message);setInterval(()=>load().catch(()=>{}),8000);
</script><script src="/theme-toggle.js"></script></body></html>
