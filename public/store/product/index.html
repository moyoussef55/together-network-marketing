<body class="app-shell"><main class="main-content detail-wrap"><div class="product-top-actions" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><a class="btn primary" href="/marketer/dashboard/" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:42px">↩ العودة للوحة التحكم</a><a class="back-link" href="/store/" style="margin-bottom:0">← العودة إلى المتجر</a></div><div id="app" class="product-shell">جاري تحميل تفاصيل المنتج…</div></main>
<script>
const el=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let product=null,marketerId="",currentMarketer={},chosenSize="",chosenColor="",timerHandle=null,shipping={country:"",governorate:"",address:"",phone:""};
function youtubeEmbed(raw){try{const u=new URL(raw);let id="";if(u.hostname.includes("youtu.be"))id=u.pathname.slice(1);else if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")id=u.searchParams.get("v")||"";else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]||""}return id?"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id):""}catch{return""}}
function videoMarkup(raw){const u=String(raw||"");const embed=youtubeEmbed(u);if(embed)return '<iframe loading="lazy" src="'+esc(embed)+'" title="فيديو '+esc(product.name)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';if(/^https?:\/\/.+\.(mp4|webm|ogg)(\?.*)?$/i.test(u))return '<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>';return '<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">مشاهدة الفيديو</a>'}
async function init(){const params=new URLSearchParams(location.search),id=params.get("id"),salesOwner=params.get("sales_owner");if(!id){el.textContent="لم يتم تحديد المنتج.";return}const me=await fetch("/api/network/me",{cache:"no-store"});if(me.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!me.ok){el.textContent="تعذر التحقق من حساب المسوق. حاول تحديث الصفحة.";return}const md=await me.json();currentMarketer=md.marketer||{};marketerId=String(currentMarketer.id||"");if(salesOwner&&marketerId!==salesOwner){el.innerHTML='<div><h2>صفحة البيع خاصة بحساب المسوق صاحب الرابط</h2><p>سجّل الدخول إلى حساب المسوق الذي أنشأ صفحة البيع لعرض المنتج وإتمام الشراء من هذا الرابط.</p><a class="btn primary" href="/login?next='+encodeURIComponent(location.pathname+location.search)+'">تسجيل الدخول بالحساب الصحيح</a></div>';return}const r=await fetch("/api/store/catalog");if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){el.textContent="تعذر تحميل المنتج.";return}const d=await r.json();product=(d.products||[]).find(p=>p.id===id);if(!product){el.textContent="المنتج غير موجود أو غير متاح.";return}render()}
function allMedia(){return [...(product.images||[]).map(i=>({kind:"image",url:i.url})),...(Array.isArray(product.videos)?product.videos:[]).map(url=>({kind:"video",url}))]}
function selectMedia(index){const media=allMedia()[index];if(!media)return;const frame=document.querySelector("#mainMedia");if(!frame)return;frame.innerHTML=media.kind==="image"?'<img src="'+esc(media.url)+'" alt="'+esc(product.name)+'">':videoMarkup(media.url);document.querySelectorAll(".thumb").forEach((t,i)=>t.classList.toggle("active",i===index))}
function render(){const media=allMedia(),discount=Number(product.original_price)>Number(product.price),sizes=Array.isArray(product.sizes)?product.sizes:[],colors=Array.isArray(product.colors)?product.colors:[],clothing=product.product_type==="clothing";const main=media.length?(media[0].kind==="image"?'<img src="'+esc(media[0].url)+'" alt="'+esc(product.name)+'">':videoMarkup(media[0].url)):'<div class="empty-media"><b>Together</b><span>'+esc(product.name)+'</span><small>أضف صورة المنتج من الإدارة</small></div>';const thumbs=media.map((m,i)=>'<button type="button" class="thumb '+(!i?"active":"")+'" onclick="selectMedia('+i+')" aria-label="عرض الوسيط '+(i+1)+'">'+(m.kind==="image"?'<img src="'+esc(m.url)+'" alt="">':'<span>▶ فيديو '+(i+1)+'</span>')+'</button>').join("");const pct=discount?Math.round((1-Number(product.price)/Number(product.original_price))*100):0;
el.innerHTML='<div class="detail-grid"><div class="gallery-main"><div id="mainMedia" class="media-frame">'+main+'</div><div class="thumbs">'+thumbs+'</div></div><section><p class="eyebrow">'+esc(product.category_name||"منتج Together")+'</p><h1 class="product-title">'+esc(product.name)+'</h1>'+(product.short_description?'<p class="short-desc">'+esc(product.short_description)+'</p>':'')+'<div class="price-row"><strong class="current-price">'+Number(product.price).toLocaleString("en-US",{maximumFractionDigits:2})+' ج.م</strong>'+(discount?'<span class="original-price">'+Number(product.original_price).toLocaleString("en-US",{maximumFractionDigits:2})+' ج.م</span><span class="discount-pill">خصم '+pct+'%</span>':'')+'</div><div class="stock-row"><span>المخزون المتاح</span><strong class="'+(Number(product.stock)>0?"stock-good":"stock-low")+'">'+(Number(product.stock)>0?Number(product.stock)+" قطعة متاحة":"غير متوفر حاليًا")+'</strong></div><div id="countdown" class="countdown" '+(!product.countdown_end_at?"hidden":"")+'><div class="countdown-title">ينتهي العرض خلال</div><div class="countdown-digits"><div class="digit"><span id="cdDays">00</span><small>يوم</small></div><div class="digit"><span id="cdHours">00</span><small>ساعة</small></div><div class="digit"><span id="cdMinutes">00</span><small>دقيقة</small></div><div class="digit"><span id="cdSeconds">00</span><small>ثانية</small></div></div></div>'+(clothing&&(sizes.length||colors.length)?'<div class="variant-fields">'+(sizes.length?'<label>اختيار المقاس <select id="sizeChoice"><option value="">اختر المقاس</option>'+sizes.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join("")+'</select></label>':'')+(colors.length?'<label>اختيار اللون <select id="colorChoice"><option value="">اختر اللون</option>'+colors.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("")+'</select></label>':'')+'</div>':'')+'<div class="long-desc">'+esc(product.description||"لا يوجد وصف تفصيلي لهذا المنتج بعد.")+'</div><div class="action-row"><button class="btn primary" onclick="buyNow()" '+(Number(product.stock)>0?"":"disabled")+'>شراء الآن</button><button class="btn" type="button" onclick="createSalesPage()">إنشاء صفحة بيع</button></div><div id="salesLink" class="sales-tools"></div><button class="btn" style="width:100%;margin-top:10px" onclick="addCart()" '+(Number(product.stock)>0?"":"disabled")+'>أضف للسلة</button><div id="checkout" class="checkout" hidden></div><div id="msg" class="message" role="status"></div></section></div>';
if(product.countdown_end_at)startCountdown(product.countdown_end_at);else if(timerHandle)clearInterval(timerHandle)}
function startCountdown(end){if(timerHandle)clearInterval(timerHandle);const finish=new Date(end).getTime();const tick=()=>{const left=finish-Date.now(),box=document.querySelector("#countdown");if(!box)return;if(left<=0){box.innerHTML='<div class="countdown-title">انتهى وقت العرض</div>';clearInterval(timerHandle);return}const vals={cdDays:Math.floor(left/86400000),cdHours:Math.floor(left%86400000/3600000),cdMinutes:Math.floor(left%3600000/60000),cdSeconds:Math.floor(left%60000/1000)};Object.entries(vals).forEach(([id,v])=>{const n=document.getElementById(id);if(n)n.textContent=String(v).padStart(2,"0")})};tick();timerHandle=setInterval(tick,1000)}
function readVariants(){const sizes=Array.isArray(product.sizes)?product.sizes:[],colors=Array.isArray(product.colors)?product.colors:[];chosenSize=document.querySelector("#sizeChoice")?.value||"";chosenColor=document.querySelector("#colorChoice")?.value||"";if(product.product_type==="clothing"&&sizes.length&&!chosenSize){document.querySelector("#msg").textContent="من فضلك اختر المقاس أولًا.";return false}if(product.product_type==="clothing"&&colors.length&&!chosenColor){document.querySelector("#msg").textContent="من فضلك اختر اللون أولًا.";return false}return true}
function addCart(){if(!readVariants())return;let cart={};try{cart=JSON.parse(localStorage.getItem("tn_store_cart")||"{}")}catch{}cart[product.id]=Math.min(Number(product.stock),Number(cart[product.id]||0)+1);localStorage.setItem("tn_store_cart",JSON.stringify(cart));let choices={};try{choices=JSON.parse(localStorage.getItem("tn_store_variant_choices")||"{}")}catch{}choices[product.id]={selected_size:chosenSize,selected_color:chosenColor};localStorage.setItem("tn_store_variant_choices",JSON.stringify(choices));document.querySelector("#msg").textContent="تمت إضافة المنتج إلى السلة مع حفظ المقاس واللون المختارين.";window.setTimeout(()=>location.href="/store/",700)}
function buyNow(){if(!readVariants())return;showShipping()}
function showShipping(){if(!readVariants())return;const box=document.querySelector("#checkout");box.hidden=false;box.innerHTML='<h3>بيانات الشحن</h3><form id="shippingForm" class="checkout-form"><label>الدولة<input name="country" required maxlength="120" autocomplete="country-name"></label><label>المحافظة<input name="governorate" required maxlength="120"></label><label>العنوان<input name="address" required maxlength="500" autocomplete="street-address"></label><label>رقم الهاتف<input name="phone" required maxlength="40" inputmode="tel" autocomplete="tel"></label><button class="btn primary" type="submit">متابعة الشراء</button></form>';box.scrollIntoView({behavior:"smooth",block:"start"});window.setTimeout(()=>document.querySelector("#shippingForm input[name=\"country\"]")?.focus({preventScroll:true}),450);document.querySelector("#shippingForm").onsubmit=e=>{e.preventDefault();shipping=Object.fromEntries(["country","governorate","address","phone"].map(k=>[k,String(new FormData(e.currentTarget).get(k)||"").trim()]));box.innerHTML='<div class="checkout-note">بمجرد قيامك بعملية الشراء يتم خصم قيمة المنتج ولا يحق لك استرداد المبلغ ويصبح لك منتج عند الشركة هنقوم بالتواصل معك لاستلامه</div><label class="consent-box"><input id="purchaseConsent" type="checkbox"><span>أوافق على الشروط الموضحة وأؤكد رغبتي في الشراء.</span></label><button id="confirm" class="btn primary" disabled>تأكيد الشراء</button><button class="btn" style="margin-top:8px" onclick="showShipping()">رجوع لتعديل البيانات</button>';const consent=document.querySelector("#purchaseConsent"),confirm=document.querySelector("#confirm");consent.addEventListener("change",()=>confirm.disabled=!consent.checked);confirm.onclick=submitPurchase}}
async function submitPurchase(){const btn=document.querySelector("#confirm");btn.disabled=true;btn.textContent="جاري تأكيد الشراء…";const r=await fetch("/api/store/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...shipping,items:[{product_id:product.id,quantity:1,selected_size:chosenSize,selected_color:chosenColor}]})});const d=await r.json();if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){btn.disabled=false;btn.textContent="تأكيد الشراء";const messages={insufficient_balance:"رصيدك غير كافٍ لشراء هذا المنتج.",out_of_stock:"المنتج غير متوفر بالكمية المطلوبة.",product_not_found:"المنتج غير موجود.",shipping_details_required:"أكمل بيانات الشحن.",size_required:"اختر مقاس المنتج.",color_required:"اختر لون المنتج.",invalid_size:"المقاس المختار غير متاح.",invalid_color:"اللون المختار غير متاح."};document.querySelector("#msg").textContent=messages[d.error]||"تعذر إتمام الشراء. لم يتم تأكيد الطلب.";return}const tnInvoiceShipping = shipping || {};
const tnInvoiceOrder = d.order || {};
const tnInvoiceEsc = v => typeof esc === "function" ? esc(String(v ?? "—")) : String(v ?? "—").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const tnInvoiceOrderNo = String(tnInvoiceOrder.id || "—");
const tnInvoiceMarketerName = String(d.marketer_name || [currentMarketer.first_name,currentMarketer.second_name,currentMarketer.third_name,currentMarketer.fourth_name].filter(Boolean).join(" ").trim() || currentMarketer.display_name || currentMarketer.name || "—");
const tnInvoiceMarketerCode = String(d.marketer_code || currentMarketer.referral_code || currentMarketer.code || "—");
const tnInvoiceDate = tnInvoiceOrder.created_at ? new Date(tnInvoiceOrder.created_at).toLocaleString("ar-EG",{timeZone:"Africa/Cairo"}) : new Date().toLocaleString("ar-EG",{timeZone:"Africa/Cairo"});
const tnInvoiceAmount = Number(d.amount ?? tnInvoiceOrder.total ?? 0);
const tnInvoiceStatus = String(tnInvoiceOrder.fulfillment_status || tnInvoiceOrder.status || "جارى معالجة الطلب");
const tnInvoicePayment = String(d.payment_method || tnInvoiceOrder.payment_method || "wallet");
const tnInvoiceProductName = String(product?.name || product?.title || document.querySelector("h1")?.textContent || "المنتج").trim();
const tnInvoicePhone = String(tnInvoiceShipping.phone || "—");
const tnInvoiceAddress = [tnInvoiceShipping.country,tnInvoiceShipping.governorate,tnInvoiceShipping.address].filter(Boolean).join("، ") || "—";
const tnInvoiceSize = String(chosenSize || "—");
const tnInvoiceColor = String(chosenColor || "—");
document.querySelector("#checkout").innerHTML = `
<style id="tn-invoice-print-style">

#tn-invoice .tn-invoice-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid #e3e8f0;padding-bottom:18px;margin-bottom:18px}
