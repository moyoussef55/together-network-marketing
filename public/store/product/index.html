<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل المنتج | Together</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script>
<style>
:root{color-scheme:dark}.detail-wrap{max-width:1120px;margin:auto;padding:24px}.back-link{display:inline-flex;margin-bottom:18px;color:#bfdbfe;text-decoration:none}.product-shell{border:1px solid #ffffff17;border-radius:24px;padding:clamp(16px,3vw,30px);background:linear-gradient(145deg,#101f34,#091321);box-shadow:0 25px 60px #0003}.detail-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:clamp(20px,4vw,42px);align-items:start}.gallery-main{display:grid;gap:12px}.media-frame{width:100%;min-height:300px;max-height:580px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff17;border-radius:18px;background:#07111f}.media-frame img,.media-frame video,.media-frame iframe{width:100%;height:100%;min-height:300px;max-height:580px;object-fit:contain;border:0}.empty-media{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:100%;height:100%;min-height:300px;background:radial-gradient(circle at 50% 35%,#27466a,#07111f 72%);color:#bfdbfe}.empty-media b{font-size:34px;letter-spacing:2px}.empty-media span{font-size:20px;font-weight:800}.empty-media small{font-size:12px;color:#a8bad0}.thumbs{display:flex;gap:10px;overflow:auto;padding:3px}.thumb{flex:0 0 82px;width:82px;height:72px;border:1px solid #ffffff25;border-radius:10px;padding:3px;background:#0b1728;overflow:hidden;cursor:pointer}.thumb.active{border-color:#60a5fa;box-shadow:0 0 0 2px #60a5fa33}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{display:grid;place-items:center;height:100%;font-size:12px}.eyebrow{color:#93c5fd}.product-title{font-size:clamp(26px,3vw,38px);line-height:1.4;margin:8px 0 12px}.short-desc{font-size:17px;color:#e2e8f0;line-height:1.9}.long-desc{color:#b9c7d8;line-height:2;white-space:pre-line;margin-top:16px}.price-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.current-price{font-size:30px;font-weight:900;color:#f8fafc}.original-price{font-size:17px;color:#9aa9bd;text-decoration:line-through}.discount-pill{padding:5px 9px;border-radius:999px;background:#7f1d1d;color:#fecaca;font-size:12px;font-weight:800}.stock-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:12px 14px;background:#ffffff08;border:1px solid #ffffff12;border-radius:12px}.stock-good{color:#86efac}.stock-low{color:#fca5a5}.countdown{margin:14px 0;padding:14px;border-radius:14px;background:linear-gradient(110deg,#3b1720,#241728);border:1px solid #fb718533}.countdown-title{font-size:13px;color:#fecdd3;margin-bottom:8px}.countdown-digits{display:flex;gap:8px;flex-wrap:wrap}.digit{min-width:54px;text-align:center;padding:8px;background:#0b1020;border-radius:9px;font-weight:900;font-variant-numeric:tabular-nums}.digit small{display:block;font-size:10px;color:#aab6c7;font-weight:500}.variant-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.variant-fields label{display:grid;gap:7px;color:#d8e2ef;font-size:13px;font-weight:700}.variant-fields select{width:100%;padding:12px;border-radius:10px;background:#0c1a2b;color:#fff;border:1px solid #33465e}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.action-row .btn{width:100%;min-height:48px}.sales-tools{margin-top:10px}.sales-tools .btn{width:100%;border:1px solid #60a5fa55;background:#152b4a}.sales-link{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.sales-link input{min-width:0;width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #33465e;background:#07111f;color:#e2e8f0;direction:ltr}.checkout{margin-top:22px;padding-top:18px;border-top:1px solid #ffffff17}.checkout-form{display:grid;gap:12px}.checkout-form label{display:grid;gap:6px;font-size:13px;font-weight:700}.checkout-form input{width:100%;box-sizing:border-box;border:1px solid #33465e;background:#0c1a2b;color:#fff;border-radius:10px;padding:12px;font:inherit}.checkout-note{padding:12px;border-radius:10px;background:#ffffff08;line-height:1.8;font-size:13px}.consent-box{display:flex;align-items:flex-start;gap:10px;margin:14px 0;padding:12px;border:1px solid #33465e;border-radius:12px;background:#0c1a2b;line-height:1.7;font-size:13px}.consent-box input{width:18px;height:18px;flex:0 0 18px;margin-top:3px;accent-color:#22c55e}.consent-box:has(input:checked){border-color:#22c55e;background:#103024}.btn:disabled{opacity:.45;cursor:not-allowed}.message{margin-top:12px;line-height:1.8}.secondary-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}.secondary-media video,.secondary-media iframe{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;border:0}
@media(max-width:760px){.detail-wrap{padding:14px}.detail-grid{grid-template-columns:1fr}.media-frame,.media-frame img,.media-frame video,.media-frame iframe{min-height:240px}.variant-fields{grid-template-columns:1fr}.action-row{grid-template-columns:1fr 1fr}.product-shell{padding:14px}}
</style>
</head>
<body class="app-shell"><main class="main-content detail-wrap"><a class="back-link" href="/store/">← العودة إلى المتجر</a><div id="app" class="product-shell">جاري تحميل تفاصيل المنتج…</div></main>
<script>
const el=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let product=null,marketerId="",chosenSize="",chosenColor="",timerHandle=null,shipping={country:"",governorate:"",address:"",phone:""};
function youtubeEmbed(raw){try{const u=new URL(raw);let id="";if(u.hostname.includes("youtu.be"))id=u.pathname.slice(1);else if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")id=u.searchParams.get("v")||"";else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]||""}return id?"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id):""}catch{return""}}
function videoMarkup(raw){const u=String(raw||"");const embed=youtubeEmbed(u);if(embed)return '<iframe loading="lazy" src="'+esc(embed)+'" title="فيديو '+esc(product.name)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';if(/^https?:\/\/.+\.(mp4|webm|ogg)(\?.*)?$/i.test(u))return '<video controls playsinline preload="metadata" src="'+esc(u)+'"></video>';return '<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">مشاهدة الفيديو</a>'}
async function init(){const params=new URLSearchParams(location.search),id=params.get("id"),salesOwner=params.get("sales_owner");if(!id){el.textContent="لم يتم تحديد المنتج.";return}const me=await fetch("/api/network/me",{cache:"no-store"});if(me.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!me.ok){el.textContent="تعذر التحقق من حساب المسوق. حاول تحديث الصفحة.";return}const md=await me.json();marketerId=String(md.marketer?.id||"");if(salesOwner&&marketerId!==salesOwner){el.innerHTML='<div><h2>صفحة البيع خاصة بحساب المسوق صاحب الرابط</h2><p>سجّل الدخول إلى حساب المسوق الذي أنشأ صفحة البيع لعرض المنتج وإتمام الشراء من هذا الرابط.</p><a class="btn primary" href="/login?next='+encodeURIComponent(location.pathname+location.search)+'">تسجيل الدخول بالحساب الصحيح</a></div>';return}const r=await fetch("/api/store/catalog");if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){el.textContent="تعذر تحميل المنتج.";return}const d=await r.json();product=(d.products||[]).find(p=>p.id===id);if(!product){el.textContent="المنتج غير موجود أو غير متاح.";return}render()}
function allMedia(){return [...(product.images||[]).map(i=>({kind:"image",url:i.url})),...(Array.isArray(product.videos)?product.videos:[]).map(url=>({kind:"video",url}))]}
function selectMedia(index){const media=allMedia()[index];if(!media)return;const frame=document.querySelector("#mainMedia");if(!frame)return;frame.innerHTML=media.kind==="image"?'<img src="'+esc(media.url)+'" alt="'+esc(product.name)+'">':videoMarkup(media.url);document.querySelectorAll(".thumb").forEach((t,i)=>t.classList.toggle("active",i===index))}
function render(){const media=allMedia(),discount=Number(product.original_price)>Number(product.price),sizes=Array.isArray(product.sizes)?product.sizes:[],colors=Array.isArray(product.colors)?product.colors:[],clothing=product.product_type==="clothing";const main=media.length?(media[0].kind==="image"?'<img src="'+esc(media[0].url)+'" alt="'+esc(product.name)+'">':videoMarkup(media[0].url)):'<div class="empty-media"><b>Together</b><span>'+esc(product.name)+'</span><small>أضف صورة المنتج من الإدارة</small></div>';const thumbs=media.map((m,i)=>'<button type="button" class="thumb '+(!i?"active":"")+'" onclick="selectMedia('+i+')" aria-label="عرض الوسيط '+(i+1)+'">'+(m.kind==="image"?'<img src="'+esc(m.url)+'" alt="">':'<span>▶ فيديو '+(i+1)+'</span>')+'</button>').join("");const pct=discount?Math.round((1-Number(product.price)/Number(product.original_price))*100):0;
el.innerHTML='<div class="detail-grid"><div class="gallery-main"><div id="mainMedia" class="media-frame">'+main+'</div><div class="thumbs">'+thumbs+'</div></div><section><p class="eyebrow">'+esc(product.category_name||"منتج Together")+'</p><h1 class="product-title">'+esc(product.name)+'</h1>'+(product.short_description?'<p class="short-desc">'+esc(product.short_description)+'</p>':'')+'<div class="price-row"><strong class="current-price">'+Number(product.price).toLocaleString("ar-EG",{maximumFractionDigits:2})+' ج.م</strong>'+(discount?'<span class="original-price">'+Number(product.original_price).toLocaleString("ar-EG",{maximumFractionDigits:2})+' ج.م</span><span class="discount-pill">خصم '+pct+'%</span>':'')+'</div><div class="stock-row"><span>المخزون المتاح</span><strong class="'+(Number(product.stock)>0?"stock-good":"stock-low")+'">'+(Number(product.stock)>0?Number(product.stock)+" قطعة متاحة":"غير متوفر حاليًا")+'</strong></div><div id="countdown" class="countdown" '+(!product.countdown_end_at?"hidden":"")+'><div class="countdown-title">ينتهي العرض خلال</div><div class="countdown-digits"><div class="digit"><span id="cdDays">00</span><small>يوم</small></div><div class="digit"><span id="cdHours">00</span><small>ساعة</small></div><div class="digit"><span id="cdMinutes">00</span><small>دقيقة</small></div><div class="digit"><span id="cdSeconds">00</span><small>ثانية</small></div></div></div>'+(clothing&&(sizes.length||colors.length)?'<div class="variant-fields">'+(sizes.length?'<label>اختيار المقاس <select id="sizeChoice"><option value="">اختر المقاس</option>'+sizes.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join("")+'</select></label>':'')+(colors.length?'<label>اختيار اللون <select id="colorChoice"><option value="">اختر اللون</option>'+colors.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("")+'</select></label>':'')+'</div>':'')+'<div class="long-desc">'+esc(product.description||"لا يوجد وصف تفصيلي لهذا المنتج بعد.")+'</div><div class="action-row"><button class="btn primary" onclick="buyNow()" '+(Number(product.stock)>0?"":"disabled")+'>شراء الآن</button><button class="btn" type="button" onclick="createSalesPage()">إنشاء صفحة بيع</button></div><div id="salesLink" class="sales-tools"></div><button class="btn" style="width:100%;margin-top:10px" onclick="addCart()" '+(Number(product.stock)>0?"":"disabled")+'>أضف للسلة</button><div id="checkout" class="checkout" hidden></div><div id="msg" class="message" role="status"></div></section></div>';
if(product.countdown_end_at)startCountdown(product.countdown_end_at);else if(timerHandle)clearInterval(timerHandle)}
function startCountdown(end){if(timerHandle)clearInterval(timerHandle);const finish=new Date(end).getTime();const tick=()=>{const left=finish-Date.now(),box=document.querySelector("#countdown");if(!box)return;if(left<=0){box.innerHTML='<div class="countdown-title">انتهى وقت العرض</div>';clearInterval(timerHandle);return}const vals={cdDays:Math.floor(left/86400000),cdHours:Math.floor(left%86400000/3600000),cdMinutes:Math.floor(left%3600000/60000),cdSeconds:Math.floor(left%60000/1000)};Object.entries(vals).forEach(([id,v])=>{const n=document.getElementById(id);if(n)n.textContent=String(v).padStart(2,"0")})};tick();timerHandle=setInterval(tick,1000)}
function readVariants(){const sizes=Array.isArray(product.sizes)?product.sizes:[],colors=Array.isArray(product.colors)?product.colors:[];chosenSize=document.querySelector("#sizeChoice")?.value||"";chosenColor=document.querySelector("#colorChoice")?.value||"";if(product.product_type==="clothing"&&sizes.length&&!chosenSize){document.querySelector("#msg").textContent="من فضلك اختر المقاس أولًا.";return false}if(product.product_type==="clothing"&&colors.length&&!chosenColor){document.querySelector("#msg").textContent="من فضلك اختر اللون أولًا.";return false}return true}
function addCart(){if(!readVariants())return;let cart={};try{cart=JSON.parse(localStorage.getItem("tn_store_cart")||"{}")}catch{}cart[product.id]=Math.min(Number(product.stock),Number(cart[product.id]||0)+1);localStorage.setItem("tn_store_cart",JSON.stringify(cart));let choices={};try{choices=JSON.parse(localStorage.getItem("tn_store_variant_choices")||"{}")}catch{}choices[product.id]={selected_size:chosenSize,selected_color:chosenColor};localStorage.setItem("tn_store_variant_choices",JSON.stringify(choices));document.querySelector("#msg").textContent="تمت إضافة المنتج إلى السلة مع حفظ المقاس واللون المختارين.";window.setTimeout(()=>location.href="/store/",700)}
function buyNow(){if(!readVariants())return;showShipping()}
function showShipping(){if(!readVariants())return;const box=document.querySelector("#checkout");box.hidden=false;box.innerHTML='<h3>بيانات الشحن</h3><form id="shippingForm" class="checkout-form"><label>الدولة<input name="country" required maxlength="120" autocomplete="country-name"></label><label>المحافظة<input name="governorate" required maxlength="120"></label><label>العنوان<input name="address" required maxlength="500" autocomplete="street-address"></label><label>رقم الهاتف<input name="phone" required maxlength="40" inputmode="tel" autocomplete="tel"></label><button class="btn primary" type="submit">متابعة الشراء</button></form>';box.scrollIntoView({behavior:"smooth",block:"start"});window.setTimeout(()=>document.querySelector("#shippingForm input[name=\"country\"]")?.focus({preventScroll:true}),450);document.querySelector("#shippingForm").onsubmit=e=>{e.preventDefault();shipping=Object.fromEntries(["country","governorate","address","phone"].map(k=>[k,String(new FormData(e.currentTarget).get(k)||"").trim()]));box.innerHTML='<div class="checkout-note">بمجرد قيامك بعملية الشراء يتم خصم قيمة المنتج ولا يحق لك استرداد المبلغ ويصبح لك منتج عند الشركة هنقوم بالتواصل معك لاستلامه</div><label class="consent-box"><input id="purchaseConsent" type="checkbox"><span>أوافق على الشروط الموضحة وأؤكد رغبتي في الشراء.</span></label><button id="confirm" class="btn primary" disabled>تأكيد الشراء</button><button class="btn" style="margin-top:8px" onclick="showShipping()">رجوع لتعديل البيانات</button>';const consent=document.querySelector("#purchaseConsent"),confirm=document.querySelector("#confirm");consent.addEventListener("change",()=>confirm.disabled=!consent.checked);confirm.onclick=submitPurchase}}
async function submitPurchase(){const btn=document.querySelector("#confirm");btn.disabled=true;btn.textContent="جاري تأكيد الشراء…";const r=await fetch("/api/store/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...shipping,items:[{product_id:product.id,quantity:1,selected_size:chosenSize,selected_color:chosenColor}]})});const d=await r.json();if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){btn.disabled=false;btn.textContent="تأكيد الشراء";const messages={insufficient_balance:"رصيدك غير كافٍ لشراء هذا المنتج.",out_of_stock:"المنتج غير متوفر بالكمية المطلوبة.",product_not_found:"المنتج غير موجود.",shipping_details_required:"أكمل بيانات الشحن.",size_required:"اختر مقاس المنتج.",color_required:"اختر لون المنتج.",invalid_size:"المقاس المختار غير متاح.",invalid_color:"اللون المختار غير متاح."};document.querySelector("#msg").textContent=messages[d.error]||"تعذر إتمام الشراء. لم يتم تأكيد الطلب.";return}document.querySelector("#checkout").innerHTML='<div class="card" style="padding:16px"><h3>تم تأكيد الشراء</h3><p>تم خصم '+Number(d.amount).toLocaleString("ar-EG")+' ج.م من رصيدك.</p><p>الرصيد المتبقي: '+Number(d.balance_after).toLocaleString("ar-EG")+' ج.م</p><p>BV لهذا الطلب: '+Number(d.total_bv)+' BV</p><p>المستوى لهذا الطلب: '+(Number(d.purchase_tier)>=3?"ذهبي":Number(d.purchase_tier)>=2?"سيلفر":Number(d.purchase_tier)>=1?"برونزي":"غير مفعل")+'</p><a class="btn primary" href="/marketer/dashboard/">العودة إلى لوحة التحكم</a></div>'}
function createSalesPage(){const owner=new URLSearchParams(location.search).get("sales_owner")||marketerId;if(!owner){document.querySelector("#msg").textContent="تعذر تحديد حساب المسوق الحالي.";return}const link=location.origin+"/store/product/?id="+encodeURIComponent(product.id)+"&sales_owner="+encodeURIComponent(owner);document.querySelector("#salesLink").innerHTML='<div class="sales-link"><input id="salesUrl" readonly value="'+esc(link)+'" aria-label="رابط صفحة البيع"><button class="btn primary" onclick="copySalesLink()">نسخ</button></div><small class="muted">يفتح الرابط لحساب المسوق الذي أنشأ صفحة البيع فقط.</small>'}
async function copySalesLink(){const field=document.querySelector("#salesUrl");try{await navigator.clipboard.writeText(field.value);document.querySelector("#msg").textContent="تم نسخ رابط صفحة البيع."}catch{field.select();document.execCommand("copy");document.querySelector("#msg").textContent="تم نسخ الرابط أو حدده وانسخه يدويًا."}}
init();
</script><script src="/hide-hatchable.js"></script></body></html>
