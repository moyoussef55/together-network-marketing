function clientMime(file){if(file.type&&file.type!=="application/octet-stream")return file.type.split(";")[0].toLowerCase();const ext=String(file.name||"").toLowerCase().match(/\.([a-z0-9]{1,10})$/)?.[1]||"";const types={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",avif:"image/avif",heic:"image/heic",heif:"image/heif",bmp:"image/bmp",tif:"image/tiff",tiff:"image/tiff",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",m4v:"video/x-m4v",avi:"video/x-msvideo",mkv:"video/x-matroska","3gp":"video/3gpp",pdf:"application/pdf",mp3:"audio/mpeg",m4a:"audio/mp4",ogg:"audio/ogg",wav:"audio/wav",aac:"audio/aac",flac:"audio/flac"};return types[ext]||file.type||"application/octet-stream";}

async function load(){const r=await fetch("/api/marketer/support-chat?fresh="+Date.now(),{cache:"no-store",credentials:"same-origin"});const d=await r.json();if(!r.ok){if(r.status===401){location.href="/login?next=/marketer/support/";return}throw Error(d.error||"تعذر تحميل المحادثة")}messages=d.messages||[];render();$("#status").textContent="الدعم متاح لاستقبال رسالتك والرد عليها."}
