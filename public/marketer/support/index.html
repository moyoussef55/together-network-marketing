<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتصل بالدعم | Together Network</title><link rel="stylesheet" href="/theme.css"><style>
.wrap{max-width:900px;margin:auto}.chat{height:min(62vh,620px);min-height:320px;overflow:auto;background:#f4f6fa;border:1px solid #dbe2eb;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:12px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;color:#17202b;background:#fff;border:1px solid #dbe2eb;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#dceeff;border-color:#a9d5ff}.bubble time{display:block;font-size:11px;color:#667085;margin-top:6px}.compose{display:flex;gap:8px;margin-top:12px;align-items:stretch}.compose textarea{flex:1;min-width:0;resize:vertical;border:1px solid #ccd5e0;border-radius:12px;padding:12px;font:inherit}.compose button,.attachBtn{border:0;border-radius:12px;padding:10px 16px;background:#1268d3;color:#fff;font-weight:800;cursor:pointer}.attachBtn{background:#475569;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.hint{color:#667085;font-size:13px}.pending{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pending span{background:#eef2f7;padding:7px 10px;border-radius:9px;font-size:12px}.media{display:block;max-width:min(100%,360px);max-height:300px;border-radius:10px;margin-top:8px}.filelink{display:inline-block;margin-top:8px;color:#075db3;text-decoration:underline;font-weight:700}.attachment{display:block;margin-top:7px}@media(max-width:560px){.compose{flex-wrap:wrap}.compose textarea{flex-basis:100%}.compose button,.attachBtn{flex:1}.bubble{max-width:94%}}
</style></head><body class="app-shell"><main class="main-content"><section class="wrap"><header class="page-head"><div><p class="eyebrow">Together Network</p><h1>اتصل بالدعم</h1><p class="hint">اكتب رسالتك أو أرفق صورة أو فيديو أو ملف PDF. الحد الأقصى 5 مرفقات، 15 ميجابايت لكل ملف.</p></div></header><div id="status" class="hint">جارٍ تحميل المحادثة…</div><div id="chat" class="chat" aria-live="polite"></div><div id="pending" class="pending"></div><form id="form" class="compose"><textarea id="message" rows="2" maxlength="4000" placeholder="اكتب رسالتك هنا…"></textarea><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf" multiple hidden><button class="attachBtn" id="pick" type="button">📎 إضافة مرفقات</button><button id="send" type="submit">إرسال الرسالة</button></form></section></main><script src="/marketer-sidebar.js?v=399"></script><script>
const $=s=>document.querySelector(s);let messages=[],pending=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function attachmentHtml(a){const url=esc(a.url||"#"),name=esc(a.name||"مرفق"),type=String(a.type||"");if(type.startsWith("image/"))return '<a class="attachment" href="'+url+'" target="_blank" rel="noopener"><img class="media" src="'+url+'" alt="'+name+'"></a>';if(type.startsWith("video/"))return '<video class="media" controls preload="metadata" src="'+url+'"></video>';return '<a class="filelink" href="'+url+'" target="_blank" rel="noopener">📄 '+name+' — فتح / تحميل PDF</a>'}
function render(){const el=$("#chat");el.innerHTML=messages.length?messages.map(m=>'<div class="bubble '+(m.sender_role==="marketer"?"mine":"")+'">'+(m.message?esc(m.message):"")+(Array.isArray(m.attachments)?m.attachments.map(attachmentHtml).join(""):"")+'<time>'+esc(new Date(m.created_at).toLocaleString("ar-EG"))+(m.sender_role==="admin"?" · الدعم":" · أنت")+'</time></div>').join(""):'<p class="hint">ابدأ المحادثة بإرسال رسالتك الأولى.</p>';el.scrollTop=el.scrollHeight}
function renderPending(){$("#pending").innerHTML=pending.map((a,i)=>'<span>'+esc(a.name)+' <button type="button" data-remove="'+i+'" aria-label="حذف المرفق">×</button></span>').join("");document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{pending.splice(Number(b.dataset.remove),1);renderPending()})}
function toBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]||"");r.onerror=reject;r.readAsDataURL(file)})}
async function upload(file){if(file.size>15*1024*1024)throw Error("حجم الملف أكبر من 15 ميجابايت: "+file.name);const data_base64=await toBase64(file);const r=await fetch("/api/marketer/support-media",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({content_type:file.type,name:file.name,data_base64})});const d=await r.json();if(!r.ok)throw Error(d.error==="unsupported_media_type"?"نوع الملف غير مدعوم":d.error==="file_too_large"?"حجم الملف أكبر من المسموح":d.error||"تعذر رفع المرفق");return d.attachment}
$("#pick").onclick=()=>$("#files").click();
$("#files").onchange=async()=>{const files=Array.from($("#files").files||[]);$("#files").value="";if(pending.length+files.length>5){$("#status").textContent="يمكن إضافة 5 مرفقات كحد أقصى للرسالة الواحدة.";return}$("#pick").disabled=true;try{for(const f of files){if(!["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm","video/quicktime","application/pdf"].includes(f.type))throw Error("نوع الملف غير مدعوم: "+f.name);$("#status").textContent="جارٍ رفع "+f.name+"…";pending.push(await upload(f));renderPending()}$("#status").textContent="المرفقات جاهزة للإرسال."}catch(e){$("#status").textContent=e.message}finally{$("#pick").disabled=false}};
async function load(){const r=await fetch("/api/marketer/support-chat?fresh="+Date.now(),{cache:"no-store",credentials:"same-origin"});const d=await r.json();if(!r.ok){if(r.status===401){location.href="/login?next=/marketer/support/";return}throw Error(d.error||"تعذر تحميل المحادثة")}messages=d.messages||[];render();$("#status").textContent="الدعم متاح لاستقبال رسالتك والرد عليها."}
$("#form").onsubmit=async e=>{e.preventDefault();const msg=$("#message").value.trim();if(!msg&&!pending.length)return;$("#send").disabled=true;$("#pick").disabled=true;try{const r=await fetch("/api/marketer/support-chat",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({message:msg,attachments:pending})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر إرسال الرسالة");messages.push(d.message);$("#message").value="";pending=[];renderPending();render();$("#status").textContent="تم إرسال رسالتك ومرفقاتها."}catch(err){$("#status").textContent=err.message}finally{$("#send").disabled=false;$("#pick").disabled=false}};
load().catch(e=>$("#status").textContent=e.message);setInterval(()=>load().catch(()=>{}),8000);
</script><script src="/hide-hatchable.js"></script><script src="/theme-toggle.js?v=399"></script></body></html>
