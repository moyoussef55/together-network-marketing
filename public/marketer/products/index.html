<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتجاتي — Together</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script>
<style>.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.orders{display:grid;gap:14px;margin-top:18px}.order-card{border:1px solid #ffffff18;border-radius:14px;padding:16px;background:#ffffff05}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#173e35;color:#8ef0c4;font-weight:700;font-size:13px}.items{display:grid;gap:8px;margin-top:14px}.item{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #ffffff12;padding-top:9px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:#aab8cb;font-size:13px;margin-top:10px}.empty{padding:28px;text-align:center}.btnrow{display:flex;gap:8px;flex-wrap:wrap}</style></head><body class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">T</div><div><strong>Together</strong><span>Digital Marketing</span></div></div><nav class="side-nav"><a href="/marketer/dashboard/">لوحة التحكم</a><a href="/marketer/my-network/">شبكتي</a><a href="/store/">المتجر</a><a class="active" href="/marketer/products/">منتجاتي</a><a href="/marketer/profile/">البروفايل</a><a href="/marketer/wallet/">المحفظة</a><a href="/marketer/withdraw/">طلب السحب</a><a href="/marketer/reports/">التقارير</a></nav></aside><main class="main-content"><header class="mobile-head"><button class="menu-btn" id="menuBtn">☰</button><span>القائمة</span></header><section class="shell wrap"><header class="head"><div><p class="eyebrow">حساب المسوق</p><h1>منتجاتي</h1><p class="muted">تابع طلباتك وحالة تجهيزها وشحنها من هنا.</p></div><div class="btnrow"><a class="btn primary" href="/store/">تصفح المنتجات</a><button class="btn" onclick="loadOrders()">تحديث الحالة</button></div></header><div id="summary" class="muted" style="margin-top:14px">جاري تحميل الطلبات…</div><section id="orders" class="orders"><div class="card empty">جاري تحميل طلباتك…</div></section></section></main><script>
const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function statusText(s){return s==="pending"||!s?"جارى معالجة الطلب":s}function dateText(s){return s?new Date(s).toLocaleString("ar-EG"):"—"}
async function loadOrders(){const r=await fetch("/api/store/order",{credentials:"same-origin"});if(r.status===401){location.href="/login?next=/marketer/products/";return}const d=await r.json();if(!r.ok){$("#orders").innerHTML='<div class="card empty">تعذر تحميل طلباتك حاليًا.</div>';return}const orders=d.orders||[];$("#summary").textContent="عدد الطلبات: "+orders.length+" • رصيد المحفظة الحالي: "+Number(d.wallet_balance||0).toFixed(2)+" ج.م";$("#orders").innerHTML=orders.map(o=>'<article class="order-card"><div class="order-head"><div><strong>طلب #'+esc(String(o.id).slice(0,8))+'</strong><div class="meta"><span>تاريخ الطلب: '+esc(dateText(o.created_at))+'</span><span>الإجمالي: '+Number(o.total||0).toFixed(2)+' ج.م</span></div></div><span class="status">'+esc(statusText(o.status))+'</span></div><div class="items">'+(o.items||[]).map(i=>'<div class="item"><span>'+esc(i.name||"منتج")+' × '+Number(i.quantity||0)+'</span><strong>'+ (Number(i.unit_price||0)*Number(i.quantity||0)).toFixed(2)+' ج.م</strong></div>').join("")+'</div><div class="meta"><span>الدولة: '+esc(o.shipping_country||"—")+'</span><span>المحافظة: '+esc(o.shipping_governorate||"—")+'</span><span>رقم الاستلام: '+esc(o.shipping_phone||"—")+'</span></div></article>').join("")||'<div class="card empty">لم تطلب أي منتجات حتى الآن. <p><a class="btn primary" href="/store/">تصفح المنتجات</a></p></div>'}
$("#menuBtn").onclick=()=>document.querySelector(".sidebar").classList.toggle("open");loadOrders();
</script><script src="/hide-hatchable.js"></script><script src="/marketer-sidebar.js?v=565"></script><script src="/theme-toggle.js?v=600"></script></body></html>
