<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة وكيل</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script></head>
<body><main class="page-shell"><div class="card">
<h1 data-ar="إضافة وكيل" data-en="Add Agent">إضافة وكيل</h1>
<p class="muted" data-ar="ضع الوكيل داخل أحد التوكيلات الثلاثة وحدد الجهة." data-en="Place an agent inside one of your three accounts and choose the side.">ضع الوكيل داخل أحد التوكيلات الثلاثة وحدد الجهة.</p>
<div class="form-grid">
<label>معرّف الوكيل<input id="member" placeholder="User ID"></label>
<label>التوكيل<select id="pos"><option value="1">التوكيل الأول</option><option value="2">التوكيل الثاني</option><option value="3">التوكيل الثالث</option></select></label>
<label>الجهة<select id="side"><option value="right">يمين</option><option value="left">يسار</option></select></label>
<label>الأب المباشر (اختياري)<input id="parent" placeholder="User ID"></label>
</div>
<button id="add">إضافة الوكيل</button><div id="msg" class="muted"></div>
<h2>الوكلاء الموضوعون</h2><div id="list"></div></div></main>
<script>
const $=id=>document.getElementById(id);
async function load(){const r=await fetch('/api/network/agent');const d=await r.json();$('list').innerHTML=(d.placements||[]).map(x=>'<div class="card"><b>التوكيل '+x.account_position+'</b> — '+(x.side==='left'?'يسار':'يمين')+' — '+(x.member_name||x.member_id)+'</div>').join('')||'<p class="muted">لا يوجد وكلاء موضوعون بعد.</p>'}
$('add').onclick=async()=>{const body={member_id:$('member').value.trim(),account_position:Number($('pos').value),side:$('side').value,parent_member_id:$('parent').value.trim()||null};const r=await fetch('/api/network/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();$('msg').textContent=d.ok?'تمت إضافة الوكيل بنجاح.':(d.error||'تعذر إضافة الوكيل');if(d.ok){$('member').value='';load()}};load();
</script><script src="/hide-hatchable.js"></script><!-- dashboard return button styles removed --><!-- dashboard return button removed --><style>.tn-nav-toggle{position:fixed;top:16px;right:16px;z-index:12002;width:66px;height:66px;border:1px solid #ffffff55;border-radius:18px;background:#000;color:#fff;font-size:34px;font-weight:900;box-shadow:0 8px 24px #0008;cursor:pointer}.tn-nav-shade{position:fixed;inset:0;background:#000a;z-index:12000;display:none}.tn-nav-shade.open{display:block}.tn-nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(310px,86vw);padding:78px 18px 24px;background:#101a28;border-left:1px solid #ffffff22;z-index:12001;transform:translateX(105%);transition:transform .22s ease;overflow:auto;box-shadow:-12px 0 36px #0007}.tn-nav-drawer.open{transform:translateX(0)}.tn-nav-drawer a{display:block;padding:13px 14px;margin:5px 0;border-radius:11px;color:#fff;text-decoration:none;font:700 16px Arial,sans-serif}.tn-nav-drawer a:hover,.tn-nav-drawer a:focus{background:#1683ff2b;outline:none}.tn-nav-drawer .tn-nav-home{background:#1683ff}</style><button type="button" class="tn-nav-toggle" id="tnNavToggle" aria-label="فتح القائمة الجانبية" aria-expanded="false">☰</button><div class="tn-nav-shade" id="tnNavShade"></div><nav class="tn-nav-drawer" id="tnNavDrawer" aria-label="القائمة الجانبية للمسوق"><a class="tn-nav-home" href="/marketer/dashboard/">لوحة التحكم</a><a href="/marketer/my-network/">شبكتي</a><a href="/store/">المتجر</a><a href="/marketer/agent/">إضافة وكيل</a><a href="/marketer/profile/">البروفايل</a><a href="/marketer/wallet/">المحفظة</a><a href="/marketer/withdraw/">طلب السحب</a><a href="/marketer/reports/">التقارير</a>

<a href="/marketer/team-checks/">شيكات فريقك</a></nav><script>(()=>{const b=document.getElementById("tnNavToggle"),s=document.getElementById("tnNavShade"),d=document.getElementById("tnNavDrawer");if(!b||!s||!d)return;function close(){s.classList.remove("open");d.classList.remove("open");b.setAttribute("aria-expanded","false")}b.addEventListener("click",()=>{const open=!d.classList.contains("open");d.classList.toggle("open",open);s.classList.toggle("open",open);b.setAttribute("aria-expanded",String(open))});s.addEventListener("click",close);document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});d.querySelectorAll("a").forEach(a=>a.addEventListener("click",close))})();</script><script src="/marketer-sidebar.js?v=399"></script><script src="/theme-toggle.js?v=452"></script></body></html>
