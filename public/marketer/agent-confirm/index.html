<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد IBN</title><link rel="stylesheet" href="/theme.css"><script src="/network-session.js"></script></head><body class="app-shell"><main class="main-content"><div class="card"><p class="eyebrow">المرحلة الثانية</p><h1>رقم التأكيد IBN</h1><p class="muted">أدخل رقم الـ IBN الذي تم إصداره لك من الإدارة.</p><input id="code" placeholder="IBN" autocomplete="off" aria-label="رقم IBN"><button class="btn" id="reveal" type="button" style="margin-top:12px">إظهار قيمة IBN</button><div id="amount" class="metric" style="margin-top:18px;display:none">—</div><button class="btn" id="confirm" type="button" disabled hidden style="margin-top:14px">إنشاء الحساب</button><div id="msg" class="muted" role="status" aria-live="polite"></div></div></main><script>const params=new URLSearchParams(location.search),id=params.get('id'),adminMode=params.get('admin')==='1',code=document.getElementById('code'),reveal=document.getElementById('reveal'),confirmBtn=document.getElementById('confirm'),amount=document.getElementById('amount'),msg=document.getElementById('msg'),endpoint=adminMode?'/api/admin/confirm-agent':'/api/network/confirm-agent';function resetReveal(){amount.style.display='none';amount.textContent='—';confirmBtn.hidden=true;confirmBtn.disabled=true;msg.textContent=''}code.addEventListener('input',resetReveal);reveal.onclick=async()=>{const value=code.value.trim();if(!value){msg.textContent='أدخل رقم IBN أولًا';code.focus();return}reveal.disabled=true;confirmBtn.hidden=true;confirmBtn.disabled=true;msg.textContent='جارٍ التحقق من IBN...';try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({application_id:id,ibn_code:value,action:'preview'})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error==='invalid_or_expired_ibn'?'رقم IBN غير صحيح أو منتهي':d.error||'تعذر التحقق من IBN');amount.textContent=Number(d.ibn_amount).toLocaleString('ar-EG')+' جنيه مصري';amount.style.display='block';confirmBtn.hidden=false;confirmBtn.disabled=false;msg.textContent='تم التحقق من الكود وإظهار قيمته. يمكنك الآن إنشاء الحساب.'}catch(e){resetReveal();msg.textContent=e.message||'تعذر التحقق من IBN'}finally{reveal.disabled=false}};confirmBtn.onclick=async()=>{const value=code.value.trim();if(!value||amount.style.display==='none'||confirmBtn.disabled)return;confirmBtn.disabled=true;reveal.disabled=true;msg.textContent='جارٍ إنشاء الحساب...';try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({application_id:id,ibn_code:value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error==='invalid_or_expired_ibn'?'رقم IBN غير صحيح أو منتهي':d.error||'تعذر إنشاء الحساب');location.href='/marketer/agent-welcome/?id='+encodeURIComponent(d.member_id)+'&mail='+(d.welcome_email_sent?'sent':'failed')}catch(e){msg.textContent=e.message||'تعذر إنشاء الحساب';confirmBtn.disabled=false;reveal.disabled=false}};</script><script src="/hide-hatchable.js"></script><!-- dashboard return button styles removed --><!-- dashboard return button removed --><style>.tn-nav-toggle{position:fixed;top:16px;right:16px;z-index:12002;width:66px;height:66px;border:1px solid #ffffff55;border-radius:18px;background:#000;color:#fff;font-size:34px;font-weight:900;box-shadow:0 8px 24px #0008;cursor:pointer}.tn-nav-shade{position:fixed;inset:0;background:#000a;z-index:12000;display:none}.tn-nav-shade.open{display:block}.tn-nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(310px,86vw);padding:78px 18px 24px;background:#101a28;border-left:1px solid #ffffff22;z-index:12001;transform:translateX(105%);transition:transform .22s ease;overflow:auto;box-shadow:-12px 0 36px #0007}.tn-nav-drawer.open{transform:translateX(0)}.tn-nav-drawer a{display:block;padding:13px 14px;margin:5px 0;border-radius:11px;color:#fff;text-decoration:none;font:700 16px
