</style></head><body class="app-shell"><main class="main-content"><div class="feed-wrap"><header class="hero"><p class="muted">TOGETHER • TEAM SPOTLIGHT</p><h1>🏆 التكريمات</h1><p class="muted">نحتفل بإنجازات فريق توجيذر. شاهد التكريمات، تفاعل معها، وشارك التهاني والتعليقات.</p><div class="toolbar"><a href="/marketer/dashboard/">لوحة التحكم</a><a href="/marketer/recognitions/notifications/">🔔 الإشعارات <b id="unread">0</b></a></div></header><div id="status" class="status">جارٍ تحميل التكريمات…</div><section id="compose" class="compose" hidden><h3>نشر منشور (صلاحية خاصة)</h3><textarea id="newDescription" maxlength="5000" placeholder="شارك إنجازك مع الفريق..."></textarea><input id="newMedia" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"><div id="newPreview"></div><button id="publish">نشر المنشور</button></section><div id="feed"></div></div></main><script src="/marketer-sidebar.js?v=621"></script><script>
const $=s=>document.querySelector(s);let data={posts:[],comments:[]},replyTo=null,canComment=true,adminMode=false;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(s){$("#status").textContent=s}
function recognitionModerationActions(id){const m=(data.marketers||[]).find(x=>String(x.id)===String(id));if(!m)return '<span class="muted small">الحساب غير متاح للإدارة</span>';const blocked=Boolean(m.login_blocked)||String(m.status||"").toLowerCase()==="blocked",hidden=Boolean(m.posts_hidden);return (blocked?'<button data-admin-unblock-user="'+esc(id)+'">إلغاء الحظر</button>':'<button data-admin-block-user="'+esc(id)+'">حظر المستخدم</button>')+(hidden?'<button data-admin-show-user="'+esc(id)+'">إظهار التكريمات للمستخدم</button>':'<button data-admin-hide-user="'+esc(id)+'">إخفاء التكريمات لهذا المستخدم</button>')}
async function api(action,extra={}){const endpoint=adminMode?"/api/admin/recognitions":"/api/marketer/recognitions";const r=await fetch(endpoint,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تنفيذ العملية");return d}
function media(p){return !p.media_url?"":String(p.media_type||"").startsWith("video/")?'<video controls preload="metadata" playsinline src="'+esc(p.media_url)+'"></video>':'<img loading="lazy" src="'+esc(p.media_url)+'" alt="تكريم من فريق توجيذر">'}
function renderComments(postId){return data.comments.filter(c=>c.post_id===postId).map(c=>'<div class="comment '+(c.parent_comment_id?'reply':'')+'"><div class="avatar">'+esc((c.marketer_name||"م").trim().slice(0,1))+'</div><div class="bubble"><div class="comment-name">'+esc(c.marketer_name||"مسوق")+(adminMode?'<button class="admin-more" style="float:left" data-admin-menu="'+c.id+'" aria-label="خيارات التعليق">⋮</button>':'')+'</div><div class="comment-body">'+esc(c.body)+'</div><div class="comment-tools"><button data-reply="'+c.id+'">↩ رد</button><button class="'+(c.my_reaction==='like'?'active':'')+'" data-comment-react="like" data-id="'+c.id+'">👍 '+(c.likes||0)+'</button><button class="'+(c.my_reaction==='love'?'active':'')+'" data-comment-react="love" data-id="'+c.id+'">❤️ '+(c.loves||0)+'</button></div>'+(adminMode?'<div class="admin-menu" id="admin-menu-'+c.id+'" hidden><button class="danger" data-admin-delete-comment="'+c.id+'">حذف '+(c.parent_comment_id?'الرد':'التعليق')+'</button>'+recognitionModerationActions(c.marketer_id)+'</div>':'')+'</div></div>').join("")}
function render(){if(data.posts_hidden){$("#feed").innerHTML='<div class="empty">قسم التكريمات غير متاح لهذا الحساب حاليًا. يرجى التواصل مع الإدارة.</div>';return}$("#feed").innerHTML=data.posts.length?data.posts.map(p=>'<article class="post" id="post-'+p.id+'"><div class="post-head"><div class="seal">🏆</div><div><h3>تكريم من إدارة توجيذر</h3><small>'+new Date(p.created_at).toLocaleString("ar-EG")+'</small></div></div>'+(adminMode?'<div class="admin-post-tools" style="position:relative"><button class="admin-more" data-admin-menu="'+p.id+'" aria-label="خيارات المنشور">⋮</button><div class="admin-menu" id="admin-menu-'+p.id+'" hidden><button data-admin-edit-post="'+p.id+'">تعديل المنشور</button><button class="danger" data-admin-delete-post="'+p.id+'">حذف المنشور</button></div></div>':'')+'<div class="desc">'+esc(p.description)+'</div>'+media(p)+'<div class="reactions"><button class="react '+(p.my_reaction==='like'?'active':'')+'" data-post-react="like" data-id="'+p.id+'">👍 أعجبني <b>'+p.likes+'</b></button><button class="react love '+(p.my_reaction==='love'?'active':'')+'" data-post-react="love" data-id="'+p.id+'">❤️ أحببته <b>'+p.loves+'</b></button><span class="muted" style="align-self:center">💬 '+p.comment_count+' تعليق</span></div><div class="comments">'+renderComments(p.id)+'<form class="composer" data-form-post="'+p.id+'"><input name="body" maxlength="2000" placeholder="'+(replyTo?'اكتب ردك...':'اكتب تعليقًا أو تهنئة...')+'" '+(canComment?'':'disabled')+' required><button '+(canComment?'':'disabled')+'>إرسال</button></form><div class="muted" style="font-size:12px;margin-top:6px" id="reply-'+p.id+'">'+(replyTo?'جارٍ الرد على تعليق محدد — اضغط إلغاء الرد من زر الرد مرة أخرى.':'')+'</div></div></article>').join(""):'<div class="empty"><div style="font-size:42px">🏆</div><h3>التكريمات قادمة قريبًا</h3><p>لم تنشر الإدارة أي تكريمات حتى الآن. ستظهر المنشورات هنا فور نشرها.</p></div>'}
async function loadAdminPreview(){const requested=new URLSearchParams(location.search).get("admin_preview")==="1";if(!requested)return false;try{const r=await fetch("/api/admin/recognitions?preview="+Date.now(),{cache:"no-store",credentials:"include"});if(!r.ok){if(requested){$("#compose").hidden=true;$("#feed").innerHTML="";say(r.status===401?"معاينة الإدارة تتطلب تسجيل دخول المدير. افتح لوحة الإدارة أولًا ثم اضغط «معاينة قسم المسوقين».":"تعذر تحميل معاينة الإدارة (HTTP "+r.status+").");return true}return false}const d=await r.json();if(!d.ok||!Array.isArray(d.posts)||!Array.isArray(d.comments)){if(requested){$("#compose").hidden=true;$("#feed").innerHTML="";say("تعذر تحميل بيانات معاينة الإدارة.");return true}return false}adminMode=true;data={...d,posts_hidden:false,can_post:false,comments_blocked:false};canComment=false;$("#compose").hidden=true;$("#unread").textContent="—";render();say("معاينة الإدارة: خيارات ⋮ لإدارة المنشورات والتعليقات والردود متاحة للمدير فقط.");return true}catch{if(requested){$("#compose").hidden=true;$("#feed").innerHTML="";say("تعذر الاتصال بمعاينة الإدارة. افتح لوحة الإدارة وسجّل الدخول ثم أعد المحاولة.");return true}return false}}
async function load(){if(await loadAdminPreview())return;say("جارٍ الاتصال وتحميل التكريمات…");const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);let r,d;try{r=await fetch("/api/marketer/recognitions?fresh="+Date.now(),{cache:"no-store",credentials:"include",signal:controller.signal});d=await r.json()}catch(err){throw Error(err.name==="AbortError"?"انتهت مهلة تحميل التكريمات. اضغط إعادة المحاولة.":"تعذر الاتصال بخدمة التكريمات. تحقق من الإنترنت ثم أعد المحاولة.")}finally{clearTimeout(timer)}if(r.status===401){location.href="/login?next=/marketer/recognitions/";return}if(!r.ok)throw Error(d.error||"تعذر تحميل التكريمات");if(!Array.isArray(d.posts)||!Array.isArray(d.comments))throw Error("وصل رد غير مكتمل من خدمة التكريمات. أعد المحاولة.");data=d;canComment=!d.comments_blocked;$("#compose").hidden=!d.can_post;$("#unread").textContent=d.unread_notifications||0;render();if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:"smooth",block:"start"}),150);say(d.comments_blocked?"تم تقييد التعليق على هذا الحساب.":"التفاعلات والتعليقات متاحة لجميع المسوقين.");
}
$("#feed").onclick=async e=>{const postEdit=e.target.closest("[data-admin-edit-post]"),postDelete=e.target.closest("[data-admin-delete-post]"),menu=e.target.closest("[data-admin-menu]"),commentDelete=e.target.closest("[data-admin-delete-comment]"),blockUser=e.target.closest("[data-admin-block-user]"),hideUser=e.target.closest("[data-admin-hide-user]"),unblockUser=e.target.closest("[data-admin-unblock-user]"),showUser=e.target.closest("[data-admin-show-user]");const post=e.target.closest("[data-post-react]"),cr=e.target.closest("[data-comment-react]"),rp=e.target.closest("[data-reply]");try{if(adminMode&&postEdit){const p=data.posts.find(x=>x.id===postEdit.dataset.adminEditPost);const description=prompt("تعديل نص منشور التكريم:",p?.description||"");if(description===null)return;if(!description.trim())throw Error("لا يمكن حفظ منشور فارغ");await api("edit_post",{post_id:postEdit.dataset.adminEditPost,description:description.trim()});await load();say("تم تعديل منشور التكريم")}else if(adminMode&&postDelete){if(!confirm("هل تريد حذف منشور التكريم وكل التعليقات والتفاعلات المرتبطة به؟"))return;await api("delete_post",{post_id:postDelete.dataset.adminDeletePost});await load();say("تم حذف منشور التكريم")}else if(adminMode&&menu){const box=$("#admin-menu-"+menu.dataset.adminMenu);if(box)box.hidden=!box.hidden}else if(adminMode&&commentDelete){if(!confirm("هل تريد حذف هذا التعليق أو الرد؟"))return;await api("delete_comment",{comment_id:commentDelete.dataset.adminDeleteComment});await load();say("تم حذف التعليق أو الرد")}else if(adminMode&&blockUser){if(!confirm("سيتم حظر هذا المسوق وتعطيل تسجيل دخوله إلى المنصة. هل تريد المتابعة؟"))return;await api("block_marketer",{marketer_id:blockUser.dataset.adminBlockUser});await load();say("تم حظر المستخدم")}else if(adminMode&&hideUser){if(!confirm("سيتم إخفاء قسم التكريمات عن هذا المسوق فقط. هل تريد المتابعة؟"))return;await api("control_marketer",{marketer_id:hideUser.dataset.adminHideUser,field:"posts_hidden",value:true});await load();say("تم إخفاء قسم التكريمات عن المستخدم المحدد")}else if(adminMode&&unblockUser){if(!confirm("سيتم إلغاء الحظر عن هذا المستخدم. هل تريد المتابعة؟"))return;await api("unblock_marketer",{marketer_id:unblockUser.dataset.adminUnblockUser});await load();say("تم إلغاء حظر المستخدم")}else if(adminMode&&showUser){if(!confirm("سيظهر قسم التكريمات مجددًا لهذا المستخدم فقط. هل تريد المتابعة؟"))return;await api("control_marketer",{marketer_id:showUser.dataset.adminShowUser,field:"posts_hidden",value:false});await load();say("تم إظهار التكريمات للمستخدم")}else if(post){await api("react_post",{post_id:post.dataset.id,reaction:post.dataset.postReact});await load()}else if(cr){await api("react_comment",{comment_id:cr.dataset.id,reaction:cr.dataset.commentReact});await load()}else if(rp){const id=rp.dataset.reply;if(replyTo===id){replyTo=null;document.querySelectorAll('[id^="reply-"]').forEach(x=>x.textContent="")}else{replyTo=id;const c=data.comments.find(x=>x.id===id);const wrap=$("#reply-"+c.post_id);if(wrap)wrap.innerHTML='الرد على '+esc(c.marketer_name)+' <button type="button" data-cancel-reply style="background:none;border:0;color:#7cc4ff;cursor:pointer">إلغاء الرد</button>';const input=$("#post-"+c.post_id+' input[name="body"]');if(input)input.focus()}}else if(e.target.closest("[data-cancel-reply]")){replyTo=null;render()}}catch(err){say(err.message)}};
$("#feed").onsubmit=async e=>{const f=e.target.closest("form[data-form-post]");if(!f)return;e.preventDefault();if(!canComment){say("التعليق غير متاح لهذا الحساب.");return}const input=f.elements.body,body=input.value.trim();if(!body)return;try{await api("comment",{post_id:f.dataset.formPost,parent_comment_id:replyTo,body});replyTo=null;await load()}catch(err){say(err.message)}};
