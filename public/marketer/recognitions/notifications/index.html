<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إشعارات التكريمات | Together</title><link rel="stylesheet" href="/theme.css?v=620"><style>.wrap{max-width:820px;margin:auto}.hero,.panel{background:#111e2e;border:1px solid #ffffff20;border-radius:18px;padding:20px;margin:15px 0}.muted{color:#aab8c9}.item{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #ffffff14;text-decoration:none;color:inherit}.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1c3b5b;font-size:20px;flex-shrink:0}.message{line-height:1.7}.date{font-size:12px;color:#9caec1;margin-top:4px}.item.unread .message{font-weight:800;color:#fff}.btn{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;background:#173b5d;color:white}.empty{padding:28px;text-align:center;color:#aab8c9}</style></head><body class="app-shell"><main class="main-content"><div class="wrap"><header class="hero"><p class="muted">TOGETHER • NOTIFICATIONS</p><h1>🔔 إشعارات التكريمات</h1><p class="muted">الردود على تعليقاتك والتفاعلات التي تصل إليها.</p><a class="btn" href="/marketer/recognitions/">العودة إلى التكريمات</a></header><section class="panel"><div id="status" class="muted">جارٍ تحميل الإشعارات…</div><div id="list"></div></section></div></main><script src="/marketer-sidebar.js?v=620"></script><script>const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function load(){const r=await fetch("/api/marketer/recognitions?view=notifications&fresh="+Date.now(),{cache:"no-store",credentials:"include"});if(r.status===401){location.href="/login?next=/marketer/recognitions/notifications/";return}const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل الإشعارات");$("#status").textContent=d.notifications.length+" إشعار";$("#list").innerHTML=d.notifications.length?d.notifications.map(n=>'<a class="item '+(!n.read_at?'unread':'')+'" href="/marketer/recognitions/'+(n.post_id?'#post-'+encodeURIComponent(n.post_id):'')+'"><div class="ico">'+(n.event_type==="mention"?'👤':n.event_type==="new_post"?'🎉':n.event_type==="reply"?'↩':n.event_type==="comment_love"?'❤️':n.event_type==="comment_like"?'👍':'💬')+'</div><div><div class="message">'+esc(n.message)+'</div><div class="date">'+new Date(n.created_at).toLocaleString("ar-EG")+'</div></div></a>').join(""):'<div class="empty">لا توجد إشعارات حتى الآن. ستظهر هنا الردود والإعجابات والقلوب على تعليقاتك.</div>'}load().catch(e=>$("#status").textContent=e.message);</script><script src="/hide-hatchable.js"></script><script src="/theme-toggle.js?v=620"></script></body></html>
