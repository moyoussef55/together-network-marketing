<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأحداث والمؤتمرات | Together Network</title><link rel="stylesheet" href="/theme.css"><style>
.wrap{max-width:1100px;margin:auto}.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.event{border:1px solid #ffffff20;border-radius:18px;overflow:hidden;background:#101722;box-shadow:0 8px 26px #0002}.event img,.event video{width:100%;height:240px;object-fit:cover;display:block;background:#080d14}.event-body{padding:16px}.desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:#f1f5f9;font-size:16px}.date{color:#a8b4c4;font-size:12px;margin-top:12px}.empty{padding:28px;text-align:center;border:1px dashed #ffffff30;border-radius:16px;color:#a8b4c4}.muted{color:#a8b4c4}
</style></head><body class="app-shell"><main class="main-content"><header class="page-head"><div><p class="eyebrow">Together Network</p><h1>الأحداث والمؤتمرات</h1><p class="muted">تابع أحدث فعاليات ومؤتمرات توجيذر من الصور والفيديوهات وتفاصيل كل حدث.</p></div><button class="btn" id="shareEvents" type="button">نسخ رابط الأحداث للزوار</button></header><section class="wrap"><div id="status" class="muted">جارٍ تحميل الأحداث…</div><div id="events" class="events"></div></section></main><script src="/marketer-sidebar.js?v=399"></script><script>
const $=s=>document.querySelector(s);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mediaMarkup(e){return (e.media_items||[{media_url:e.media_url,media_type:e.media_type}]).map(m=>{const url=esc(m.media_url||"");return String(m.media_type||"").startsWith("video/")?'<video controls preload="metadata" playsinline src="'+url+'"></video>':'<img loading="lazy" src="'+url+'" alt="صورة الحدث">'}).join("")}
async function load(){const r=await fetch("/api/marketer/events?fresh="+Date.now(),{cache:"no-store"});if(r.status===401){location.href="/login?next=/marketer/events/";return}const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر تحميل الأحداث");const list=d.events||[];$("#status").textContent=list.length?"عدد الأحداث المنشورة: "+list.length:"";$("#events").innerHTML=list.length?list.map(e=>'<article class="event">'+mediaMarkup(e)+'<div class="event-body"><h2>'+esc(e.title||"حدث Together")+(e.event_type==="upcoming"?" — حدث قادم":" — حدث سابق")+'</h2>'+(e.event_type==="upcoming"&&e.event_date?'<div class="date">موعد الحدث: '+esc(new Date(e.event_date).toLocaleString("ar-EG"))+'</div>':"")+'<div class="desc">'+esc(e.description)+'</div><div class="date">تاريخ النشر: '+esc(new Date(e.created_at).toLocaleString("ar-EG"))+'</div></div></article>').join(""):'<div class="empty">لا توجد أحداث أو مؤتمرات منشورة حاليًا. تابع الصفحة للاطلاع على الفعاليات الجديدة.</div>'}
load().catch(e=>$("#status").textContent=e.message);$("#shareEvents").onclick=async()=>{const url=location.origin+"/events/";try{await navigator.clipboard.writeText(url);$("#status").textContent="تم نسخ رابط الأحداث العام: "+url}catch(e){prompt("انسخ رابط الأحداث وشاركه مع الزوار:",url)}};
</script><script src="/hide-hatchable.js"></script><script src="/theme-toggle.js?v=399"></script></body></html>
