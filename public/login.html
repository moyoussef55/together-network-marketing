<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>تسجيل الدخول — Together Network</title><link rel="stylesheet" href="/theme.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:18px}.login-shell{width:min(470px,100%)}.login-card{padding:28px;border-radius:24px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#182332;color:#fff;font-size:25px;font-weight:900}.brand strong{display:block;font-size:24px}.brand span{display:block;color:#8b9ab0;font-size:13px}.login-card h1{text-align:center;margin:0 0 8px}.login-card .muted{text-align:center;line-height:1.8}.login-card label{display:block;margin:18px 0 8px;font-weight:800}.login-card input{width:100%;padding:14px;border-radius:12px;border:1px solid #d5dbe4;background:#fff;color:#111827;font-size:16px;box-sizing:border-box}.login-card .btn{width:100%;margin-top:16px}.login-msg{min-height:24px;margin-top:12px;text-align:center}.err{color:#dc2626}.hint{font-size:13px;margin-top:10px!important}.links{display:grid;gap:10px;margin-top:18px}.links a,.text-button{display:block;text-align:center;color:var(--blue,#60a5fa);text-decoration:none;font-weight:700;cursor:pointer}.text-button{border:0;background:none;margin:14px auto 0;font-size:14px}.lang-btn{display:block;margin:18px auto 0}.hidden{display:none!important}
</style></head>
<body><main class="login-shell"><section class="card login-card">
<div class="brand"><div class="brand-mark">T</div><div><strong>Together</strong><span>Network Marketing</span></div></div>
<section id="loginPanel"><h1 id="title">تسجيل دخول المسوق</h1><p class="muted" id="subtitle">ادخل بكود المسوق أو البريد الإلكتروني مع كلمة السر.</p>
<form id="form"><label for="identifier" id="identifierLabel">كود المسوق أو البريد الإلكتروني</label><input id="identifier" name="identifier" autocomplete="username" placeholder="مثال: TO12345 أو name@example.com" required>
<label for="password" id="passwordLabel">كلمة السر</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة السر" required>
<button class="btn primary" id="submit" type="submit">تسجيل الدخول</button></form>
<button class="text-button" id="forgotButton" type="button">نسيت كلمة السر؟</button>
</section>
<section id="forgotPanel" class="hidden"><h1 id="forgotTitle">إعادة تعيين كلمة السر</h1><p class="muted" id="forgotSubtitle">اكتب البريد الإلكتروني المسجل في حسابك وسنرسل لك رابط إعادة التعيين.</p>
<form id="forgotForm"><label for="resetEmail" id="emailLabel">البريد الإلكتروني</label><input id="resetEmail" type="email" autocomplete="email" placeholder="name@example.com" required><button class="btn primary" id="sendReset" type="submit">إرسال رابط إعادة التعيين</button></form><button class="text-button" id="backButton" type="button">العودة لتسجيل الدخول</button></section>
<div id="msg" class="login-msg muted" role="status" aria-live="polite"></div>
<div class="links"><a href="/">العودة إلى الرئيسية</a></div><button class="lang-btn" id="lang" type="button">English</button>
</section></main>
<script>
const $=id=>document.getElementById(id);let lang="ar",mode="login";
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("title").textContent=lang==="ar"?"تسجيل دخول المسوق":"Marketer sign in";$("subtitle").textContent=lang==="ar"?"ادخل بكود المسوق أو البريد الإلكتروني مع كلمة السر.":"Sign in with your marketer code or email and password.";$("identifierLabel").textContent=lang==="ar"?"كود المسوق أو البريد الإلكتروني":"Marketer code or email";$("identifier").placeholder=lang==="ar"?"مثال: TO12345 أو name@example.com":"e.g. TO12345 or name@example.com";$("passwordLabel").textContent=lang==="ar"?"كلمة السر":"Password";$("password").placeholder=lang==="ar"?"أدخل كلمة السر":"Enter your password";$("submit").textContent=lang==="ar"?"تسجيل الدخول":"Sign in";$("forgotButton").textContent=lang==="ar"?"نسيت كلمة السر؟":"Forgot password?";$("forgotTitle").textContent=lang==="ar"?"إعادة تعيين كلمة السر":"Reset your password";$("forgotSubtitle").textContent=lang==="ar"?"اكتب البريد الإلكتروني المسجل في حسابك وسنرسل لك رابط إعادة التعيين.":"Enter the email address registered to your account and we'll send a reset link.";$("emailLabel").textContent=lang==="ar"?"البريد الإلكتروني":"Email address";$("resetEmail").placeholder=lang==="ar"?"name@example.com":"name@example.com";$("sendReset").textContent=lang==="ar"?"إرسال رابط إعادة التعيين":"Send reset link";$("backButton").textContent=lang==="ar"?"العودة لتسجيل الدخول":"Back to sign in";$("lang").textContent=lang==="ar"?"English":"العربية";}
function next(){const raw=new URLSearchParams(location.search).get("next")||"/marketer/dashboard/";return raw.startsWith("/")&&!raw.startsWith("//")?raw:"/marketer/dashboard/";}
function say(text,error=false){$("msg").textContent=text;$("msg").className="login-msg "+(error?"err":"muted");}
function setMode(nextMode){mode=nextMode;$("loginPanel").classList.toggle("hidden",mode!=="login");$("forgotPanel").classList.toggle("hidden",mode!=="forgot");say("");}
$("forgotButton").onclick=()=>setMode("forgot");$("backButton").onclick=()=>setMode("login");$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render()};
$("form").onsubmit=async e=>{e.preventDefault();const button=$("submit"),identifier=$("identifier").value.trim(),password=$("password").value;button.disabled=true;say(lang==="ar"?"جارٍ التحقق من بيانات الدخول...":"Checking your sign-in details…");try{const r=await fetch("/api/marketer-access",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({identifier,password})});const d=await r.json().catch(()=>({}));if(!r.ok){const errors={invalid_credentials:lang==="ar"?"كود المسوق أو البريد الإلكتروني أو كلمة السر غير صحيحة.":"The marketer code/email or password is incorrect.",login_blocked:lang==="ar"?"تم إيقاف تسجيل الدخول لهذا الحساب.":"Sign-in is blocked for this account.",account_deleted:lang==="ar"?"هذا الحساب محذوف.":"This account has been deleted.",password_not_set:lang==="ar"?"لا توجد كلمة سر مضبوطة لهذا الحساب. استخدم «نسيت كلمة السر؟» لإرسال رابط إلى بريدك.":"No password is set for this account. Use “Forgot password?” to receive a reset link.",password_required:lang==="ar"?"أدخل كلمة السر.":"Enter your password."};throw new Error(errors[d.error]||(lang==="ar"?"تعذر تسجيل الدخول. حاول مرة أخرى.":"Sign-in failed. Please try again."));}if(d.token)sessionStorage.setItem("tn_session_token",d.token);say(lang==="ar"?"تم تسجيل الدخول بنجاح. جارٍ فتح لوحة التحكم...":"Signed in. Opening your dashboard…");location.replace(next());}catch(err){say(err.message||"Sign-in failed",true)}finally{button.disabled=false;}};
$("forgotForm").onsubmit=async e=>{e.preventDefault();const button=$("sendReset"),address=$("resetEmail").value.trim();button.disabled=true;say(lang==="ar"?"جارٍ إرسال طلب إعادة التعيين...":"Sending reset request…");try{const r=await fetch("/api/marketer-password-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"request",email:address})});const d=await r.json().catch(()=>({}));if(!r.ok){if(d.error==="reset_rate_limited")throw new Error(lang==="ar"?"تم طلب إعادة التعيين عدة مرات. انتظر قليلًا ثم حاول مرة أخرى.":"Too many reset requests. Please wait before trying again.");if(d.error==="email_delivery_unavailable")throw new Error(lang==="ar"?"تعذر إرسال البريد من خدمة البريد الحالية. حاول لاحقًا أو تواصل مع الإدارة.":"The current email service could not send the message. Please try later or contact support.");throw new Error(lang==="ar"?"تعذر إرسال الطلب. تحقق من البريد وحاول مجددًا.":"Could not submit the request. Check the email and try again.");}say(lang==="ar"?"إذا كان البريد مسجلًا لحساب مسوق نشط، فسيصلك رابط إعادة التعيين. افحص الوارد والرسائل غير المرغوب فيها.":"If this email belongs to an active marketer account, a reset link will be sent. Check your inbox and spam folder.");}catch(err){say(err.message,true)}finally{button.disabled=false;}};
render();
</script><script src="/hide-hatchable.js"></script></body></html>
