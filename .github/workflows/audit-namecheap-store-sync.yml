name: Audit Namecheap store sync targets
on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/audit-namecheap-store-sync.yml"
permissions:
  contents: read
concurrency:
  group: audit-namecheap-store-sync
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
      - name: Compare main branch with live Namecheap files (read only)
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          git fetch origin main
          echo "=== GitHub main hashes ==="
          for REL in "public/store/index.html" "public/store/product/index.html" "public/theme.css"; do
            printf '%s ' "$REL"
            git show "origin/main:$REL" | sha256sum
          done
          echo "=== Live Namecheap hashes ==="
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="/home/togeiign/marketing-network"
          for REL in "public/store/index.html" "public/store/product/index.html" "public/theme.css"; do
            FILE="$ROOT/$REL"
            printf '%s ' "$REL"
            if [ -f "$FILE" ] && [ ! -L "$FILE" ]; then sha256sum "$FILE"; else echo MISSING_OR_SYMLINK; fi
          done
          REMOTE