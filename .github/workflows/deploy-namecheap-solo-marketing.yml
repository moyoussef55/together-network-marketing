name: Deploy solo-marketing pages to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/admin/index.html"
      - "public/admin/solo-marketing/index.html"
      - "public/marketer-sidebar.js"
      - "public/marketer/solo-marketing/index.html"
      - "public/marketer/wallet/index.html"

permissions:
  contents: read

concurrency:
  group: namecheap-solo-marketing-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@v4

      - name: Validate the bounded static-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/index.html"
            "public/admin/solo-marketing/index.html"
            "public/marketer-sidebar.js"
            "public/marketer/solo-marketing/index.html"
            "public/marketer/wallet/index.html"
          )
          for FILE in "${FILES[@]}"; do
            test -s "$FILE"
            case "$FILE" in
              *.html) grep -qi '<html' "$FILE" ;;
              *.js) grep -Fq 'window.__tnSharedMarketerMenu' "$FILE" ;;
            esac
            printf 'SOURCE_OK %s ' "$FILE"
            sha256sum "$FILE"
          done
          grep -Fq 'solo-marketing' public/admin/index.html
          grep -Fq '/api/admin/solo-marketing' public/admin/solo-marketing/index.html
          grep -Fq '/api/marketer/solo-marketing' public/marketer/solo-marketing/index.html
          grep -Fq 'solo-marketing' public/marketer-sidebar.js
          grep -Fq 'solo_marketing_commissions' public/marketer/wallet/index.html
          grep -Fq 'soloMarketingEarnings' public/marketer/wallet/index.html

      - name: Pin the verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer the five verified UI files to a private staging directory
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/index.html"
            "public/admin/solo-marketing/index.html"
            "public/marketer-sidebar.js"
            "public/marketer/solo-marketing/index.html"
            "public/marketer/wallet/index.html"
          )
          REMOTE_STAGE="/home/togeiign/.solo-marketing-ui-stage-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify the allowlisted UI files
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.solo-marketing-ui-stage-$RUN_ID"
          FILES=(
            "public/admin/index.html"
            "public/admin/solo-marketing/index.html"
            "public/marketer-sidebar.js"
            "public/marketer/solo-marketing/index.html"
            "public/marketer/wallet/index.html"
          )
          STAMP="$(date +%Y%m%d-%H%M%S)"
          TARGETS=()
          INCOMING=()
          BACKUPS=()
          ABSENT=()

          rollback() {
            echo "INSTALL_FAILURE: restoring previous versions" >&2
            for ((i=0; i<${#TARGETS[@]}; i++)); do
              if [ -n "${BACKUPS[$i]}" ] && [ -f "${BACKUPS[$i]}" ]; then
                cp -p "${BACKUPS[$i]}" "${TARGETS[$i]}" || true
                echo "RESTORED ${FILES[$i]}" >&2
              elif [ "${ABSENT[$i]}" = "1" ]; then
                rm -f "${TARGETS[$i]}" || true
                echo "REMOVED newly-created ${FILES[$i]}" >&2
              fi
              if [ -n "${INCOMING[$i]}" ]; then rm -f "${INCOMING[$i]}" || true; fi
            done
            rm -rf "$STAGE"
          }
          trap rollback ERR

          test -d "$ROOT"
          test ! -L "$ROOT"
          test -d "$STAGE"

          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            DIR_REL="$(dirname "$REL")"
            DIR="$ROOT"
            IFS='/' read -r -a PARTS <<< "$DIR_REL"
            for PART in "${PARTS[@]}"; do
              DIR="$DIR/$PART"
              test ! -L "$DIR"
              if [ ! -d "$DIR" ]; then mkdir "$DIR"; fi
            done
            test -s "$SRC"
            test ! -L "$SRC"
            test ! -L "$TARGET"

            TARGETS+=("$TARGET")
            INCOMING+=("$DIR/.$(basename "$TARGET").incoming-$RUN_ID")
            BACKUPS+=("")
            ABSENT+=(0)

            if [ -e "$TARGET" ]; then
              test -f "$TARGET"
              BACKUP="$TARGET.BACKUP-before-solo-marketing-$STAMP-$RUN_ID"
              test ! -e "$BACKUP"
              cp -p "$TARGET" "$BACKUP"
              BACKUPS[$i]="$BACKUP"
            else
              ABSENT[$i]=1
            fi

            cp "$SRC" "${INCOMING[$i]}"
            if [ -e "$TARGET" ]; then chmod --reference="$TARGET" "${INCOMING[$i]}"; else chmod 644 "${INCOMING[$i]}"; fi
            cmp -s "$SRC" "${INCOMING[$i]}"
          done

          for ((i=0; i<${#TARGETS[@]}; i++)); do
            mv -f "${INCOMING[$i]}" "${TARGETS[$i]}"
          done

          for i in "${!FILES[@]}"; do
            cmp -s "$STAGE/${FILES[$i]}" "${TARGETS[$i]}"
            sha256sum "${TARGETS[$i]}"
            if [ -n "${BACKUPS[$i]}" ]; then echo "BACKUP_CREATED=${BACKUPS[$i]}"; else echo "NEW_FILE_INSTALLED=${FILES[$i]}"; fi
          done

          echo "NAMECHEAP_SOLO_MARKETING_UI_DEPLOY_OK"
          trap - ERR
          rm -rf "$STAGE"
          REMOTE
