name: Deploy Hatchable v661 targeted admin UI to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/deploy-namecheap-targeted-admin-ui.yml"
      - "public/admin/marketers/index.html"
      - "public/admin/reports/index.html"
      - "public/admin/reports/updates.html"
      - "public/tn-admin-gateway-7f3c9b2d/index.html"

permissions:
  contents: read

concurrency:
  group: namecheap-hatchable-v661-targeted-admin-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact staged revision
        uses: actions/checkout@v4

      - name: Validate the four Hatchable UI files
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/marketers/index.html"
            "public/admin/reports/index.html"
            "public/admin/reports/updates.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
          )
          for FILE in "${FILES[@]}"; do
            test -s "$FILE"
            test ! -L "$FILE"
            grep -qi '<html' "$FILE"
            printf 'SOURCE_OK %s ' "$FILE"
            sha256sum "$FILE"
          done
          grep -Fq 'hide_network' public/admin/marketers/index.html
          grep -Fq 'show_network' public/admin/marketers/index.html
          grep -Fq 'استعادة' public/admin/marketers/index.html
          grep -Fq 'network_hidden' public/admin/marketers/index.html
          grep -Fq 'id="rememberMe"' public/tn-admin-gateway-7f3c9b2d/index.html
          grep -Fq '/api/admin/marketers' public/admin/marketers/index.html
          echo "HATCHABLE_V661_UI_PREFLIGHT_OK"

      - name: Pin the Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer only the four approved pages
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/marketers/index.html"
            "public/admin/reports/index.html"
            "public/admin/reports/updates.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
          )
          REMOTE_STAGE="/home/togeiign/.hatchable-ui-targeted-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify the approved pages
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.hatchable-ui-targeted-$RUN_ID"
          BACKUP="/home/togeiign/backups/hatchable-v661-admin-ui-$RUN_ID"
          FILES=(
            "public/admin/marketers/index.html"
            "public/admin/reports/index.html"
            "public/admin/reports/updates.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
          )
          rollback() {
            echo "DEPLOY_FAILED: restoring the previous live pages" >&2
            for i in "${!FILES[@]}"; do
              REL="${FILES[$i]}"
              TARGET="$ROOT/$REL"
              SAVED="$BACKUP/$REL"
              INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
              if [ -f "$SAVED" ]; then
                cp -p "$SAVED" "$TARGET" || true
                echo "RESTORED $REL" >&2
              elif [ -f "$STAGE/.target-was-absent-$i" ]; then
                rm -f "$TARGET" || true
                echo "REMOVED newly created $REL" >&2
              fi
              rm -f "$INCOMING" || true
            done
            rm -rf "$STAGE"
          }
          test -d "$ROOT"
          test -d "$STAGE"
          mkdir -p "$BACKUP"

          # Preflight every source and target before changing a live file.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            test -s "$SRC"
            test ! -L "$SRC"
            test -d "$(dirname "$TARGET")"
            test ! -L "$TARGET"
            if [ -e "$TARGET" ]; then
              test -f "$TARGET" || { echo "TARGET_NOT_REGULAR_FILE=$REL" >&2; exit 1; }
            else
              : > "$STAGE/.target-was-absent-$i"
            fi
          done

          # Back up all existing pages and stage incoming files beside targets.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            SAVED="$BACKUP/$REL"
            INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
            mkdir -p "$(dirname "$SAVED")"
            if [ -e "$TARGET" ]; then
              cp -p "$TARGET" "$SAVED"
            fi
            cp "$SRC" "$INCOMING"
            if [ -e "$TARGET" ]; then chmod --reference="$TARGET" "$INCOMING"; else chmod 644 "$INCOMING"; fi
            cmp -s "$SRC" "$INCOMING"
          done

          # Install the entire prepared batch; rollback if any replacement or verification fails.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
            if ! mv -f "$INCOMING" "$TARGET"; then rollback; exit 1; fi
            if ! cmp -s "$SRC" "$TARGET"; then rollback; exit 1; fi
          done

          for REL in "${FILES[@]}"; do
            sha256sum "$ROOT/$REL"
            if [ -f "$BACKUP/$REL" ]; then echo "BACKUP_CREATED=$BACKUP/$REL"; fi
          done

          echo "NAMECHEAP_HATCHABLE_V661_TARGETED_ADMIN_UI_DEPLOY_OK"
          rm -rf "$STAGE"
          REMOTE
