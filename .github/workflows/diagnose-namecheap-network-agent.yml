name: Diagnose Namecheap network agent 500 (read-only)

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/diagnose-namecheap-network-agent.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-namecheap-network-agent
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Pin Namecheap host key
        shell: bash
        env:
          NAMECHEAP_SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Read-only inspect logs and runtime metadata (no environment values)
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          ROOT="/home/togeiign/marketing-network"
          echo "=== ROOT / ENTRYPOINT METADATA ==="
          if test -d "$ROOT"; then
            stat -c '%n | size=%s | modified=%y' "$ROOT/server.js" "$ROOT/api/network/agent.js" 2>&1 || true
            sha256sum "$ROOT/server.js" "$ROOT/api/network/agent.js" 2>&1 || true
            echo "=== RESTART MARKER ==="
            stat -c '%n | modified=%y' "$ROOT/tmp/restart.txt" 2>&1 || true
          else
            echo "PROJECT_ROOT_MISSING"
          fi

          echo "=== RELEVANT LOG FILE DISCOVERY ==="
          find /home/togeiign -maxdepth 5 -type f \( -name 'stderr.log' -o -name 'passenger.log' -o -name 'error_log' -o -name 'error.log' -o -name 'npm-debug.log' \) -printf '%T@ %p\\n' 2>/dev/null | sort -nr | head -n 20 | cut -d' ' -f2- | while IFS= read -r f; do
            test -r "$f" || continue
            echo "--- LOG: $f (last 100 lines; filtered) ---"
            tail -n 100 "$f" 2>/dev/null | grep -iE 'network/agent|internal_error|uncaught|exception|error|failed|cannot find|module not found|syntaxerror|typeerror|referenceerror|database|relation .* does not exist|permission denied' | tail -n 35 | sed -E 's/(password|passwd|token|secret|authorization|cookie)([=: ]+)[^ ,;]+/\\1\\2[REDACTED]/Ig; s/(Bearer )[A-Za-z0-9._~+\\/-]+/\\1[REDACTED]/Ig; s/(postgres(ql)?:\\/\\/)[^ @]+@/\\1[REDACTED]@/Ig'
          done

          echo "=== PROCESS SUMMARY (no command arguments) ==="
          ps -eo user=,comm= 2>/dev/null | grep -Ei 'node|passenger|npm' | sort | uniq -c | head -n 20 || true
          echo "=== READ-ONLY DATABASE CONNECTION TEST ==="
          cd "$ROOT" || exit 1
          NODE="/home/togeiign/nodevenv/shop.together-v-egp.com/20/bin/node"
          if ! test -x "$NODE"; then NODE="/home/togeiign/nodevenv/marketing-network/20/bin/node"; fi
          if ! test -x "$NODE"; then NODE="$(command -v node || true)"; fi
          if ! test -x "${NODE:-/nonexistent}"; then
            echo "DB_TEST_FAILED=NODE_RUNTIME_NOT_FOUND"
            exit 2
          fi
          "$NODE" --input-type=module <<'NODETEST'
          import path from "node:path";
          import dotenv from "dotenv";
          import pg from "pg";
          const ROOT = "/home/togeiign/marketing-network";
          dotenv.config({ path: path.join(ROOT, ".env"), override: false, quiet: true });
          const url = process.env.DATABASE_URL;
          console.log("DOTENV_FILE_PRESENT=" + (await import("node:fs/promises").then(fs => fs.access(path.join(ROOT, ".env")).then(() => "yes").catch(() => "no"))));
          console.log("DATABASE_URL_AVAILABLE=" + (url ? "yes" : "no"));
          if (!url) {
            console.log("DB_TEST_FAILED=DATABASE_URL_NOT_AVAILABLE_IN_SERVER_ENV_OR_DOTENV");
            process.exit(3);
          }
          const schema = String(process.env.DB_SCHEMA || "public").trim();
          if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(schema)) {
            console.log("DB_TEST_FAILED=INVALID_DB_SCHEMA_SETTING");
            process.exit(4);
          }
          const sslEnabled = !["0", "false", "no"].includes(String(process.env.DATABASE_SSL || "true").toLowerCase());
          const pool = new pg.Pool({
            connectionString: url,
            options: `-c search_path=${schema},public -c statement_timeout=5000`,
            ssl: sslEnabled ? { rejectUnauthorized: !["0", "false", "no"].includes(String(process.env.DATABASE_SSL_REJECT_UNAUTHORIZED || "true").toLowerCase()) } : false,
            max: 1,
            connectionTimeoutMillis: 10000,
            idleTimeoutMillis: 1000
          });
          try {
            const result = await pool.query("SELECT 1 AS ok, current_database() AS database_name, current_schema() AS schema_name, current_setting('server_version') AS server_version");
            const row = result.rows[0];
            console.log("DB_QUERY_OK=" + (row.ok === 1 ? "yes" : "no"));
            console.log("DATABASE_NAME=" + row.database_name);
            console.log("ACTIVE_SCHEMA=" + row.schema_name);
            console.log("POSTGRES_VERSION=" + row.server_version);
            console.log("EXPECTED_HATCHABLE_DB_MATCH=" + (row.database_name === "hatchable_apps" && row.schema_name === "app_a8bd59e089a78f6d" ? "yes" : "no"));
            if (row.ok !== 1 || row.database_name !== "hatchable_apps" || row.schema_name !== "app_a8bd59e089a78f6d") process.exitCode = 5;
          } catch (error) {
            console.log("DB_TEST_FAILED=" + String(error?.code || error?.name || "QUERY_ERROR"));
            process.exitCode = 6;
          } finally {
            await pool.end().catch(() => {});
          }
          NODETEST
          echo "=== PUBLIC HEALTH ENDPOINT ==="
          curl --silent --show-error --max-time 10 -i https://marketing.together-v-egp.com/healthz | head -n 25 || true
          echo "=== DIAGNOSTIC COMPLETE; no production data changed ==="
          REMOTE

# Read-only diagnostic trigger after the verified Hatchable API sync on 2026-10-24.
