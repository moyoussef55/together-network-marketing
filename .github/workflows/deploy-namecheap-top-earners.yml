name: Deploy top-earners fix to Namecheap

on:
  push:
    branches:
      - main
    paths:
      - "api/admin/top-earners.js"
      - "public/admin/index.html"
      - ".github/workflows/deploy-namecheap-top-earners.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-top-earners-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@v4

      - name: Validate the two deployment files
        shell: bash
        run: |
          set -euo pipefail
          node --check api/admin/top-earners.js
          grep -q "الرصيد الفعلي" public/admin/index.html
          grep -q "إجمالي الأرباح" public/admin/index.html
          grep -q "topEarnersBody" public/admin/index.html
          echo "Top earners API and admin page checks passed"

      - name: Pin the verified Namecheap SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer the two approved files to private staging
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=("api/admin/top-earners.js" "public/admin/index.html")
          REMOTE_STAGE="/home/togeiign/.together-top-earners-stage-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, restart, and verify
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.together-top-earners-stage-$RUN_ID"
          FILES=("api/admin/top-earners.js" "public/admin/index.html")
          STAMP="$(date +%Y%m%d-%H%M%S)"
          TARGETS=()
          INCOMING=()
          BACKUPS=()
          rollback() {
            for ((i=0; i<${#TARGETS[@]}; i++)); do
              if test -f "${BACKUPS[$i]}"; then cp -p "${BACKUPS[$i]}" "${TARGETS[$i]}" || true; fi
              rm -f "${INCOMING[$i]}" || true
            done
          }
          trap rollback ERR
          test -d "$ROOT"
          for REL in "${FILES[@]}"; do
            TARGET="$ROOT/$REL"
            STAGED_FILE="$STAGE/$REL"
            DIR="$(dirname "$TARGET")"
            BASE="$(basename "$TARGET")"
            INCOMING_FILE="$DIR/.$BASE.incoming-$RUN_ID"
            BACKUP_FILE="$TARGET.BACKUP-before-top-earners-sync-$STAMP"
            test -d "$DIR"
            test -f "$TARGET"
            test ! -L "$TARGET"
            test -s "$STAGED_FILE"
            cp -p "$TARGET" "$BACKUP_FILE"
            cp "$STAGED_FILE" "$INCOMING_FILE"
            chmod --reference="$TARGET" "$INCOMING_FILE"
            cmp -s "$STAGED_FILE" "$INCOMING_FILE"
            TARGETS+=("$TARGET")
            INCOMING+=("$INCOMING_FILE")
            BACKUPS+=("$BACKUP_FILE")
          done
          for ((i=0; i<${#TARGETS[@]}; i++)); do
            mv -f "${INCOMING[$i]}" "${TARGETS[$i]}"
          done
          for ((i=0; i<${#TARGETS[@]}; i++)); do
            cmp -s "$STAGE/${FILES[$i]}" "${TARGETS[$i]}"
          done
          node --check "$ROOT/api/admin/top-earners.js"
          mkdir -p "$ROOT/tmp"
          touch "$ROOT/tmp/restart.txt"
          echo "=== DEPLOYED FILE HASHES ==="
          sha256sum "${TARGETS[@]}"
          echo "=== BACKUPS ==="
          printf '%s\n' "${BACKUPS[@]}"
          echo "NAMECHEAP_TOP_EARNERS_SYNC_OK"
          trap - ERR
          rm -rf "$STAGE"
          REMOTE
