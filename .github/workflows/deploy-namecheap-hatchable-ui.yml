name: Deploy verified Hatchable v619 UI batch to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/deploy-namecheap-hatchable-ui.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-hatchable-v619-ui-batch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact staged revision
        uses: actions/checkout@v4

      - name: Validate the static-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/events/index.html"
            "public/admin/homepage/index.html"
            "public/admin/seo/index.html"
            "public/admin/targets/index.html"
            "public/admin/messages/index.html"
            "public/admin/support-chat/index.html"
            "public/admin/support-chat/dark.css"
            "public/events/index.html"
            "public/marketer/events/index.html"
            "public/marketer/messages/index.html"
            "public/marketer/my-network/index.html"
            "public/marketer/profile/index.html"
            "public/marketer/settings/index.html"
            "public/marketer/support/index.html"
            "public/marketer/recognitions/notifications/index.html"
            "public/marketer-sidebar.js"
            "public/theme-toggle.js"
            "public/alternate-theme.css"
            "public/together-logo.svg"
            "public/store/index.html"
            "public/login.html"
            "public/admin/withdrawals/index.html"
            "public/marketer/wallet/index.html"
            "public/marketer/withdraw/index.html"
            "public/admin/marketers/index.html"
            "public/admin/marketers/detail.html"
            "public/admin/marketers/network.html"
            "public/admin/store/index.html"
            "public/admin/store/add-product/index.html"
          )
          for FILE in "${FILES[@]}"; do
            test -s "$FILE"
            case "$FILE" in
              *.html) grep -qi '<html' "$FILE" ;;
              *.css) grep -q '[:{}]' "$FILE" ;;
              *.js) grep -Eq 'function|=>|\(\(' "$FILE" ;;
              *.svg) grep -Fq '<svg' "$FILE" ;;
            esac
            printf 'SOURCE_OK %s ' "$FILE"
            sha256sum "$FILE"
          done
          # Guard important page/API pairings before transferring UI files.
          grep -Fq '/api/admin/events' public/admin/events/index.html
          grep -Fq '/api/admin/homepage-settings' public/admin/homepage/index.html
          grep -Fq '/api/admin/seo-settings' public/admin/seo/index.html
          grep -Fq '/api/admin/targets' public/admin/targets/index.html
          grep -Fq '/api/admin/messages' public/admin/messages/index.html
          grep -Fq '/api/admin/support-chat' public/admin/support-chat/index.html
          grep -Fq '/api/events-public' public/events/index.html
          grep -Fq '/api/marketer/events' public/marketer/events/index.html
          grep -Fq '/api/marketer/messages' public/marketer/messages/index.html
          grep -Fq '/api/profile' public/marketer/profile/index.html
          grep -Fq '/api/marketer-settings' public/marketer/settings/index.html
          grep -Fq '/api/admin/marketers' public/admin/marketers/index.html
          grep -Fq '/api/admin/marketer-detail' public/admin/marketers/detail.html
          grep -Fq '/api/admin/marketer-network' public/admin/marketers/network.html
          grep -Fq '/api/admin/store' public/admin/store/index.html
          grep -Fq '/api/admin/store' public/admin/store/add-product/index.html
          grep -Fq 'id="purchaseInvoiceResult"' public/store/index.html
          grep -Fq '/api/store/order' public/store/index.html
          grep -Fq 'theme-toggle.js' public/login.html
          grep -Fq '/api/admin/withdrawals' public/admin/withdrawals/index.html
          grep -Fq '/api/marketer/wallet' public/marketer/wallet/index.html
          grep -Fq '/api/marketer/withdrawals' public/marketer/withdraw/index.html
          grep -Fq 'window.__tnSharedMarketerMenu' public/marketer-sidebar.js
          grep -Fq '__togetherThemeToggleInstalled' public/theme-toggle.js
          grep -Fq 'Together Network alternate off-white theme' public/alternate-theme.css
          grep -Fq '<svg' public/together-logo.svg

      - name: Pin the verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer allowlisted files to a remote staging directory
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/events/index.html"
            "public/admin/homepage/index.html"
            "public/admin/seo/index.html"
            "public/admin/targets/index.html"
            "public/admin/messages/index.html"
            "public/admin/support-chat/index.html"
            "public/admin/support-chat/dark.css"
            "public/events/index.html"
            "public/marketer/events/index.html"
            "public/marketer/messages/index.html"
            "public/marketer/my-network/index.html"
            "public/marketer/profile/index.html"
            "public/marketer/settings/index.html"
            "public/marketer/support/index.html"
            "public/marketer/recognitions/notifications/index.html"
            "public/marketer-sidebar.js"
            "public/theme-toggle.js"
            "public/alternate-theme.css"
            "public/together-logo.svg"
            "public/store/index.html"
            "public/login.html"
            "public/admin/withdrawals/index.html"
            "public/marketer/wallet/index.html"
            "public/marketer/withdraw/index.html"
            "public/admin/marketers/index.html"
            "public/admin/marketers/detail.html"
            "public/admin/marketers/network.html"
            "public/admin/store/index.html"
            "public/admin/store/add-product/index.html"
          )
          REMOTE_STAGE="/home/togeiign/.hatchable-ui-stage-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify the batch
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.hatchable-ui-stage-$RUN_ID"
          FILES=(
            "public/admin/events/index.html"
            "public/admin/homepage/index.html"
            "public/admin/seo/index.html"
            "public/admin/targets/index.html"
            "public/admin/messages/index.html"
            "public/admin/support-chat/index.html"
            "public/admin/support-chat/dark.css"
            "public/events/index.html"
            "public/marketer/events/index.html"
            "public/marketer/messages/index.html"
            "public/marketer/my-network/index.html"
            "public/marketer/profile/index.html"
            "public/marketer/settings/index.html"
            "public/marketer/support/index.html"
            "public/marketer/recognitions/notifications/index.html"
            "public/marketer-sidebar.js"
            "public/theme-toggle.js"
            "public/alternate-theme.css"
            "public/together-logo.svg"
            "public/store/index.html"
            "public/login.html"
            "public/admin/withdrawals/index.html"
            "public/marketer/wallet/index.html"
            "public/marketer/withdraw/index.html"
            "public/admin/marketers/index.html"
            "public/admin/marketers/detail.html"
            "public/admin/marketers/network.html"
            "public/admin/store/index.html"
            "public/admin/store/add-product/index.html"
          )
          rollback() {
            echo "BATCH_FAILURE: restoring previous versions" >&2
            for i in "${!FILES[@]}"; do
              REL="${FILES[$i]}"
              TARGET="$ROOT/$REL"
              BACKUP="$TARGET.BACKUP-before-hatchable-v619-$RUN_ID"
              INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
              if [ -f "$BACKUP" ]; then
                cp -p "$BACKUP" "$TARGET" || true
                echo "RESTORED $REL from $BACKUP" >&2
              elif [ -f "$STAGE/.target-was-absent-$i" ]; then
                rm -f "$TARGET" || true
                echo "REMOVED newly-created $REL during rollback" >&2
              fi
              rm -f "$INCOMING" || true
            done
            rm -rf "$STAGE"
          }
          test -d "$ROOT"
          test -d "$STAGE"
          # Full preflight first: no live file changes are made in this loop.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            test -s "$SRC"
            test ! -L "$SRC"
            test -d "$(dirname "$TARGET")" || { echo "MISSING_TARGET_DIRECTORY=$REL" >&2; exit 1; }
            if [ -L "$TARGET" ]; then echo "REFUSING_SYMLINK=$REL" >&2; exit 1; fi
            if [ -e "$TARGET" ]; then
              test -f "$TARGET" || { echo "TARGET_NOT_REGULAR_FILE=$REL" >&2; exit 1; }
            else
              : > "$STAGE/.target-was-absent-$i"
            fi
          done
          # Create all backups and all same-directory incoming files before install.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
            BACKUP="$TARGET.BACKUP-before-hatchable-v619-$RUN_ID"
            if [ -e "$TARGET" ]; then
              test ! -e "$BACKUP" || { echo "BACKUP_ALREADY_EXISTS=$BACKUP" >&2; rollback; exit 1; }
              cp -p "$TARGET" "$BACKUP" || { rollback; exit 1; }
            fi
            cp "$SRC" "$INCOMING" || { rollback; exit 1; }
            if [ -e "$TARGET" ]; then chmod --reference="$TARGET" "$INCOMING"; else chmod 644 "$INCOMING"; fi
            cmp -s "$SRC" "$INCOMING" || { echo "STAGING_MISMATCH=$REL" >&2; rollback; exit 1; }
          done
          # Only after all files and backups are ready do we begin replacements.
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            SRC="$STAGE/$REL"
            TARGET="$ROOT/$REL"
            INCOMING="$(dirname "$TARGET")/.$(basename "$TARGET").incoming-$RUN_ID"
            if ! mv -f "$INCOMING" "$TARGET"; then echo "INSTALL_FAILED=$REL" >&2; rollback; exit 1; fi
            if ! cmp -s "$SRC" "$TARGET"; then echo "VERIFY_FAILED=$REL" >&2; rollback; exit 1; fi
          done
          for i in "${!FILES[@]}"; do
            REL="${FILES[$i]}"
            TARGET="$ROOT/$REL"
            sha256sum "$TARGET"
            if [ -f "$TARGET.BACKUP-before-hatchable-v619-$RUN_ID" ]; then
              echo "BACKUP_CREATED=$TARGET.BACKUP-before-hatchable-v619-$RUN_ID"
            else
              echo "NEW_FILE_INSTALLED=$REL"
            fi
          done
          echo "NAMECHEAP_HATCHABLE_V619_UI_BATCH_DEPLOY_OK"
          rm -rf "$STAGE"
          REMOTE
