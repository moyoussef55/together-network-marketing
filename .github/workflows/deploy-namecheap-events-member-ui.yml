name: Deploy marketer and public events pages to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/marketer/events/index.html"
      - "public/events/index.html"
      - ".github/workflows/deploy-namecheap-events-member-ui.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-events-member-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Validate event pages
        shell: bash
        run: |
          set -euo pipefail
          test -s public/marketer/events/index.html
          test -s public/events/index.html
          grep -Fq 'body[data-theme="light"] .event' public/marketer/events/index.html
          grep -Fq 'body[data-theme="light"] .event' public/events/index.html
          sha256sum public/marketer/events/index.html public/events/index.html

      - name: Pin verified Namecheap SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Stage both event pages
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for PAGE in public/marketer/events/index.html public/events/index.html; do
            SAFE=$(printf '%s' "$PAGE" | tr '/' '-')
            REMOTE_TMP="/home/togeiign/.events-ui-$RUN_ID-$SAFE"
            ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '$REMOTE_TMP'" < "$PAGE"
            echo "STAGED:$REMOTE_TMP"
          done

      - name: Back up, atomically install, and verify both pages
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          for PAGE in public/marketer/events/index.html public/events/index.html; do
            SAFE=$(printf '%s' "$PAGE" | tr '/' '-')
            TARGET="$ROOT/$PAGE"
            STAGED="/home/togeiign/.events-ui-$RUN_ID-$SAFE"
            DIR=$(dirname "$TARGET")
            INCOMING="$DIR/.index.html.incoming-$RUN_ID"
            test -d "$DIR"
            test -f "$TARGET"
            test ! -L "$TARGET"
            test -s "$STAGED"
            grep -Fq 'body[data-theme="light"] .event' "$STAGED"
            cp "$STAGED" "$INCOMING"
            chmod --reference="$TARGET" "$INCOMING"
            cmp -s "$STAGED" "$INCOMING"
            BACKUP="$TARGET.BACKUP-before-event-light-theme-$(date +%Y%m%d-%H%M%S)-$RUN_ID"
            cp -p "$TARGET" "$BACKUP"
            if ! mv -f "$INCOMING" "$TARGET"; then
              cp -p "$BACKUP" "$TARGET"
              exit 1
            fi
            if ! cmp -s "$STAGED" "$TARGET"; then
              cp -p "$BACKUP" "$TARGET"
              echo "VERIFY_FAILED; restored $BACKUP" >&2
              exit 1
            fi
            sha256sum "$TARGET"
            echo "BACKUP_CREATED=$BACKUP"
            rm -f "$STAGED" "$INCOMING"
          done
          echo "NAMECHEAP_EVENTS_MEMBER_UI_DEPLOY_OK"
          REMOTE
