name: Deploy admin events upload page to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/admin/events/index.html"
      - ".github/workflows/deploy-namecheap-events-admin-ui.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-admin-events-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Validate the event upload and success handling
        shell: bash
        run: |
          set -euo pipefail
          PAGE="public/admin/events/index.html"
          test -s "$PAGE"
          grep -Fq 'raw-chunked' "$PAGE"
          grep -Fq 'let published=false' "$PAGE"
          grep -Fq 'تم نشر الحدث بنجاح' "$PAGE"
          grep -Fq 'تعذر تحديث القائمة تلقائيًا' "$PAGE"
          sha256sum "$PAGE"

      - name: Pin verified Namecheap SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Stage the validated events page
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          REMOTE_TMP="/home/togeiign/.admin-events-index-$RUN_ID"
          ssh -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" "umask 077; cat > '$REMOTE_TMP'" < public/admin/events/index.html
          echo "REMOTE_STAGE_READY=$REMOTE_TMP"

      - name: Back up, atomically install, and verify the events page
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          TARGET="$ROOT/public/admin/events/index.html"
          STAGED="/home/togeiign/.admin-events-index-$RUN_ID"
          INCOMING="$ROOT/public/admin/events/.index.html.incoming-$RUN_ID"
          test -d "$ROOT"
          test -d "$ROOT/public/admin/events"
          test -f "$TARGET"
          test ! -L "$TARGET"
          test -s "$STAGED"
          grep -Fq 'raw-chunked' "$STAGED"
          grep -Fq 'let published=false' "$STAGED"
          cp "$STAGED" "$INCOMING"
          chmod --reference="$TARGET" "$INCOMING"
          cmp -s "$STAGED" "$INCOMING"
          BACKUP="$TARGET.BACKUP-before-events-upload-fix-$(date +%Y%m%d-%H%M%S)-$RUN_ID"
          cp -p "$TARGET" "$BACKUP"
          if ! mv -f "$INCOMING" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            exit 1
          fi
          if ! cmp -s "$STAGED" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            echo "VERIFY_FAILED; previous page restored: $BACKUP" >&2
            exit 1
          fi
          sha256sum "$TARGET"
          echo "BACKUP_CREATED=$BACKUP"
          echo "NAMECHEAP_ADMIN_EVENTS_UI_DEPLOY_OK"
          rm -f "$STAGED" "$INCOMING"
          REMOTE
