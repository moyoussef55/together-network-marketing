name: Deploy recognition moderation to Namecheap
on:
  workflow_dispatch:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/admin/recognitions/index.html"
      - "public/marketer/recognitions/index.html"
      - "api/admin/recognitions.js"
      - ".github/workflows/deploy-namecheap-recognitions.yml"
permissions:
  contents: read
concurrency:
  group: namecheap-recognition-moderation
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Validate synced files
        shell: bash
        run: |
          set -euo pipefail
          A="public/admin/recognitions/index.html"
          P="public/marketer/recognitions/index.html"
          J="api/admin/recognitions.js"
          test -s "$A" && test -s "$P" && test -s "$J"
          grep -Fq 'id="restrictedMembers"' "$A"
          grep -Fq 'data-unblock-marketer' "$A"
          grep -Fq 'data-show-recognitions' "$A"
          grep -Fq 'data-admin-unblock-user' "$P"
          grep -Fq 'data-admin-show-user' "$P"
          grep -Fq 'if(action==="unblock_marketer")' "$J"
          sha256sum "$A" "$P" "$J"
      - name: Pin verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256
      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
      - name: Transfer files to private temporary locations
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '/home/togeiign/.admin-recognitions-index.html.deploy-$RUN_ID'" < "public/admin/recognitions/index.html"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '/home/togeiign/.marketer-recognitions-index.html.deploy-$RUN_ID'" < "public/marketer/recognitions/index.html"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '/home/togeiign/.api-admin-recognitions.js.deploy-$RUN_ID'" < "api/admin/recognitions.js"
      - name: Backup, install and verify targeted files
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          A="$ROOT/public/admin/recognitions/index.html"
          P="$ROOT/public/marketer/recognitions/index.html"
          J="$ROOT/api/admin/recognitions.js"
          AS="/home/togeiign/.admin-recognitions-index.html.deploy-$RUN_ID"
          PS="/home/togeiign/.marketer-recognitions-index.html.deploy-$RUN_ID"
          JS="/home/togeiign/.api-admin-recognitions.js.deploy-$RUN_ID"
          AI="$ROOT/public/admin/recognitions/.index.html.incoming-$RUN_ID"
          PI="$ROOT/public/marketer/recognitions/.index.html.incoming-$RUN_ID"
          JI="$ROOT/api/admin/.recognitions.js.incoming-$RUN_ID"
          test -d "$ROOT" && test -d "$ROOT/public/admin/recognitions" && test -d "$ROOT/public/marketer/recognitions" && test -d "$ROOT/api/admin"
          test -s "$AS" && test -s "$PS" && test -s "$JS"
          test -f "$A" && test ! -L "$A"
          test -f "$P" && test ! -L "$P"
          grep -Fq 'id="restrictedMembers"' "$AS"
          grep -Fq 'data-unblock-marketer' "$AS"
          grep -Fq 'data-show-recognitions' "$AS"
          grep -Fq 'data-admin-unblock-user' "$PS"
          grep -Fq 'data-admin-show-user' "$PS"
          grep -Fq 'if(action==="unblock_marketer")' "$JS"
          AP=0
          if [ -e "$J" ]; then test -f "$J" && test ! -L "$J"; AP=1; fi
          cp "$AS" "$AI"
          cp "$PS" "$PI"
          chmod --reference="$A" "$AI"
          chmod --reference="$P" "$PI"
          cmp -s "$AS" "$AI" && cmp -s "$PS" "$PI"
          if [ "$AP" -eq 1 ]; then cp "$JS" "$JI"; chmod --reference="$J" "$JI"; cmp -s "$JS" "$JI"; fi
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BA="$A.BACKUP-before-github-sync-$STAMP"
          BP="$P.BACKUP-before-github-sync-$STAMP"
          BJ=""
          cp -p "$A" "$BA" && cp -p "$P" "$BP"
          if [ "$AP" -eq 1 ]; then BJ="$J.BACKUP-before-github-sync-$STAMP"; cp -p "$J" "$BJ"; fi
          if ! mv -f "$AI" "$A" || ! mv -f "$PI" "$P"; then cp -p "$BA" "$A"; cp -p "$BP" "$P"; [ -z "$BJ" ] || cp -p "$BJ" "$J"; exit 1; fi
          if [ "$AP" -eq 1 ] && ! mv -f "$JI" "$J"; then cp -p "$BA" "$A"; cp -p "$BP" "$P"; cp -p "$BJ" "$J"; exit 1; fi
          if ! cmp -s "$AS" "$A" || ! cmp -s "$PS" "$P" || { [ "$AP" -eq 1 ] && ! cmp -s "$JS" "$J"; }; then
            cp -p "$BA" "$A"; cp -p "$BP" "$P"; [ -z "$BJ" ] || cp -p "$BJ" "$J"
            echo "VERIFY_FAILED; previous files restored" >&2
            exit 1
          fi
          echo "=== Installed SHA-256 ==="
          sha256sum "$A" "$P"
          echo "BACKUP_ADMIN=$BA"
          echo "BACKUP_PREVIEW=$BP"
          if [ "$AP" -eq 1 ]; then sha256sum "$J"; echo "BACKUP_API=$BJ"; echo "NAMECHEAP_RECOGNITIONS_API_DEPLOY_OK"; else echo "API_SOURCE_NOT_INSTALLED_LOCALLY=1 (API may be served by Hatchable proxy)"; fi
          echo "NAMECHEAP_RECOGNITIONS_PAGES_DEPLOY_OK"
          rm -f "$AS" "$PS" "$JS" "$AI" "$PI" "$JI"
          REMOTE
