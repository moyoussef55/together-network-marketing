name: Namecheap SSH connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare verified SSH host key
        shell: bash
        env:
          NAMECHEAP_SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$NAMECHEAP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Load hosting SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Verify SSH connection without changing the server
        shell: bash
        env:
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "$NAMECHEAP_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$NAMECHEAP_SSH_USER@$NAMECHEAP_SSH_HOST" \
            'printf "SSH_CONNECTION_OK\n"; hostname -f; printf "HOME=%s\n" "$HOME"'
