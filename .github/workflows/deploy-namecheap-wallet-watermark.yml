name: Deploy marketer wallet cheque watermark to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/deploy-namecheap-wallet-watermark.yml"
      - "public/marketer/wallet/index.html"

permissions:
  contents: read

concurrency:
  group: namecheap-marketer-wallet-watermark
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact staged revision
        uses: actions/checkout@v4

      - name: Validate the wallet cheque watermark fix
        shell: bash
        run: |
          set -euo pipefail
          PAGE="public/marketer/wallet/index.html"
          test -s "$PAGE"
          test ! -L "$PAGE"
          grep -Fq 'body[data-theme="light"] .together-check::before' "$PAGE"
          grep -Fq -- '-webkit-text-fill-color:rgba(25,58,84,.055)!important' "$PAGE"
          grep -Fq 'content:"TOGETHER"' "$PAGE"
          sha256sum "$PAGE"
          echo "WALLET_WATERMARK_SOURCE_OK"

      - name: Pin the Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Stage the wallet page on Namecheap
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PAGE="public/marketer/wallet/index.html"
          REMOTE_STAGE="/home/togeiign/.wallet-watermark-stage-$RUN_ID"
          tar -czf - "$PAGE" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify only the wallet page
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          REL="public/marketer/wallet/index.html"
          STAGE="/home/togeiign/.wallet-watermark-stage-$RUN_ID"
          BACKUP="/home/togeiign/backups/hatchable-v662-wallet-watermark-$RUN_ID"
          TARGET="$ROOT/$REL"
          SRC="$STAGE/$REL"
          INCOMING="$ROOT/public/marketer/.wallet-index.html.incoming-$RUN_ID"
          SAVED="$BACKUP/$REL"

          rollback() {
            echo "WALLET_DEPLOY_FAILED: restoring previous wallet page" >&2
            if [ -f "$SAVED" ]; then
              cp -p "$SAVED" "$TARGET" || true
              echo "RESTORED_FROM=$SAVED" >&2
            fi
            rm -f "$INCOMING" || true
            rm -rf "$STAGE"
          }

          test -d "$ROOT"
          test -d "$ROOT/public/marketer"
          test -d "$STAGE"
          test -s "$SRC"
          test ! -L "$ROOT"
          test ! -L "$ROOT/public"
          test ! -L "$ROOT/public/marketer"
          test ! -L "$TARGET"
          test -f "$TARGET"

          mkdir -p "$BACKUP/$(dirname "$REL")"
          cp -p "$TARGET" "$SAVED"
          cp "$SRC" "$INCOMING"
          chmod --reference="$TARGET" "$INCOMING"
          cmp -s "$SRC" "$INCOMING" || { rollback; exit 1; }

          if ! mv -f "$INCOMING" "$TARGET"; then rollback; exit 1; fi
          if ! cmp -s "$SRC" "$TARGET"; then rollback; exit 1; fi

          sha256sum "$TARGET"
          echo "BACKUP_CREATED=$SAVED"
          echo "NAMECHEAP_WALLET_WATERMARK_DEPLOY_OK"
          rm -rf "$STAGE"
          REMOTE
