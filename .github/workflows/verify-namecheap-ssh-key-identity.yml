name: Verify Namecheap SSH key identity

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/verify-namecheap-ssh-key-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-key:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pin the Namecheap server host key verified by support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the configured GitHub private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: \${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Print only the loaded public-key fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_ACTIONS_LOADED_KEY_FINGERPRINT:"
          ssh-add -l -E sha256

      - name: Compare against cPanel named keys and authorized keys
        shell: bash
        env:
          NAMECHEAP_SSH_HOST: \${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: \${{ secrets.NAMECHEAP_SSH_PORT }}
          NAMECHEAP_SSH_USER: \${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "$NAMECHEAP_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$NAMECHEAP_SSH_USER@$NAMECHEAP_SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "CPANEL_HOME=$HOME"
          for name in together_github together_network_repo id_rsa id_ed25519; do
            key="$HOME/.ssh/$name.pub"
            if [ -f "$key" ]; then
              echo "PUBLIC_KEY_FILE=$name.pub"
              ssh-keygen -lf "$key" -E sha256
            else
              echo "PUBLIC_KEY_FILE_NOT_FOUND=$name.pub"
            fi
          done
          echo "AUTHORIZED_KEYS_FINGERPRINTS:"
          if [ -f "$HOME/.ssh/authorized_keys" ]; then
            ssh-keygen -lf "$HOME/.ssh/authorized_keys" -E sha256
          else
            echo "AUTHORIZED_KEYS_FILE_NOT_FOUND"
          fi
          REMOTE
