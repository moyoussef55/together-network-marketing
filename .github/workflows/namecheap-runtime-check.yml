name: Namecheap runtime checks
on:
  push:
    branches: [namecheap-runtime-prep]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Smoke-test static site and health endpoint without production secrets
        run: |
          node server.js > /tmp/together-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:3000/healthz > /tmp/together-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/together-health.json
          grep -q '"runtime":"namecheap-node"' /tmp/together-health.json
          grep -q '"api_mode":"hatchable-proxy"' /tmp/together-health.json
          curl --silent --fail http://127.0.0.1:3000/ | grep -qi 'Together'
          curl --silent --show-error --head http://127.0.0.1:3000/ | grep -qi '^strict-transport-security: max-age=31536000'
          curl --silent --show-error --head http://127.0.0.1:3000/ | grep -qi '^x-frame-options: SAMEORIGIN'
          curl --silent --show-error --head http://127.0.0.1:3000/ | grep -qi '^permissions-policy: geolocation=(), camera=(self), microphone=(self)'
          curl --silent --show-error --head http://127.0.0.1:3000/ | grep -qi "^content-security-policy:.*object-src.*none"
          curl --silent --fail http://127.0.0.1:3000/login > /tmp/together-login.html
          grep -qi '<html' /tmp/together-login.html
          code=$(curl --silent --output /tmp/together-api-response.json --write-out '%{http_code}' http://127.0.0.1:3000/api/admin/login)
          echo "GET /api/admin/login returned HTTP $code (the route accepts POST only)"
          case "$code" in
            405)
              # HTTP 405 is the required contract; upstream response bodies can vary.
              ;;
            404)
              # The upstream Hatchable router may intentionally conceal POST-only
              # endpoints behind 404 instead of returning 405.
              ;;
            *)
              echo "Unexpected response for a GET to the POST-only admin login endpoint:" >&2
              cat /tmp/together-api-response.json >&2
              tail -n 40 /tmp/together-runtime.log >&2 || true
              exit 1
              ;;
          esac
