name: Restore network agent API before BV carry change

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/restore-namecheap-network-agent-before-carry.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-network-agent-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pin Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Restore latest API backup created before BV carry deployment
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          TARGET="$ROOT/api/network/agent.js"
          test -d "$ROOT"
          test -f "$TARGET"
          BACKUP="$(find "$ROOT/api/network" -maxdepth 1 -type f -name 'agent.js.BACKUP-before-carry-sync-*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$BACKUP" ] || [ ! -s "$BACKUP" ]; then
            echo "RESTORE_ABORTED: no non-empty agent.js.BACKUP-before-carry-sync backup found" >&2
            exit 2
          fi
          STAGED="$ROOT/api/network/.agent.js.restore-$RUN_ID"
          SAFETY="$TARGET.SAFETY-before-carry-restore-$(date +%Y%m%d-%H%M%S)"
          cp "$BACKUP" "$STAGED"
          chmod --reference="$TARGET" "$STAGED"
          cmp -s "$BACKUP" "$STAGED"
          cp -p "$TARGET" "$SAFETY"
          if ! mv -f "$STAGED" "$TARGET"; then
            cp -p "$SAFETY" "$TARGET"
            exit 1
          fi
          if ! cmp -s "$BACKUP" "$TARGET"; then
            cp -p "$SAFETY" "$TARGET"
            echo "RESTORE_VERIFY_FAILED; safety copy retained at $SAFETY" >&2
            exit 1
          fi
          if command -v node >/dev/null 2>&1; then
            node --check "$TARGET" || { cp -p "$SAFETY" "$TARGET"; echo "SYNTAX_CHECK_FAILED; restored safety copy" >&2; exit 1; }
          fi
          mkdir -p "$ROOT/tmp"
          touch "$ROOT/tmp/restart.txt"
          echo "RESTORED_FROM=$BACKUP"
          echo "SAFETY_COPY=$SAFETY"
          sha256sum "$TARGET"
          echo "NETWORK_AGENT_PRE_CARRY_BACKUP_RESTORED_RESTART_REQUESTED"
          REMOTE
