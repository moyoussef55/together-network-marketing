name: Deploy remember-me login pages and session handling to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/login.html"
      - "public/tn-admin-gateway-7f3c9b2d/index.html"
      - "api/marketer-access.js"
      - "lib/network-auth.js"
      - "lib/login-rate-limit.js"
      - "api/admin/login.js"
      - "lib/admin-auth.js"
      - "api/marketer-password-reset.js"
      - "api/admin/password-reset.js"
      - "api/admin/marketers.js"
      - "api/network/register-agent.js"
      - "api/admin/register-agent.js"
      - "api/marketer/withdrawals.js"
      - "api/agent-document.js"
      - "api/network/agent.js"
      - "lib/agent-welcome-email.js"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-namecheap-remember-me.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-remember-me-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact GitHub revision
        uses: actions/checkout@v4

      - name: Validate security code and server-side session lifetimes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          grep -Fq 'data-ar="تذكرني" data-en="Remember me">تذكرني' public/login.html
          grep -Fq 'textContent=lang==="ar"?"تذكرني":"Remember me"' public/login.html
          grep -Fq '<span>تذكرني</span>' public/tn-admin-gateway-7f3c9b2d/index.html
          grep -Fq 'rememberMe:$("rememberMe").checked' public/tn-admin-gateway-7f3c9b2d/index.html
          grep -Fq 'createNetworkSession(res,p.id,b.rememberMe === true)' api/marketer-access.js
          grep -Fq "interval '30 days' ELSE interval '30 minutes'" lib/network-auth.js
          grep -Fq 'issueAdminSession(res, b.rememberMe === true)' api/admin/login.js
          grep -Fq "interval '30 days' ELSE interval '30 minutes'" lib/admin-auth.js
          node --check api/marketer-access.js
          node --check lib/network-auth.js
          node --check lib/login-rate-limit.js
          node --check api/admin/login.js
          node --check lib/admin-auth.js
          sha256sum public/login.html public/tn-admin-gateway-7f3c9b2d/index.html api/marketer-access.js lib/network-auth.js lib/login-rate-limit.js api/admin/login.js lib/admin-auth.js api/marketer-password-reset.js api/admin/password-reset.js api/admin/marketers.js api/network/register-agent.js api/admin/register-agent.js api/marketer/withdrawals.js api/agent-document.js lib/agent-welcome-email.js
          node --check api/marketer-password-reset.js
          node --check api/admin/password-reset.js
          node --check api/admin/marketers.js
          node --check api/network/register-agent.js
          node --check api/admin/register-agent.js
          node --check api/marketer/withdrawals.js
          node --check api/agent-document.js
          node --check api/network/agent.js
          node --check lib/agent-welcome-email.js
          node --check server.js
          node -e 'JSON.parse(require("node:fs").readFileSync("package.json","utf8"))'

      - name: Pin the verified Namecheap SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Verify Namecheap npm runtime before staging
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "test -x /home/togeiign/nodevenv/shop.together-v-egp.com/20/bin/npm && /home/togeiign/nodevenv/shop.together-v-egp.com/20/bin/npm --version"

      - name: Transfer reviewed security files to remote staging
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=(
            "public/login.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
            "api/marketer-access.js"
            "lib/network-auth.js"
            "lib/login-rate-limit.js"
            "api/admin/login.js"
            "lib/admin-auth.js"
            "api/marketer-password-reset.js"
            "api/admin/password-reset.js"
            "api/admin/marketers.js"
            "api/network/register-agent.js"
            "api/admin/register-agent.js"
            "api/marketer/withdrawals.js"
            "api/agent-document.js"
            "api/network/agent.js"
            "lib/agent-welcome-email.js"
            "server.js"
            "package.json"
            "package-lock.json"
          )
          REMOTE_STAGE="/home/togeiign/.tn-remember-stage-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify security files
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.tn-remember-stage-$RUN_ID"
          FILES=(
            "public/login.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
            "api/marketer-access.js"
            "lib/network-auth.js"
            "lib/login-rate-limit.js"
            "api/admin/login.js"
            "lib/admin-auth.js"
            "api/marketer-password-reset.js"
            "api/admin/password-reset.js"
            "api/admin/marketers.js"
            "api/network/register-agent.js"
            "api/admin/register-agent.js"
            "api/marketer/withdrawals.js"
            "api/agent-document.js"
            "api/network/agent.js"
            "lib/agent-welcome-email.js"
            "server.js"
            "package.json"
            "package-lock.json"
          )
          test -d "$ROOT"
          for REL in "${FILES[@]}"; do
            test -s "$STAGE/$REL"
            if [ -e "$ROOT/$REL" ]; then
              test -f "$ROOT/$REL" && test ! -L "$ROOT/$REL"
            else
              case "$REL" in
                "lib/login-rate-limit.js") mkdir -p "$(dirname "$ROOT/$REL")" ;;
                *) echo "Unexpected missing production target: $REL" >&2; exit 1 ;;
              esac
            fi
          done
          grep -Fq 'data-ar="تذكرني" data-en="Remember me">تذكرني' "$STAGE/public/login.html"
          grep -Fq '<span>تذكرني</span>' "$STAGE/public/tn-admin-gateway-7f3c9b2d/index.html"
          grep -Fq 'createNetworkSession(res,p.id,b.rememberMe === true)' "$STAGE/api/marketer-access.js"
          grep -Fq "interval '30 days' ELSE interval '30 minutes'" "$STAGE/lib/network-auth.js"
          grep -Fq 'issueAdminSession(res, b.rememberMe === true)' "$STAGE/api/admin/login.js"
          grep -Fq "interval '30 days' ELSE interval '30 minutes'" "$STAGE/lib/admin-auth.js"

          STAMP="$(date +%Y%m%d-%H%M%S)"
          TARGETS=()
          STAGED=()
          INCOMING=()
          BACKUPS=()
          for REL in "${FILES[@]}"; do
            TARGET="$ROOT/$REL"
            STAGED_FILE="$STAGE/$REL"
            DIR="$(dirname "$TARGET")"
            BASE="$(basename "$TARGET")"
            INCOMING_FILE="$DIR/.$BASE.incoming-$RUN_ID"
            BACKUP_FILE=""
            if [ -f "$TARGET" ]; then
              BACKUP_FILE="$TARGET.BACKUP-before-remember-session-$STAMP-$RUN_ID"
              cp -p "$TARGET" "$BACKUP_FILE"
            fi
            cp "$STAGED_FILE" "$INCOMING_FILE"
            chmod --reference="$TARGET" "$INCOMING_FILE"
            cmp -s "$STAGED_FILE" "$INCOMING_FILE"
            TARGETS+=("$TARGET")
            STAGED+=("$STAGED_FILE")
            INCOMING+=("$INCOMING_FILE")
            BACKUPS+=("$BACKUP_FILE")
          done

          rollback() {
            for ((i=0; i<${#TARGETS[@]}; i++)); do
              if [[ -n "${BACKUPS[$i]}" ]]; then
                cp -p "${BACKUPS[$i]}" "${TARGETS[$i]}" || true
              else
                rm -f "${TARGETS[$i]}" || true
              fi
              rm -f "${INCOMING[$i]}" || true
            done
          }
          for ((i=0; i<${#TARGETS[@]}; i++)); do
            if ! mv -f "${INCOMING[$i]}" "${TARGETS[$i]}"; then
              rollback
              echo "INSTALL_FAILED: original files restored" >&2
              exit 1
            fi
          done
          for ((i=0; i<${#TARGETS[@]}; i++)); do
            if ! cmp -s "${STAGED[$i]}" "${TARGETS[$i]}"; then
              rollback
              echo "VERIFY_FAILED: original files restored" >&2
              exit 1
            fi
          done
          NPM="/home/togeiign/nodevenv/shop.together-v-egp.com/20/bin/npm"
          if ! (cd "$ROOT" && "$NPM" --prefix "$ROOT" install --omit=dev --no-audit --no-fund); then
            rollback
            (cd "$ROOT" && "$NPM" --prefix "$ROOT" install --omit=dev --no-audit --no-fund) || echo "DEPENDENCY_ROLLBACK_WARNING" >&2
            echo "DEPENDENCY_INSTALL_FAILED: restored prior files" >&2
            exit 1
          fi
          mkdir -p "$ROOT/tmp"
          touch "$ROOT/tmp/restart.txt"
          echo "=== LIVE FILE HASHES ==="
          sha256sum "${TARGETS[@]}"
          for ((i=0; i<${#TARGETS[@]}; i++)); do
            if [[ -n "${BACKUPS[$i]}" ]]; then echo "BACKUP_CREATED=${BACKUPS[$i]}"; else echo "NEW_FILE_INSTALLED=${TARGETS[$i]}"; fi
          done
          echo "NAMECHEAP_REMEMBER_ME_AUTH_DEPLOY_OK"
          rm -rf "$STAGE"
          REMOTE

      - name: Verify the public login pages
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail https://marketing.together-v-egp.com/login | grep -Fq 'تذكرني'
          curl --silent --show-error --fail https://marketing.together-v-egp.com/tn-admin-gateway-7f3c9b2d/ | grep -Fq 'تذكرني'
          echo "PUBLIC_LOGIN_PAGES_REMEMBER_ME_OK"
