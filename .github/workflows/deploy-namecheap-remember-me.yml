name: Deploy remember-me UI patch to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/deploy-namecheap-remember-me.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-remember-me-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the currently deployed compatibility branch
        uses: actions/checkout@v4

      - name: Patch only the remember-me labels and checkbox on two pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          login_path = Path("public/login.html")
          admin_path = Path("public/tn-admin-gateway-7f3c9b2d/index.html")
          login = login_path.read_text(encoding="utf-8")
          admin = admin_path.read_text(encoding="utf-8")

          old_attr = 'data-ar="البقاء قيد تسجيل الدخول حتى تسجيل الخروج" data-en="Keep me signed in until I sign out">البقاء قيد تسجيل الدخول حتى تسجيل الخروج'
          new_attr = 'data-ar="تذكرني" data-en="Remember me">تذكرني'
          old_js = '$("rememberText").textContent=lang==="ar"?"البقاء قيد تسجيل الدخول حتى تسجيل الخروج":"Keep me signed in until I sign out";'
          new_js = '$("rememberText").textContent=lang==="ar"?"تذكرني":"Remember me";'

          assert login.count(old_attr) == 1, "Unexpected login page source; refusing to patch"
          assert login.count(old_js) == 1, "Unexpected login translation source; refusing to patch"
          assert 'rememberMe:$("rememberMe").checked' in login, "Login checkbox handler is missing"
          login = login.replace(old_attr, new_attr, 1)
          login = login.replace(old_js, new_js, 1)

          assert "rememberMe" not in admin, "Admin source already contains a remember-me implementation; refusing duplicate insertion"
          checkbox = '<label class="remember-row" for="rememberMe" style="display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:14px;cursor:pointer"><input id="rememberMe" type="checkbox" style="width:16px;height:16px;accent-color:#60a5fa"><span>تذكرني</span></label>'
          submit = '<button class="btn primary" id="submit" type="submit">تسجيل الدخول</button></form>'
          old_payload = 'body:JSON.stringify({email:$("email").value,password:$("password").value,setupKey})'
          new_payload = 'body:JSON.stringify({email:$("email").value,password:$("password").value,rememberMe:$("rememberMe")?.checked===true,setupKey})'
          assert admin.count(submit) == 1, "Unexpected admin login form; refusing to patch"
          assert admin.count(old_payload) == 1, "Unexpected admin login request; refusing to patch"
          admin = admin.replace(submit, checkbox + submit, 1)
          admin = admin.replace(old_payload, new_payload, 1)

          assert new_attr in login and new_js in login
          assert "البقاء قيد تسجيل الدخول حتى تسجيل الخروج" not in login
          assert login.count('id="rememberMe"') == 1
          assert admin.count('id="rememberMe"') == 1
          assert '<span>تذكرني</span>' in admin
          assert 'rememberMe:$("rememberMe")?.checked===true' in admin

          login_path.write_text(login, encoding="utf-8")
          admin_path.write_text(admin, encoding="utf-8")
          print("PATCH_OK: only the two intended login pages were modified")
          PY
          echo "=== PATCHED FILE HASHES ==="
          sha256sum public/login.html public/tn-admin-gateway-7f3c9b2d/index.html
          echo "=== PATCH VALIDATION ==="
          grep -Fq 'data-ar="تذكرني" data-en="Remember me">تذكرني' public/login.html
          grep -Fq 'textContent=lang==="ar"?"تذكرني":"Remember me";' public/login.html
          grep -Fq '<span>تذكرني</span>' public/tn-admin-gateway-7f3c9b2d/index.html

      - name: Pin the previously verified Namecheap SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer only the two patched HTML files to remote staging
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILES=(
            "public/login.html"
            "public/tn-admin-gateway-7f3c9b2d/index.html"
          )
          REMOTE_STAGE="/home/togeiign/.tn-remember-stage-$RUN_ID"
          tar -czf - "${FILES[@]}" | ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "umask 077; mkdir -p '$REMOTE_STAGE'; tar -xzf - -C '$REMOTE_STAGE'"
          echo "REMOTE_STAGE_READY=$REMOTE_STAGE"

      - name: Back up, atomically install, and verify only those two pages
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          STAGE="/home/togeiign/.tn-remember-stage-$RUN_ID"
          LOGIN="$ROOT/public/login.html"
          ADMIN="$ROOT/public/tn-admin-gateway-7f3c9b2d/index.html"
          LOGIN_REL="public/login.html"
          ADMIN_REL="public/tn-admin-gateway-7f3c9b2d/index.html"

          test -d "$ROOT"
          test -f "$LOGIN" && test ! -L "$LOGIN"
          test -f "$ADMIN" && test ! -L "$ADMIN"
          test -s "$STAGE/$LOGIN_REL"
          test -s "$STAGE/$ADMIN_REL"
          grep -Fq 'data-ar="تذكرني" data-en="Remember me">تذكرني' "$STAGE/$LOGIN_REL"
          grep -Fq 'textContent=lang==="ar"?"تذكرني":"Remember me";' "$STAGE/$LOGIN_REL"
          grep -Fq '<span>تذكرني</span>' "$STAGE/$ADMIN_REL"
          grep -Fq 'rememberMe:$("rememberMe")?.checked===true' "$STAGE/$ADMIN_REL"

          STAMP="$(date +%Y%m%d-%H%M%S)"
          LOGIN_BACKUP="$LOGIN.BACKUP-before-remember-me-$STAMP-$RUN_ID"
          ADMIN_BACKUP="$ADMIN.BACKUP-before-remember-me-$STAMP-$RUN_ID"
          LOGIN_INCOMING="$ROOT/public/.login.html.incoming-$RUN_ID"
          ADMIN_INCOMING="$ROOT/public/tn-admin-gateway-7f3c9b2d/.index.html.incoming-$RUN_ID"

          cp -p "$LOGIN" "$LOGIN_BACKUP"
          cp -p "$ADMIN" "$ADMIN_BACKUP"
          cp "$STAGE/$LOGIN_REL" "$LOGIN_INCOMING"
          cp "$STAGE/$ADMIN_REL" "$ADMIN_INCOMING"
          chmod --reference="$LOGIN" "$LOGIN_INCOMING"
          chmod --reference="$ADMIN" "$ADMIN_INCOMING"
          cmp -s "$STAGE/$LOGIN_REL" "$LOGIN_INCOMING"
          cmp -s "$STAGE/$ADMIN_REL" "$ADMIN_INCOMING"

          rollback() {
            cp -p "$LOGIN_BACKUP" "$LOGIN" || true
            cp -p "$ADMIN_BACKUP" "$ADMIN" || true
            rm -f "$LOGIN_INCOMING" "$ADMIN_INCOMING"
          }

          if ! mv -f "$LOGIN_INCOMING" "$LOGIN"; then
            rollback
            echo "INSTALL_FAILED: login page; original files restored" >&2
            exit 1
          fi
          if ! mv -f "$ADMIN_INCOMING" "$ADMIN"; then
            rollback
            echo "INSTALL_FAILED: admin page; original files restored" >&2
            exit 1
          fi
          if ! cmp -s "$STAGE/$LOGIN_REL" "$LOGIN" || ! cmp -s "$STAGE/$ADMIN_REL" "$ADMIN"; then
            rollback
            echo "VERIFY_FAILED: original files restored" >&2
            exit 1
          fi

          rm -rf "$STAGE"
          echo "BACKUP_LOGIN=$LOGIN_BACKUP"
          echo "BACKUP_ADMIN=$ADMIN_BACKUP"
          echo "=== LIVE HASHES ==="
          sha256sum "$LOGIN" "$ADMIN"
          echo "NAMECHEAP_REMEMBER_ME_DEPLOY_OK"
          REMOTE
