name: Deploy network carry API to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "api/network/agent.js"
      - ".github/workflows/deploy-namecheap-network-carry.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-network-carry-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Validate the carry API source
        shell: bash
        run: |
          set -euo pipefail
          FILE="api/network/agent.js"
          test -s "$FILE"
          grep -Fq 's.carry_right FROM network_bv_settlements' "$FILE"
          grep -Fq 's.week_end <= (date_trunc' "$FILE"
          grep -Fq 's.carry_left FROM network_bv_settlements' "$FILE"
          grep -Fq 'AS carry_right' "$FILE"
          grep -Fq 'AS carry_left' "$FILE"
          sha256sum "$FILE"

      - name: Pin verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Transfer API file to protected temporary path
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          REMOTE_TMP="/home/togeiign/.network-agent.js.carry-$RUN_ID"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '$REMOTE_TMP'" < api/network/agent.js
          echo "API_STAGED=$REMOTE_TMP"

      - name: Back up and atomically install API file
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          TARGET="$ROOT/api/network/agent.js"
          STAGED="/home/togeiign/.network-agent.js.carry-$RUN_ID"
          INCOMING="$ROOT/api/network/.agent.js.incoming-$RUN_ID"
          test -d "$ROOT"
          test -d "$ROOT/api/network"
          test -f "$TARGET"
          test ! -L "$TARGET"
          test -s "$STAGED"
          grep -Fq 's.carry_right FROM network_bv_settlements' "$STAGED"
          grep -Fq 's.week_end <= (date_trunc' "$STAGED"
          grep -Fq 's.carry_left FROM network_bv_settlements' "$STAGED"
          cp "$STAGED" "$INCOMING"
          chmod --reference="$TARGET" "$INCOMING"
          cmp -s "$STAGED" "$INCOMING"
          BACKUP="$TARGET.BACKUP-before-carry-sync-$(date +%Y%m%d-%H%M%S)"
          cp -p "$TARGET" "$BACKUP"
          if ! mv -f "$INCOMING" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            exit 1
          fi
          if ! cmp -s "$STAGED" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            echo "VERIFY_FAILED; restored backup: $BACKUP" >&2
            exit 1
          fi
          sha256sum "$TARGET"
          echo "BACKUP_CREATED=$BACKUP"
          echo "NAMECHEAP_NETWORK_CARRY_API_DEPLOY_OK"
          rm -f "$STAGED" "$INCOMING"
          REMOTE
