name: Deploy admin product orders pagination to Namecheap
on:
  workflow_dispatch:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/admin/products/index.html"
      - ".github/workflows/deploy-namecheap-product-orders.yml"
permissions:
  contents: read
concurrency:
  group: namecheap-admin-product-orders
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Validate the targeted orders page
        shell: bash
        run: |
          set -euo pipefail
          PAGE="public/admin/products/index.html"
          test -s "$PAGE"
          grep -Fq 'طلبات المنتجات' "$PAGE"
          grep -Fq 'const pageSize=20' "$PAGE"
          grep -Fq 'id="pagerTop"' "$PAGE"
          grep -Fq 'id="pagerBottom"' "$PAGE"
          grep -Fq 'function drawPager(' "$PAGE"
          grep -Fq 'aria-current="page"' "$PAGE"
          sha256sum "$PAGE"
      - name: Pin the verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256
      - name: Load Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
      - name: Transfer only the orders page to a private temporary file
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PAGE="public/admin/products/index.html"
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "umask 077; cat > '/home/togeiign/.admin-products-index.html.deploy-$RUN_ID'" < "$PAGE"
      - name: Back up, atomically install and verify only this page
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          TARGET_DIR="$ROOT/public/admin/products"
          TARGET="$TARGET_DIR/index.html"
          STAGED="/home/togeiign/.admin-products-index.html.deploy-$RUN_ID"
          INCOMING="$TARGET_DIR/.index.html.incoming-$RUN_ID"
          test -d "$ROOT" && test -d "$TARGET_DIR"
          test -f "$TARGET" && test ! -L "$TARGET"
          test -s "$STAGED"
          grep -Fq 'const pageSize=20' "$STAGED"
          grep -Fq 'id="pagerTop"' "$STAGED"
          grep -Fq 'id="pagerBottom"' "$STAGED"
          grep -Fq 'function drawPager(' "$STAGED"
          cp "$STAGED" "$INCOMING"
          chmod --reference="$TARGET" "$INCOMING"
          cmp -s "$STAGED" "$INCOMING"
          BACKUP="$TARGET.BACKUP-before-github-sync-$(date +%Y%m%d-%H%M%S)"
          cp -p "$TARGET" "$BACKUP"
          if ! mv -f "$INCOMING" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            exit 1
          fi
          if ! cmp -s "$STAGED" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            echo "VERIFY_FAILED; restored backup: $BACKUP" >&2
            exit 1
          fi
          echo "=== Installed SHA-256 ==="
          sha256sum "$TARGET"
          echo "BACKUP_CREATED=$BACKUP"
          echo "NAMECHEAP_ADMIN_PRODUCT_ORDERS_DEPLOY_OK"
          rm -f "$STAGED" "$INCOMING"
          REMOTE
