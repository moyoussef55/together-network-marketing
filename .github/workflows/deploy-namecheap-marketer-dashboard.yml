name: Deploy marketer dashboard to Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - "public/marketer/dashboard/index.html"

permissions:
  contents: read

concurrency:
  group: namecheap-marketer-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact GitHub revision
        uses: actions/checkout@v4

      - name: Validate the marketer dashboard only
        shell: bash
        run: |
          set -euo pipefail
          PAGE="public/marketer/dashboard/index.html"
          test -s "$PAGE"
          grep -Fq 'id="bvLevelCard"' "$PAGE"
          grep -Fq 'id="moneyIn"' "$PAGE"
          grep -Fq 'id="moneyOut"' "$PAGE"
          grep -Fq 'bv>=3000?"bv-gold":bv>=2000?"bv-silver":bv>=1000?"bv-bronze"' "$PAGE"
          sha256sum "$PAGE"

      - name: Pin the Namecheap server host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Show loaded public-key fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          ssh-add -l -E sha256

      - name: Transfer only the dashboard to a temporary file
        shell: bash
        env:
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PAGE="public/marketer/dashboard/index.html"
          REMOTE_TMP="/home/togeiign/.marketer-dashboard-index.html.deploy-${DEPLOY_RUN_ID}"
          ssh \
            -p "$NAMECHEAP_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$NAMECHEAP_SSH_USER@$NAMECHEAP_SSH_HOST" \
            "umask 077; cat > '$REMOTE_TMP'" < "$PAGE"

      - name: Back up, atomically install, and verify only this dashboard
        shell: bash
        env:
          NAMECHEAP_SSH_HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          NAMECHEAP_SSH_PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          NAMECHEAP_SSH_USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -p "$NAMECHEAP_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$NAMECHEAP_SSH_USER@$NAMECHEAP_SSH_HOST" \
            "bash -s -- '$DEPLOY_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          RUN_ID="$1"
          ROOT="/home/togeiign/marketing-network"
          TARGET_DIR="$ROOT/public/marketer/dashboard"
          TARGET="$TARGET_DIR/index.html"
          STAGED="/home/togeiign/.marketer-dashboard-index.html.deploy-$RUN_ID"
          INCOMING="$TARGET_DIR/.index.html.incoming-$RUN_ID"
          test -d "$ROOT"
          test -d "$TARGET_DIR"
          test -f "$TARGET"
          test ! -L "$TARGET"
          test -s "$STAGED"
          grep -Fq 'id="bvLevelCard"' "$STAGED"
          grep -Fq 'id="moneyIn"' "$STAGED"
          grep -Fq 'id="moneyOut"' "$STAGED"
          cp "$STAGED" "$INCOMING"
          chmod --reference="$TARGET" "$INCOMING"
          cmp -s "$STAGED" "$INCOMING"
          BACKUP="$TARGET.BACKUP-before-github-sync-$(date +%Y%m%d-%H%M%S)"
          cp -p "$TARGET" "$BACKUP"
          if ! mv -f "$INCOMING" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            exit 1
          fi
          if ! cmp -s "$STAGED" "$TARGET"; then
            cp -p "$BACKUP" "$TARGET"
            echo "VERIFY_FAILED; restored backup: $BACKUP" >&2
            exit 1
          fi
          sha256sum "$TARGET"
          echo "BACKUP_CREATED=$BACKUP"
          echo "NAMECHEAP_MARKETER_DASHBOARD_DEPLOY_OK"
          rm -f "$STAGED" "$INCOMING"
          REMOTE
