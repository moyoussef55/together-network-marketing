name: Safely reduce inactive-tab polling on Namecheap

on:
  push:
    branches:
      - namecheap-runtime-prep
    paths:
      - ".github/workflows/deploy-namecheap-polling-optimization.yml"

permissions:
  contents: write

concurrency:
  group: namecheap-polling-optimization-perl-v2
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current deployment branch
        uses: actions/checkout@v4

      - name: Pin the verified Namecheap host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '[server86.web-hosting.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID73iaLX0TvzfqNBhV7rHvhovL8NWH9vzKn5y3eovkWP' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

      - name: Load the Namecheap SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}

      - name: Patch only background polling on the live site
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -T \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" "bash -s -- '$RUN_ID'" <<'REMOTE_BASH'
          set -euo pipefail
          RUN_ID="$1"
          PERL_BIN="$(command -v perl || true)"
          if [ -z "$PERL_BIN" ]; then
            for CANDIDATE in /usr/bin/perl /usr/local/bin/perl /usr/local/cpanel/3rdparty/perl/536/bin/perl /usr/local/cpanel/3rdparty/perl/532/bin/perl; do
              if [ -x "$CANDIDATE" ]; then PERL_BIN="$CANDIDATE"; break; fi
            done
          fi
          if [ -z "$PERL_BIN" ] || [ ! -x "$PERL_BIN" ]; then
            echo "No Perl interpreter found; no files were changed." >&2
            exit 127
          fi
          echo "REMOTE_PERL_BINARY=$PERL_BIN"
          "$PERL_BIN" - "$RUN_ID" <<'REMOTE_PERL'
          use strict;
          use warnings;
          use File::Copy qw(copy);
          use File::Basename qw(dirname basename);
          use Digest::SHA qw(sha256_hex);

          my $root = "/home/togeiign/marketing-network";
          my $run_id = shift @ARGV // "";
          die "Invalid run ID\n" unless $run_id =~ /^[0-9]+$/;
          die "Project root is not a real directory\n" unless -d $root && !-l $root;

          my %plan = (
            "public/admin/index.html" => [
              ["loadAutomaticUpdateStatus();setInterval(loadAutomaticUpdateStatus,30000);",
               "loadAutomaticUpdateStatus();setInterval(()=>{if(!document.hidden)loadAutomaticUpdateStatus()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAutomaticUpdateStatus()});"],
              ["updateSupportBadge();setInterval(updateSupportBadge,8000);",
               "updateSupportBadge();setInterval(()=>{if(!document.hidden)updateSupportBadge()},8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateSupportBadge()});"],
              ["checkNotice();setInterval(checkNotice,30000);",
               "checkNotice();setInterval(()=>{if(!document.hidden)checkNotice()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNotice()});"]
            ],
            "public/admin/recognitions/index.html" => [
              ["setInterval(refreshActivity,15000);",
               "setInterval(()=>{if(!document.hidden)refreshActivity()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshActivity()});"]
            ],
            "public/admin/support-chat/index.html" => [
              ["setInterval(()=>load().catch(()=>{}),8000);",
               "setInterval(()=>{if(!document.hidden)load().catch(()=>{})},8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load().catch(()=>{})});"]
            ],
            "public/marketer/dashboard/index.html" => [
              ["setInterval(loadRecognitionNotificationCount,15000);",
               "setInterval(()=>{if(!document.hidden)loadRecognitionNotificationCount()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadRecognitionNotificationCount()});"],
              ["setInterval(loadMessageCount,15000);",
               "setInterval(()=>{if(!document.hidden)loadMessageCount()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMessageCount()});"]
            ],
            "public/marketer/support/index.html" => [
              ["setInterval(()=>load().catch(()=>{}),8000);",
               "setInterval(()=>{if(!document.hidden)load().catch(()=>{})},8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load().catch(()=>{})});"]
            ]
          );

          sub occurrences {
            my ($text, $needle) = @_;
            my $n = () = $text =~ /\Q$needle\E/g;
            return $n;
          }
          my (%out, @changed);
          for my $rel (sort keys %plan) {
            my $full = "$root/$rel";
            die "Unsafe target path: $rel\n" if -l $full || !-f $full;
            my @parts = split m{/}, $rel;
            pop @parts;
            my $curdir = $root;
            for my $part (@parts) {
              $curdir .= "/$part";
              die "Symlink directory refused: $curdir\n" if -l $curdir;
              die "Directory missing: $curdir\n" unless -d $curdir;
            }
            open my $fh, "<:raw", $full or die "Cannot read $rel: $!\n";
            local $/;
            my $original = <$fh>;
            close $fh;
            my $current = $original;
            my @st = stat($full);
            my $mode = $st[2] & 07777;
            my $mtime = $st[9];
            for my $pair (@{$plan{$rel}}) {
              my ($old, $new) = @$pair;
              my $old_n = occurrences($current, $old);
              my $new_n = occurrences($current, $new);
              if ($old_n == 1 && $new_n == 0) {
                my $idx = index($current, $old);
                $current = substr($current, 0, $idx) . $new . substr($current, $idx + length($old));
              } elsif ($old_n == 0 && $new_n == 1) {
                # Safe retry: this exact change is already present.
              } else {
                die "Preflight stopped without editing any file: $rel old-count=$old_n new-count=$new_n\n";
              }
            }
            for my $pair (@{$plan{$rel}}) {
              die "Patch verification failed: $rel\n"
                unless occurrences($current, $pair->[1]) == 1 && occurrences($current, $pair->[0]) == 0;
            }
            $out{$rel} = { full => $full, original => $original, content => $current, mode => $mode, mtime => $mtime };
            push @changed, $rel if $current ne $original;
          }

          if (!@changed) {
            print "POLLING_ALREADY_OPTIMIZED\n";
          } else {
            my (@backups, @temps);
            eval {
              for my $rel (@changed) {
                my $item = $out{$rel};
                my $backup = $item->{full} . ".BACKUP-before-background-polling-" . $run_id;
                my $temp = dirname($item->{full}) . "/." . basename($item->{full}) . ".incoming-" . $run_id;
                die "Backup already exists: $backup\n" if -e $backup;
                die "Incoming file already exists: $temp\n" if -e $temp;
                copy($item->{full}, $backup) or die "Backup failed for $rel: $!\n";
                chmod($item->{mode}, $backup) or die "Backup chmod failed for $rel: $!\n";
                open my $check, "<:raw", $backup or die "Cannot verify backup for $rel: $!\n";
                local $/;
                my $backup_bytes = <$check>;
                close $check;
                die "Backup verification failed for $rel\n" unless $backup_bytes eq $item->{original};
                push @backups, { rel => $rel, target => $item->{full}, backup => $backup, mode => $item->{mode}, mtime => $item->{mtime} };
                sysopen(my $out_fh, $temp, 0x0001 | 0x0040 | 0x0080, $item->{mode}) or die "Cannot create incoming file for $rel: $!\n";
                binmode($out_fh);
                print {$out_fh} $item->{content} or die "Cannot write incoming file for $rel: $!\n";
                close($out_fh) or die "Cannot close incoming file for $rel: $!\n";
                chmod($item->{mode}, $temp) or die "Incoming chmod failed for $rel: $!\n";
                open my $verify, "<:raw", $temp or die "Cannot read incoming file for $rel: $!\n";
                local $/;
                my $incoming_bytes = <$verify>;
                close $verify;
                die "Incoming verification failed for $rel\n" unless $incoming_bytes eq $item->{content};
                push @temps, { rel => $rel, target => $item->{full}, temp => $temp };
              }
              for my $item (@temps) {
                rename($item->{temp}, $item->{target}) or die "Atomic install failed for $item->{rel}: $!\n";
              }
              for my $rel (@changed) {
                open my $verify, "<:raw", $out{$rel}->{full} or die "Cannot verify installed file $rel: $!\n";
                local $/;
                my $installed = <$verify>;
                close $verify;
                die "Installed verification failed for $rel\n" unless $installed eq $out{$rel}->{content};
              }
              1;
            } or do {
              my $error = $@ || "Unknown install failure\n";
              for my $b (@backups) {
                if (copy($b->{backup}, $b->{target})) {
                  chmod($b->{mode}, $b->{target});
                  utime($b->{mtime}, $b->{mtime}, $b->{target});
                } else {
                  print STDERR "ROLLBACK_FAILED " . $b->{rel} . "\n";
                }
              }
              for my $t (@temps) { unlink($t->{temp}) if -e $t->{temp}; }
              die $error;
            };
            print "LIVE_POLLING_PATCHES_INSTALLED\n";
            for my $rel (@changed) {
              print "BACKUP_CREATED " . $out{$rel}->{full} . ".BACKUP-before-background-polling-" . $run_id . "\n";
            }
          }
          for my $rel (sort keys %plan) {
            open my $fh, "<:raw", $out{$rel}->{full} or die "Cannot hash $rel: $!\n";
            local $/;
            my $bytes = <$fh>;
            close $fh;
            print "LIVE_SHA256 $rel " . sha256_hex($bytes) . "\n";
          }
          print "NAMECHEAP_POLLING_OPTIMIZATION_OK\n";
          REMOTE_PERL
          REMOTE_BASH

      - name: Copy the verified live pages back into the repository workspace
        shell: bash
        env:
          HOST: ${{ secrets.NAMECHEAP_SSH_HOST }}
          PORT: ${{ secrets.NAMECHEAP_SSH_PORT }}
          USER: ${{ secrets.NAMECHEAP_SSH_USER }}
        run: |
          set -euo pipefail
          FILES=(
            "public/admin/index.html"
            "public/admin/recognitions/index.html"
            "public/admin/support-chat/index.html"
            "public/marketer/dashboard/index.html"
            "public/marketer/support/index.html"
          )
          mkdir -p "$RUNNER_TEMP/live-polling-snapshot"
          ssh -T \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "tar -czf - -C /home/togeiign/marketing-network ${FILES[*]}" \
            | tar -xzf - -C "$RUNNER_TEMP/live-polling-snapshot"
          for FILE in "${FILES[@]}"; do
            test -s "$RUNNER_TEMP/live-polling-snapshot/$FILE"
            cp "$RUNNER_TEMP/live-polling-snapshot/$FILE" "$FILE"
            echo "SOURCE_SYNCED_FROM_LIVE $FILE"
            sha256sum "$FILE"
          done

      - name: Save the exact optimized pages in GitHub without triggering broad deployments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/admin/index.html \
            public/admin/recognitions/index.html \
            public/admin/support-chat/index.html \
            public/marketer/dashboard/index.html \
            public/marketer/support/index.html
          if git diff --cached --quiet; then
            echo "GITHUB_SOURCE_ALREADY_SYNCED"
          else
            git commit -m "Pause background polling outside visible pages [skip ci]"
            git push origin HEAD:namecheap-runtime-prep
            echo "GITHUB_SOURCE_SYNC_OK"
          fi
