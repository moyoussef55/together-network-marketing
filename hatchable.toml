[auth]
enabled = true
signup = "open"

[ai]
required = true
providers = ["google"]

[db.tables.wallet_transactions]
read = "own"
write = "member"

[db.tables.wallets]
read = "own"
write = "member"

# network_auth_sessions is accessed only by parameterized server-side auth handlers.

[db.tables.withdrawal_requests]
read = "own"
write = "own"

[[secret]]
name = "AI_PROVIDER"
required = false
description = "AI provider selector used by the server-side SEO generation setup; set to google for Gemini."

[[config]]
name = "app_name"
default = "Together Network Marketing"

[[secret]]
name = "TOGETHER_GMAIL_WEBAPP_URL"
description = "Google Apps Script Web App URL ending in /exec for sending Together welcome emails"

[[secret]]
name = "TOGETHER_GMAIL_SHARED_SECRET"
description = "Shared token that must exactly match SECRET_TOKEN in the Google Apps Script Code.gs"

[[secret]]
name = "ONESIGNAL_APP_ID"
required = false
description = "OneSignal App ID for Together Network Marketing web push notifications"

[[secret]]
name = "ONESIGNAL_REST_API_KEY"
required = false
description = "Server-side OneSignal REST API key used only to send marketer push notifications"

[[secret]]
name = "ONESIGNAL_MARKETING_REST_API_KEY"
required = false
description = "Server-side OneSignal REST API key for the marketing.together-v-egp.com web-push app; keep separate from the legacy Hatchable app"

[[secret]]
name = "TEMP_SOURCE_UPLOAD_TOKEN"
required = false
description = "Optional token for the temporary source upload endpoint; leave unset to keep that endpoint disabled."

[[secret]]
name = "GEMINI_API_KEY"
required = false
description = "Server-side Google Gemini API key reserved for the SEO metadata backend. Never put this key in public files or frontend code."

[[cron]]
path = "/api/jobs/network-bv-weekly"
schedule = "0 * * * *"